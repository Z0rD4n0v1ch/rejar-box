/* ================= ЭКРАН ================= */
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,3);
  const vw=cv.clientWidth||innerWidth,vh=cv.clientHeight||innerHeight;cv.width=Math.round(vw*DPR);cv.height=Math.round(vh*DPR);
  portrait=vh>=vw;
  SC=Math.min(vw/240,vh/(portrait?320:270));
  W=Math.floor(Math.min(portrait?300:440,vw/SC));H=Math.floor(Math.min(560,vh/SC));
  OX=Math.round((vw-W*SC)/2);OY=Math.round((vh-H*SC)/2);
}
addEventListener('resize',layout);

/* ================= ТЕКСТ ================= */
function txt(s,x,y,size,col,align,font){ctx.font=size+'px '+(font||FT);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function txtS(s,x,y,size,col,align,font){ctx.font=size+'px '+(font||FT);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function wrap(s,maxW,size,font){ctx.font=size+'px '+(font||FT);const out=[];
  for(const para of s.split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}out.push(line);}return out;}
function panel(x,y,w,h,fill,edge){ctx.fillStyle=fill||'rgba(14,24,26,.92)';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=edge||'#c9a96a';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);}

/* ================= КНОПКИ МЕНЮ ================= */
let UI=[];
function button(label,x,y,w,h,act,o){o=o||{};const nav=o.nav!==false;const idx=UI.filter(b=>b.nav).length;
  const sel=nav&&ST.sel===idx&&ST.kbd;
  ctx.fillStyle=o.hot?'#c9893a':sel?'#2f5148':'#1b3236';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=sel?'#ffe7a8':o.hot?'#ffd27a':'#5f8a7c';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  txt(label,x+w/2,y+h/2+(o.size||8)*0.36,o.size||8,o.hot?'#21160a':'#f3ead2','center',FD);
  UI.push({x,y,w,h,act,nav});}

/* ================= ВВОД ================= */
const keys=new Set(), touches=new Map();
const inp={ax:0,ay:0,act:false,actP:false,bag:false,menu:false};
let actQ=false,bagQ=false,menuQ=false;
const K_L=['ArrowLeft','KeyA'],K_R=['ArrowRight','KeyD'],K_U=['ArrowUp','KeyW'],K_D=['ArrowDown','KeyS'],K_A=['Space','KeyE','Enter','KeyJ','Digit5','Numpad5'];
const anyK=a=>a.some(k=>keys.has(k));
/* сенсорные элементы поверх карты */
function ctlGeom(){const f=[0.85,1,1.2][CFG.size]||1;
  return {stick:{x:44,y:H-46,r:28*f},act:{x:W-38,y:H-44,r:24*f},bag:{x:W-84,y:H-28,r:15*f},menu:{x:W-14,y:14,r:11}};}
function readInput(){
  let ax=0,ay=0;if(anyK(K_L))ax-=1;if(anyK(K_R))ax+=1;if(anyK(K_U))ay-=1;if(anyK(K_D))ay+=1;
  if(ax&&ay){ax*=0.7071;ay*=0.7071;}
  let act=anyK(K_A);
  for(const t of touches.values()){
    if(t.role==='stick'){const r=24;let dx=(t.x-t.x0)/r,dy=(t.y-t.y0)/r;const m=Math.hypot(dx,dy);
      if(m>0.2){if(m>1){dx/=m;dy/=m;}ax=dx;ay=dy;}}
    if(t.role==='act')act=true;}
  inp.ax=ax;inp.ay=ay;inp.actP=actQ;actQ=false;inp.act=act;inp.bag=bagQ;bagQ=false;inp.menu=menuQ;menuQ=false;
}
function toLogical(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-OX)/SC,y:(e.clientY-r.top-OY)/SC};}
let lastTouch=0;
function pressAt(id,cx,cy,touch){
  auInit();if(touch)lastTouch=Date.now();ST.kbd=false;
  const p=toLogical({clientX:cx,clientY:cy});const e={pointerId:id};
  if(ST.scene==='play'&&!ST.modal){
    const c=ctlGeom();
    if(Math.hypot(p.x-c.menu.x,p.y-c.menu.y)<c.menu.r+6){menuQ=true;return;}
    if(Math.hypot(p.x-c.bag.x,p.y-c.bag.y)<c.bag.r+6){bagQ=true;return;}
    if(Math.hypot(p.x-c.act.x,p.y-c.act.y)<c.act.r+10||(p.x>W*0.55&&p.y>H*0.5)){touches.set(e.pointerId,{role:'act',x:p.x,y:p.y});actQ=true;return;}
    if(p.x<W*0.55&&p.y>H*0.35){touches.set(e.pointerId,{role:'stick',x0:clamp(p.x,26,W*0.55-26),y0:clamp(p.y,H*0.35+26,H-26),x:p.x,y:p.y});return;}
    actQ=true;touches.set(e.pointerId,{role:'act',x:p.x,y:p.y});return;
  }
  for(let i=UI.length-1;i>=0;i--){const b=UI[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){sfx('ui');b.act();return;}}
  actQ=true;touches.set(e.pointerId,{role:'act',x:p.x,y:p.y});
}

const AU={ctx:null,on:store.get('petlya_snd',true),master:null,amb:null,mus:null,musT:0,track:null};
function auInit(){if(AU.ctx){if(AU.ctx.state==='suspended'&&AU.on)AU.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;AU.ctx=new AC();
  AU.master=AU.ctx.createGain();AU.master.gain.value=AU.on?0.55:0;AU.master.connect(AU.ctx.destination);
  /* шум прибоя */
  const n=AU.ctx.sampleRate*4,buf=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=buf.getChannelData(0);let b=0;
  for(let i=0;i<n;i++){b=b*0.97+(Math.random()*2-1)*0.03;d[i]=b*3;}
  const src=AU.ctx.createBufferSource();src.buffer=buf;src.loop=true;const f=AU.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=700;
  const g=AU.ctx.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(AU.master);src.start();AU.amb=g;
}
function setSound(on){AU.on=on;store.set('petlya_snd',on);if(AU.master)AU.master.gain.value=on?0.55:0;}
function tone(f,d,type,vol,slide,delay){const a=AU.ctx;if(!a||!AU.on)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(vol||0.1,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+d+0.02);}
function noise(d,vol,fq,delay){const a=AU.ctx;if(!a||!AU.on)return;const t=a.currentTime+(delay||0);
  const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||1200;
  const g=a.createGain();g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);}
function sfx(k){if(!AU.ctx)return;
  switch(k){
    case 'ui':tone(660,0.05,'square',0.05);break;
    case 'pick':tone(520,0.06,'square',0.07);tone(780,0.08,'square',0.07,0,0.06);break;
    case 'dig':noise(0.12,0.3,400);noise(0.1,0.25,300,0.14);break;
    case 'cast':noise(0.2,0.12,2400);tone(900,0.25,'sine',0.05,0.4);break;
    case 'plop':tone(300,0.12,'sine',0.12,0.5);noise(0.1,0.12,900);break;
    case 'bite':tone(880,0.07,'square',0.08);tone(880,0.07,'square',0.08,0,0.1);break;
    case 'reel':tone(1400,0.02,'square',0.025);break;
    case 'snap':tone(1600,0.06,'sawtooth',0.08,0.3);noise(0.08,0.2,3000);break;
    case 'catch':[523,659,784,1046].forEach((f,i)=>tone(f,0.12,'square',0.07,0,i*0.08));break;
    case 'fire':noise(0.5,0.25,800);noise(0.3,0.15,2000,0.2);break;
    case 'eat':tone(300,0.05,'square',0.06);tone(260,0.05,'square',0.06,0,0.08);break;
    case 'quest':[392,523,659,784].forEach((f,i)=>tone(f,0.16,'triangle',0.1,0,i*0.1));break;
    case 'talk':tone(330+Math.random()*80,0.03,'square',0.025);break;
    case 'step':noise(0.03,0.05,500);break;
    case 'bump':tone(120,0.06,'square',0.04);break;
  }}

function musicTick(){if(!AU.ctx||!AU.on||!AU.track)return;const T=AU.track,st=60/T.bpm/2;
  const now=AU.ctx.currentTime;if(!AU.next||AU.next<now-0.5)AU.next=now+0.05;
  while(AU.next<now+0.25){const i=AU.step||0;const m=T.m[i%T.m.length];if(m)tone(mf(m),st*1.8,'triangle',0.045,0,AU.next-now);
    if(i%4===0){const b=T.b[(i>>2)%T.b.length];tone(mf(b),st*3.5,'triangle',0.05,0,AU.next-now);}
    AU.step=i+1;AU.next+=st;}}

function drawPerson(x,y,dir,step,L,bob){
  x=R(x);y=R(y);
  const sp=SPR['ch_'+L.id];
  if(sp&&sp.ok){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y,7,2.5,0,0,TAU);ctx.fill();
    const walk=step>0;let fr;
    if(dir===0)fr=walk?(G.t>>3)%2:0;else if(dir===3)fr=walk?6+(G.t>>3)%2:6;else fr=walk?4+(G.t>>3)%2:3;
    const fw=sp.fw,fh=sp.fh;
    if(dir===1){const n=sp.img.width/fw;ctx.drawImage(sp.flip||sp.img,(n-1-fr)*fw,0,fw,fh,x-fw/2,y-fh+1-(bob?1:0),fw,fh);}
    else ctx.drawImage(sp.img,fr*fw,0,fw,fh,x-fw/2,y-fh+1-(bob?1:0),fw,fh);
    return;}const s=step%2?1:0,b=bob?1:0;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y,6,2.2,0,0,TAU);ctx.fill();
  // ноги
  const lu=s?1:0,ru=s?0:1;
  if(dir===1||dir===2){px(x-2,y-5-(step?1:0),3,5,L.pants);px(x-2,y-1,3,1,L.shoe);}
  else{px(x-3,y-5,2,5-lu,L.pants);px(x+1,y-5,2,5-ru,L.pants);px(x-3,y-1-lu,2,1,L.shoe);px(x+1,y-1-ru,2,1,L.shoe);}
  const ty=y-11-b;
  // туловище
  px(x-4,ty,8,6,L.shirt);if(L.apron&&dir!==3)px(x-3,ty+2,6,5,L.apron);
  // руки
  const sw=step?(s?1:-1):0;
  if(dir===1){px(x-1+sw,ty+1,2,5,L.shirt);px(x-1+sw,ty+5,2,1,L.skin);}
  else if(dir===2){px(x-1-sw,ty+1,2,5,L.shirt);px(x-1-sw,ty+5,2,1,L.skin);}
  else{px(x-6,ty+1+(sw>0?1:0),2,4,L.shirt);px(x+4,ty+1+(sw<0?1:0),2,4,L.shirt);px(x-6,ty+5+(sw>0?1:0),2,1,L.skin);px(x+4,ty+5+(sw<0?1:0),2,1,L.skin);}
  // голова
  const hy=ty-7;px(x-3,hy,6,7,L.skin);
  if(L.beard&&dir!==3)px(x-3,hy+4,6,3,L.beard);
  // волосы
  px(x-3,hy-1,6,2,L.hair);
  if(dir===3)px(x-3,hy,6,5,L.hair);
  else if(dir===1){px(x,hy,3,4,L.hair);}
  else if(dir===2){px(x-3,hy,3,4,L.hair);}
  else{px(x-3,hy,1,3,L.hair);px(x+2,hy,1,3,L.hair);}
  if(L.style===1&&dir!==0)px(dir===1?x+2:dir===2?x-4:x-3,hy+2,dir===3?6:2,dir===3?6:5,L.hair);
  if(L.style===1&&dir===0){px(x-4,hy+1,1,6,L.hair);px(x+3,hy+1,1,6,L.hair);}
  if(L.style===3&&dir!==3)px(x-3,hy-2,6,1,'#f2efe6');
  // глаза
  if(dir===0){px(x-2,hy+3,1,1,'#1a1410');px(x+1,hy+3,1,1,'#1a1410');}
  else if(dir===1)px(x-2,hy+3,1,1,'#1a1410');
  else if(dir===2)px(x+1,hy+3,1,1,'#1a1410');
}

function drawPalm(x,y,t,k){if(SPR.o_palm1&&SPR.o_palm1.ok){shadow(x+(k%2?-4:4),y,14,4);spr(k%3===1?'o_palm2':'o_palm1',x,y,k%2===1);return;}x=R(x);y=R(y);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x+6,y,12,4,0,0,TAU);ctx.fill();
  const lean=(k%3)-1;
  for(let i=0;i<10;i++){const yy=y-i*3,xx=x+R(lean*i*0.4);px(xx-2,yy-3,4,3,i%2?'#8a6a42':'#a07c4e');}
  const tx=x+R(lean*4),ty=y-31,sw=Math.sin(t*0.02+k)*1.2;
  ctx.fillStyle='#2f6b2a';
  for(let a=0;a<6;a++){const an=a/6*TAU+0.3;ctx.beginPath();ctx.ellipse(tx+Math.cos(an)*9+sw,ty+Math.sin(an)*5,10,3.2,an,0,TAU);ctx.fill();}
  ctx.fillStyle='#4a9a3a';
  for(let a=0;a<6;a++){const an=a/6*TAU+0.3;ctx.beginPath();ctx.ellipse(tx+Math.cos(an)*8+sw,ty+Math.sin(an)*4-1,7,2,an,0,TAU);ctx.fill();}
  px(tx-3,ty+1,3,3,'#6a4a22');px(tx+1,ty+2,3,3,'#5c3e1c');
}

/* ---- Джунгли за лагерем: железное дерево, ручей ---- */
function genJungle(){
  const w=40,h=30,m=[];
  const sx=y=>26*TS+Math.sin(y*0.021+0.5)*22+Math.sin(y*0.057)*6;   /* русло ручья */
  const P4=[[19,17],[20,11],[19,5],[20,-1]],P=[[20,30],[20,24],[19,17],[13,13],[8,11]],P2=[[19,17],[24,15.5],[29,15],[32,10],[32,8]],P3=[[29,15],[31,19],[34,22]];
  const segD=(x,y,L)=>{let d=1e9;for(let i=0;i<L.length-1;i++){const ax=L[i][0]*TS+8,ay=L[i][1]*TS+8,bx=L[i+1][0]*TS+8,by=L[i+1][1]*TS+8;
    const vx=bx-ax,vy=by-ay,t=clamp(((x-ax)*vx+(y-ay)*vy)/(vx*vx+vy*vy),0,1);d=Math.min(d,Math.hypot(x-ax-vx*t,y-ay-vy*t));}return d;};
  const pd=(x,y)=>Math.min(segD(x,y,P),segD(x,y,P2),segD(x,y,P3),S.st>=36||S.f.shrineOpen?segD(x,y,P4):1e9);
  const clear=[[8,10,46],[32,8,44],[34,21,44],[19,17,52],[24,7,30],[24,24,30]];
  const terr=(x,y)=>{const d=pd(x,y);
    const ws=Math.abs(x-sx(y));const ford=Math.abs(y-15.5*TS)<11;
    if(ws<11&&!ford)return 1;
    if(d<13)return 7;
    const edge=Math.min(x,w*TS-x,y,h*TS-y+(Math.abs(x-20*TS)<30?99:0));
    const wav=Math.sin(x*0.07)*6+Math.sin(y*0.09+1)*6;
    if(edge<34+wav)return 5;
    let near=d<40||ws<30;for(const c of clear)if(Math.hypot(x-c[0]*TS-8,y-c[1]*TS-8)<c[2])near=true;
    const v=Math.sin(x*0.021+1)*Math.sin(y*0.027+2)+Math.sin(x*0.009+y*0.013)*0.6;

function unstick(P){for(let r=2;r<=64;r+=2)for(let a=0;a<16;a++){const x=P.x+Math.cos(a*Math.PI/8)*r,y=P.y+Math.sin(a*Math.PI/8)*r;
  if(x>6&&x<Z.w*TS-6&&y>8&&y<Z.h*TS-4&&!blocked(x,y,4,4)){P.x=x;P.y=y;return;}}}
function updPlayer(){
  const P=S.p;if(G.F){updFish();return;}
  const sp=0.95;let ax=inp.ax,ay=inp.ay;const m=Math.hypot(ax,ay);
  if(m>0.1){
    if(Math.abs(ax)>Math.abs(ay))P.dir=ax<0?1:2;else P.dir=ay<0?3:0;
    const vx=ax*sp,vy=ay*sp,ox=P.x,oy=P.y;
    if(blocked(P.x,P.y,4,4))unstick(P);
    if(!blocked(P.x+vx,P.y,4,4))P.x+=vx;else if(Math.abs(vx)>0.3&&G.t%20===0)sfx('bump');
    if(!blocked(P.x,P.y+vy,4,4))P.y+=vy;
    if(++G.stepT>9){G.stepT=0;G.step=G.step?0:1;if(G.step)sfx('step');}
    for(const e of Z.exits){if(P.x>=e.x&&P.x<=e.x+e.w&&P.y>=e.y&&P.y<=e.y+e.h){
      if(e.to&&(!e.need||S.st>=e.need)){changeZone(e.to,e.tx,e.ty);return;}
      const tw=(e.y<=0&&vy<0)||(e.y+e.h>=Z.h*TS&&vy>0)||(e.x<=0&&vx<0)||(e.x+e.w>=Z.w*TS&&vx>0);if(!tw)continue;
      /* закрытый проход: вернуть на прошлое место и чуть отодвинуть, но только на свободную клетку */
      P.x=ox;P.y=oy;const nx=e.x<=0?6:e.x+e.w>=Z.w*TS?-6:0,ny=e.y<=0?6:e.y+e.h>=Z.h*TS?-6:0;
      if(!blocked(P.x+nx,P.y+ny,4,4)){P.x+=nx;P.y+=ny;}
      if(e.msg&&(!G.exitT||G.t-G.exitT>120)){toast(tl(e.msg));G.exitT=G.t;}}}
  }else{G.step=0;G.stepT=0;}
  P.x=clamp(P.x,6,Z.w*TS-6);P.y=clamp(P.y,8,Z.h*TS-4);
  G.near=findNear();
  if(inp.actP&&G.near)doAction(G.near);
  else if(!G.near&&inv('bow')&&Z.hunt){/* лук: держать — натянуть, отпустить — выстрел */
    if(inp.act){if(!G.bow){if(inp.actP){if(inv('arrow')>0)G.bow={p:0};else toast(tl('Нет стрел. Их продаёт Ваина.'));}}else G.bow.p=Math.min(1,G.bow.p+0.025);}
    else if(G.bow){shoot(G.bow.p);G.bow=null;}}
  if(G.bow&&!inp.act){shoot(G.bow.p);G.bow=null;}
  if(inp.bag){openBag();}
  if(inp.menu){openPause();}
}
function front(d){const P=S.p,v=DIRV[P.dir];return {x:P.x+v[0]*d,y:P.y-3+v[1]*d};}
function findNear(){
  const P=S.p,f=front(10);let best=null,bd=1e9;
  const cand=(kind,label,obj,x,y,r)=>{const d=Math.hypot(f.x-x,f.y-y);if(d<r&&d<bd){bd=d;best={kind,label,obj};}};
  for(const n of Z.npc)cand('talk','ГОВОРИТЬ',n,n.x,n.y-4,16);
  for(const o of Z.O){if(o.hidden||o.gone)continue;
    if(o.type==='wood'||o.type==='log'||o.type==='crate')cand('take','ВЗЯТЬ',o,o.x,o.y-3,14);
    else if(o.type==='dig')cand('dig','КОПАТЬ',o,o.x,o.y,13);
    else if(o.type==='fire')cand('fire',S.f.fire?'КОСТЁР':'ЗАЖЕЧЬ',o,o.x,o.y-2,18);
    else if(o.type==='raft'&&S.st>=10)cand('raft','ПЛОТ',o,o.x,o.y-6,22);
    else if((o.type==='shell'&&!o.deco)||o.type==='cap'||o.type==='birdItem')cand('take','ВЗЯТЬ',o,o.x,o.y,12);
    else if(o.type==='vfire')cand('fire','КОСТЁР',o,o.x,o.y-2,18);
    else if(o.type==='cave')cand(inv('torch')&&S.st>=31?'enter':'look',inv('torch')&&S.st>=31?'ВОЙТИ':'СМОТРЕТЬ',o,o.x,o.y-6,22);
    else if(o.type==='wreck2')cand('look','СМОТРЕТЬ',o,o.x,o.y-4,22);
    else if(o.type==='itree'&&!o.cut)cand('chop','РУБИТЬ',o,o.x,o.y-4,20);
    else if(o.type==='itree'&&o.cut&&S.st>=29&&!S.f['res_'+o.id])cand('resin','СОБРАТЬ',o,o.x,o.y-2,16);
    else if(o.type==='rubble')cand('dig2','РАЗОБРАТЬ',o,o.x,o.y-4,24);
    else if(o.type==='skel'||o.type==='slab')cand('look','СМОТРЕТЬ',o,o.x,o.y-4,20);
    else if(o.type==='flash')cand('take','ВЗЯТЬ',o,o.x,o.y-2,12);
    else if(o.type==='cfire'||o.type==='sfire')cand('fire','КОСТЁР',o,o.x,o.y-2,18);
    else if(o.type==='statue'&&S.st===40&&!S.f['placed'+o.k]&&inv(['stone_f','stone_w','stone_b'][o.k]))cand('place','ВСТАВИТЬ',o,o.x,o.y-4,20);
    else if(o.type==='statue'||o.type==='altar')cand('look','СМОТРЕТЬ',o,o.x,o.y-4,20);
    else if(o.type==='pit')cand('down','СПУСТИТЬСЯ',o,o.x,o.y-4,26);
    else if(o.type==='rope')cand('up','ПОДНЯТЬСЯ',o,o.x,o.y-2,16);
    else if(o.type==='sdoor')cand('look','СМОТРЕТЬ',o,o.x,o.y-4,20);
    else if(o.type==='rmap'||o.type==='knife')cand('take','ВЗЯТЬ',o,o.x,o.y-6,16);
    else if(o.type==='brazier'&&!o.lit&&!S.f.trialF&&S.st>=37)cand('light','ЗАЖЕЧЬ',o,o.x,o.y-4,16);
    else if(o.type==='stoneItem')cand('take','ВЗЯТЬ',o,o.x,o.y-4,14);
    else if(o.type==='oldcamp')cand('look','ОСМОТРЕТЬ',o,o.x,o.y-4,26);
    else if(o.type==='lab')cand('lab',S.st===49?'МИКРОСКОП':'СМОТРЕТЬ',o,o.x,o.y-2,28);
    else if(o.type==='heli')cand('look','СМОТРЕТЬ',o,o.x-6,o.y-8,40);
    else if(o.type==='herb'||o.type==='vial')cand('take','ВЗЯТЬ',o,o.x,o.y-2,13);}
  if(!best&&inv('rod')&&(Z.shoreF||Z.pool)){for(let d=8;d<=26;d+=6){const p=front(d);if(isWater(p.x,p.y)){best={kind:'fish',label:'ЛОВИТЬ',obj:null};break;}}}
  return best;
}

    if(inv('log')){const k=inv('log');S.raft=Math.min(5,S.raft+k);take('log',k);sfx('dig');toast(tl('Плот: брёвен ')+S.raft+'/5');storyEvent('raft');saveGame();}
    else toast(S.raft>=5?tl('Каркас плота готов. Нужно ещё много работы.'):tl('Нужны брёвна. Море выносит их на берег.'));

    o.hits=(o.hits||0)+1;o.shake=12;sfx('dig');puff(o.x+rnd(-10,10),o.y-8,'#8a8478');
    if(o.hits>=4){o.gone=1;S.f['gone_'+o.id]=1;sfx('snap');toast(tl('Проход свободен.'));storyEvent('rubble');saveGame();}
    else toast(tl('Разбираешь завал… ')+o.hits+'/4');
    return;}
  if(n.kind==='chop'){
    if(!inv('axe')){toast(tl('Железное дерево. Голыми руками его не взять — нужен топор.'));return;}
    if(S.st<20){toast(tl('Крепкое дерево. Олафу такое пригодится для плота.'));return;}
    o.hits=(o.hits||0)+1;o.shake=12;sfx('dig');puff(o.x+(S.p.x<o.x?-6:6),o.y-10,'#c8a070');
    if(o.hits>=5){o.cut=1;o.solid=[12,5];S.f['cut_'+o.id]=1;give('hlog',1,true);sfx('snap');
      toast(tl('Железное бревно')+' ('+inv('hlog')+'/3)');storyEvent('chop');saveGame();}
    else toast(tl('Рубишь… ')+o.hits+'/5');

      if(G.fseq>=3){S.f.trialF=1;Z.O.push({type:'stoneItem',k:'stone_f',x:Z.O.find(q=>q.id==='st0').x,y:Z.O.find(q=>q.id==='st0').y+16});storyEvent('trialF');saveGame();}}
    else{for(const b of Z.O)if(b.type==='brazier')b.lit=0;G.fseq=0;sfx('snap');toast(tl('Огни гаснут. Порядок неверен.'));}
    return;}

  if(n.kind==='down'){changeZone('vault',13*TS+8,7*TS+8);return;}
  if(n.kind==='up'){changeZone('shrine',20*TS+8,17*TS+4);return;}

    else openDialog([{w:'nick',s:S.st>=13&&!S.f.gone_cap?'Вторая шлюпка… Пустая. Рядом что-то лежит на песке.':'Вторая шлюпка. Тех, кто в ней был, здесь нет.'}]);return;}

function puff(x,y,c){for(let i=0;i<8;i++)G.fx.push({x,y:y-3,vx:rnd(-0.8,0.8),vy:rnd(-1.2,-0.2),t:0,life:ri(16,26),c:c||'#e8dcc0'});}

function fireAction(o){
  if(o.type!=='vfire'&&!S.f.fire){
    if(S.st<1){toast(tl('Костровище. Нужны дрова.'));return;}
    if(inv('wood')<3){toast(tl('Нужно 3 плавника, есть ')+inv('wood')+'.');return;}
    take('wood',3);S.f.fire=1;sfx('fire');puff(o.x,o.y-4,'#ffcf6a');storyEvent('fire');saveGame();return;}
  const opts=[];
  if(o.type==='sfire'){if(inv('torch'))opts.push({label:tl('ЗАЖЕЧЬ ФАКЕЛ'),act:()=>{S.torchT=TORCH;sfx('fire');toast(tl('Факел горит.'));}});}
  if(o.type==='cfire'){if(inv('torch'))opts.push({label:tl('ЗАЖЕЧЬ ФАКЕЛ'),act:()=>{S.torchT=TORCH;sfx('fire');toast(tl('Факел горит.'));}});
    opts.push({label:tl('ОТМЕНА'),act:()=>{}});openChoice(tl('Костёр у входа'),opts);return;}
  if(inv('resin')&&!inv('torch'))opts.push({label:tl('СДЕЛАТЬ ФАКЕЛ'),act:()=>{take('resin');give('torch');S.torchT=TORCH;sfx('fire');storyEvent('torch');saveGame();}});
  if(inv('torch')&&S.torchT<TORCH)opts.push({label:tl('ЗАЖЕЧЬ ФАКЕЛ'),act:()=>{S.torchT=TORCH;sfx('fire');toast(tl('Факел горит.'));saveGame();}});
  if(S.st===25&&inv('herb')>=3)opts.push({label:tl('СВАРИТЬ ОТВАР'),act:()=>{take('herb',3);give('medicine');sfx('fire');storyEvent('brew');saveGame();}});
  const raw=Object.keys(S.inv).filter(k=>ITEMS[k]&&ITEMS[k].ck);
  if(raw.length&&S.f.recipe)for(const k of raw)opts.push({label:tl('ГОТОВИТЬ: ')+tl(ITEMS[k].n).toUpperCase(),act:()=>cook(k)});
  else if(raw.length)opts.push({label:tl('ГОТОВИТЬ'),act:()=>toast(tl('Не знаю, как это приготовить. Спроси Сайруса.'))});
  opts.push({label:isNight()?tl('СПАТЬ ДО УТРА'):tl('ВЗДРЕМНУТЬ ДО ВЕЧЕРА'),act:()=>sleep()});
  opts.push({label:tl('ОТМЕНА'),act:()=>{}});
  openChoice(tl('Костёр'),opts);
}
function cook(k){take(k);give(ITEMS[k].ck,1,true);sfx('fire');toast(tl('Приготовлено: ')+tl(ITEMS[ITEMS[k].ck].n));S.f.cooked=(S.f.cooked||0)+1;storyEvent('cook');saveGame();}
function eat(k){const it=ITEMS[k];take(k);S.food=Math.min(100,S.food+it.food);S.hp=Math.min(100,S.hp+(it.hp||0));sfx('eat');

}
function updSleep(){G.sleepT++;
  if(G.sleepT===60){const night=isNight();const h=hour();
    let add;if(night){add=((6-h)+24)%24*60;}else add=Math.max(60,(19-h)*60);

function updTime(){

/* ================= РЫБАЛКА ================= */
const FISH={
  f_mack:{w:[0.4,1.2],str:0.9,day:1,night:0.3},
  f_bass:{w:[0.8,2.6],str:1.3,day:0.4,night:0.3},
  f_parrot:{w:[0.6,1.8],str:1.1,day:0.25,night:0,hours:[10,16]},
  f_eel:{w:[0.9,3.2],str:1.5,day:0,night:0.6},
  f_moon:{w:[1.4,2.8],str:1.25,day:0,night:0}};
function rollFish(){if(Z.pool)return 'f_moon';const h=hour(),n=isNight(),pool=[];
  for(const k in FISH){const f=FISH[k];let wgt=n?f.night:f.day;if(f.hours&&(h<f.hours[0]||h>f.hours[1]))wgt=0;if(wgt>0)pool.push([k,wgt]);}
  let s=pool.reduce((a,b)=>a+b[1],0)*Math.random();for(const [k,w] of pool){if((s-=w)<=0)return k;}return pool[0][0];}
function startFish(){
  if(Z.pool){if(S.f.trialW){toast(tl('Пруд затих. Больше здесь ничего не клюёт.'));return;}
    if(!isNight()){toast(tl('В тёмной воде ничего не шевелится. Статуя говорит о луне…'));return;}}
  if(!inv('worm')){toast(tl('Нужна наживка. Накопай червей в рыхлой земле.'));return;}
  let p=null;for(let d=40;d>=12;d-=4){const q=front(d);if(isWater(q.x,q.y)){p=q;break;}}
  if(!p)return;take('worm');sfx('cast');
  G.F={ph:'cast',t:0,bx:p.x,by:p.y,sx:S.p.x,sy:S.p.y-14,wait:ri(100,320)};
}
function updFish(){const F=G.F;F.t++;
  if(F.ph==='cast'){if(F.t>=22){F.ph='wait';F.t=0;sfx('plop');}return;}
  if(F.ph==='wait'){if(inp.actP){G.F=null;toast(tl('Ты вытащил пустой крючок. Наживка пропала.'));return;}
    if(F.t>=F.wait){F.ph='bite';F.t=0;F.kind=rollFish();sfx('bite');}return;}
  if(F.ph==='bite'){if(inp.actP){const f=FISH[F.kind];F.ph='reel';F.t=0;F.d=100;F.T=0;F.res=false;F.rt=ri(40,90);F.str=f.str;F.wt=+rnd(f.w[0],f.w[1]).toFixed(1);return;}
    if(F.t>48){G.F=null;toast(tl('Сорвалась! И наживку съела.'));}return;}
  if(F.ph==='reel'){
    if(--F.rt<=0){F.res=!F.res;F.rt=F.res?ri(35,80):ri(45,110);if(F.res)sfx('bite');}
    const hold=inp.act;
    if(hold){if(F.res){F.T+=1.6*F.str;F.d-=0.12;}else{F.T=Math.max(0,F.T-0.6);F.d-=0.55/F.str;if(G.t%6===0)sfx('reel');}}
    else{F.T=Math.max(0,F.T-1.4);F.d+=F.res?0.35*F.str:0.08;}
    if(F.T>=100){G.F=null;sfx('snap');toast(tl('Леска лопнула! Не тяни, когда рыба рвётся (леска красная).'));return;}
    if(F.d>=140){G.F=null;toast(tl('Рыба ушла…'));return;}
    if(F.d<=0){F.ph='done';F.t=0;sfx('catch');give(F.kind,1,true);const nw=!S.coll[F.kind];S.coll[F.kind]=Math.max(S.coll[F.kind]||0,F.wt);F.nw=nw;storyEvent('fish',F.kind);saveGame();}
    return;}
  if(F.ph==='done'){if(F.t>30&&inp.actP||F.t>240)G.F=null;}
}

/* ================= ЛУК И ОХОТА ================= */
function shoot(p){if(!inv('arrow'))return;take('arrow');sfx('cast');
  const v=DIRV[S.p.dir],sp=2.2+p*3.2;G.arrows.push({x:S.p.x+v[0]*6,y:S.p.y-10+v[1]*4,vx:v[0]*sp,vy:v[1]*sp,life:16+p*42,dir:S.p.dir});}
function updHunt(){
  for(let i=G.arrows.length-1;i>=0;i--){const a=G.arrows[i];a.x+=a.vx;a.y+=a.vy;a.life--;
    for(const b of G.birds){if(!b.dead&&Math.abs(b.x-a.x)<7&&Math.abs(b.y-6-a.y)<7){b.dead=1;a.life=0;sfx('snap');
      Z.O.push({type:'birdItem',x:b.x,y:b.y});puff(b.x,b.y-4,'#f0e8d8');}}
    {const tt=tileAtP(a.x,a.y+10);if(a.life<=0||tt===5||tt===6)G.arrows.splice(i,1);}}
  updBoar();
  if(!Z.hunt)return;const P=S.p,h=Z.hunt;
  for(const b of G.birds){if(b.dead)continue;b.t++;const d=Math.hypot(b.x-P.x,b.y-P.y);
    if(d<46){const k=1.15/Math.max(d,1);b.vx=(b.x-P.x)*k;b.vy=(b.y-P.y)*k;b.run=1;}
    else{b.run=0;if(b.t%90===0){const a=rnd(0,TAU);b.vx=Math.cos(a)*0.25;b.vy=Math.sin(a)*0.25;}if(b.t%90>50){b.vx*=0.9;b.vy*=0.9;}}
    const nx=b.x+b.vx,ny=b.y+b.vy;if(nx>h.x0-40&&nx<h.x1+20&&!T_SOLID[tileAtP(nx,ny)])b.x=nx;else b.vx*=-1;
    if(ny>h.y0-30&&ny<h.y1+20&&!T_SOLID[tileAtP(b.x,ny)])b.y=ny;else b.vy*=-1;}
  G.birds=G.birds.filter(b=>!b.dead);if(G.birds.length<3&&G.t%600===0)spawnBird();
}
/* ================= КАБАН (испытание зверя) ================= */
function updBoar(){const b=G.boar;if(!b||b.dead)return;const P=S.p,h=Z.hunt;b.t++;
  for(let i=G.arrows.length-1;i>=0;i--){const a=G.arrows[i];if(Math.abs(b.x-a.x)<10&&Math.abs(b.y-7-a.y)<8){G.arrows.splice(i,1);b.hp--;sfx('snap');puff(b.x,b.y-6,'#c05a5a');
    if(b.hp<=0){b.dead=1;S.f.boarDead=1;Z.O.push({type:'stoneItem',k:'stone_b',x:b.x,y:b.y});give('boarmeat',1,true);storyEvent('boar');saveGame();return;}
    b.state='stun';b.st=24;toast(tl('Попадание! Ещё ')+b.hp+'.');}}
  const d=Math.hypot(P.x-b.x,P.y-b.y);
  if(b.state==='stun'){if(--b.st<=0)b.state='roam';return;}
  if(b.state==='roam'){if(b.t%80===0){const a=rnd(0,TAU);b.vx=Math.cos(a)*0.35;b.vy=Math.sin(a)*0.25;}
    if(d<62&&b.t>60){b.state='charge';b.st=70;const k=1.55/Math.max(d,1);b.vx=(P.x-b.x)*k;b.vy=(P.y-b.y)*k;sfx('bump');}}
  else if(b.state==='charge'){if(--b.st<=0){b.state='roam';b.t=1;}
    if(d<11){S.hp=Math.max(1,S.hp-12);sfx('bump');const k=14/Math.max(d,1);const nx=P.x+(P.x-b.x)*k,ny=P.y+(P.y-b.y)*k;if(!blocked(nx,ny,4,4)){P.x=nx;P.y=ny;}
      if(!G.boarHint){G.boarHint=1;toast(tl('Кабан бьёт клыками! Стреляй издалека.'));}b.state='stun';b.st=50;b.vx*=-1;}}
  const nx=b.x+b.vx,ny=b.y+b.vy;
  if(nx>h.x0-30&&nx<h.x1+20&&!T_SOLID[tileAtP(nx,ny)])b.x=nx;else b.vx*=-1;
  if(ny>h.y0-30&&ny<h.y1+20&&!T_SOLID[tileAtP(b.x,ny)])b.y=ny;else b.vy*=-1;}
/* ================= ТИМ ИДЁТ ЗА НИКОМ ================= */
function updFollow(){if(!S.f.timFollow)return;const P=S.p;G.trail.push({x:P.x,y:P.y,dir:P.dir});if(G.trail.length>22)G.trail.shift();
  const t=G.trail[0];if(!G.tim)G.tim={x:P.x,y:P.y+2,dir:P.dir};const T=G.tim;const d=Math.hypot(P.x-T.x,P.y-T.y);
  if(d>18){T.x=lerp(T.x,t.x,0.12);T.y=lerp(T.y,t.y,0.12);T.dir=t.dir;T.walk=1;}else T.walk=0;}

function openTrade(){
  const PR={f_mack:2,f_bass:3,f_parrot:4,f_eel:5,c_mack:4,c_bass:5,c_parrot:6,c_eel:7,bird:3,c_bird:6};
  const sellable=Object.keys(S.inv).filter(k=>PR[k]);
  const opts=[];
  if(sellable.length){const sum=sellable.reduce((a,k)=>a+PR[k]*inv(k),0);
    opts.push({label:tl('ПРОДАТЬ ЕДУ: +')+sum+tl(' РАКУШЕК'),act:()=>{for(const k of sellable)take(k,inv(k));give('shell',sum,true);sfx('catch');toast(tl('Ракушки: ')+inv('shell'));saveGame();}});}
  opts.push({label:tl('СТРЕЛЫ ×10 — 3 РАКУШКИ'),act:()=>{if(inv('shell')<3){toast(tl('Не хватает ракушек.'));return;}take('shell',3);give('arrow',10);saveGame();}});
  if(!inv('rod2'))opts.push({label:tl('КРЕПКАЯ УДОЧКА — 12 РАКУШЕК'),act:()=>{if(inv('shell')<12){toast(tl('Не хватает ракушек.'));return;}take('shell',12);give('rod2');saveGame();}});
  opts.push({label:tl('УЙТИ'),act:()=>{}});
  openChoice(tl('Ваина: ракушек ')+inv('shell'),opts);
}

function updDialog(){const l=DLG.L[DLG.i],s=tl(l.s);
  if(DLG.n<s.length){DLG.n=Math.min(s.length,DLG.n+(l.dark?0.9:1.4));if(G.t%4===0&&!l.dark&&l.w!=='narr')sfx('talk');}
  if(inp.actP){if(DLG.n<s.length)DLG.n=s.length;else{DLG.i++;DLG.n=0;if(DLG.i>=DLG.L.length){const f=DLG.onEnd;DLG=null;ST.modal=null;if(f)f();}}}}

function camera(){const P=S.p,mw=Z.w*TS,mh=Z.h*TS;
  G.cam.x=mw<=W?R((mw-W)/2):R(clamp(P.x-W/2,0,mw-W));G.cam.y=mh<=H?R((mh-H)/2):R(clamp(P.y-H/2-10,0,mh-H));}
function drawWorld(){
  camera();const cx=G.cam.x,cy=G.cam.y,t=G.t;
  ctx.fillStyle=Z.shoreF?'#1a4a5a':'#173a1e';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-cx,-cy);if(G.shake>0){G.shake--;ctx.translate(R(Math.sin(G.t*1.7)*2*Math.min(1,G.shake/10)),R(Math.cos(G.t*2.3)*1.5*Math.min(1,G.shake/10)));}
  ctx.drawImage(ground,0,0);
  // вода: блики и прибой вдоль плавного берега
  if(!G.groundTex&&SPR.t_sand&&SPR.t_sand.ok)buildGround();
  if(Z.shoreF){const x0=Math.max(0,cx-4),x1=Math.min(Z.w*TS,cx+W+4);
    for(let x=x0;x<x1;x+=2){const sh=Z.shoreF(x),w1=Math.sin(t*0.03+x*0.03)*2.5;
      ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(x,R(sh+6+w1),2,2);
      ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(x,R(sh+3+w1*1.6),2,1);
      if(hash(x,7)>0.8){const ph=Math.sin(t*0.05+x);if(ph>0.6){ctx.fillStyle='rgba(230,250,255,.5)';ctx.fillRect(x,R(sh+14+hash(x,3)*40),3,1);}}}}
  // плоское
  for(const o of Z.O){if(o.hidden||o.gone)continue;if(o.type==='dig')drawDig(o.x,o.y,S.f['dug_'+o.id]===S.day);if(o.type==='shell'){drawShell(o.x,o.y,o.k);glint(o.x-2,o.y);}if(o.type==='prints'&&S.st>=13&&S.st<15)drawPrints(o.x,o.y);}
  // объекты по глубине
  const list=[];
  for(const o of Z.O){if(o.hidden||o.gone||o.type==='dig'||o.type==='shell'||o.type==='prints')continue;if(o.type==='skel'){drawSkel(o.x,o.y);continue;}if(o.type==='raft'&&S.st<10)continue;list.push({y:o.y,o});}
  for(const n of Z.npc)list.push({y:n.y,n});
  list.push({y:S.p.y,p:1});
  for(const b of G.birds||[])list.push({y:b.y,b});
  if(G.boar&&!G.boar.dead)list.push({y:G.boar.y,boar:1});
  if(G.tim&&S.f.timFollow)list.push({y:G.tim.y,tim:1});
  list.sort((a,b)=>a.y-b.y);
  for(const e of list){
    if(e.p){drawPerson(S.p.x,S.p.y,S.p.dir,G.step,heroL(),G.step);
      if(Z.dark&&S.torchT>0){const v=DIRV[S.p.dir],hx=R(S.p.x+(S.p.dir===1?-7:7)),hy=R(S.p.y-12);const sp=SPR.i_torch;
        if(sp&&sp.ok)ctx.drawImage(sp.img,hx-4,hy-8,8,14);else{px(hx,hy-2,1,8,'#7a5a3a');px(hx-1,hy-5,3,3,'#ffb040');}
        if(t%6<3)px(hx+R(Math.sin(t*0.7)),hy-10,1,1,'#ffd070');}
      if(G.F&&G.F.ph!=='done'){/* удочка */const P=S.p,v=DIRV[P.dir],hx=P.x+v[0]*6,hy=P.y-12+(P.dir===3?-2:0),tx=hx+v[0]*8,ty=hy-8;
        ctx.strokeStyle='#8a6a42';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx,ty);ctx.stroke();G.F.tip={x:tx,y:ty};}
      continue;}
    if(e.b){drawBird(e.b,t);continue;}
    if(e.boar){drawBoar(G.boar,t);continue;}
    if(e.tim){drawPerson(G.tim.x,G.tim.y,G.tim.dir,G.tim.walk?1:0,LOOK.tim,0);continue;}
    if(e.n){const n=e.n,idle=Math.sin(t*0.05+n.x)>0.95;if(n.lying){ctx.save();ctx.translate(n.x,n.y-6);ctx.rotate(-Math.PI/2);ctx.translate(-n.x,-(n.y-6));drawPerson(n.x,n.y,0,0,n.L,0);ctx.restore();}else drawPerson(n.x,n.y,n.dir,0,n.L,idle?1:0);
      if(questNpc()===n.id&&!ST.modal){const by=n.y-28+R(Math.sin(t*0.1)*1.5);px(n.x-2,by-7,4,1,'#ffd24a');ctx.fillStyle='#ffd24a';ctx.font='10px '+FD;ctx.textAlign='center';ctx.fillText('!',n.x,by);}
      continue;}
    const o=e.o;
    switch(o.type){
      case 'palm':drawPalm(o.x-1,o.y,t,o.k);break;
      case 'tent':drawTent(o.x,o.y,o.flip);break;
      case 'lab':drawLab(o.x,o.y);break;
      case 'heli':drawHeli(o.x,o.y,t);break;
      case 'tower':drawTower(o.x,o.y);break;

      case 'crate2':drawCrate2(o.x,o.y);break;

      case 'bush':drawBush(o.x,o.y,o.k);break;
      case 'itree':drawITree(o,t);if(o.shake>0)o.shake--;break;
      case 'jtree':drawJTree(o.x,o.y,o.k);break;
      case 'fern':drawFern(o.x,o.y,o.k);break;

      case 'cfire':case 'sfire':drawFirePit(o.x,o.y,1,t);break;

      case 'altar':drawAltar(o.x,o.y);break;

      case 'sdoor':drawSDoor(o.x,o.y);break;
      case 'rmap':drawRMap(o.x,o.y);glint(o.x,o.y-14);break;
      case 'crystal':drawCrystal(o.x,o.y,o.k,t);break;
      case 'rope':drawRope(o.x,o.y);break;

      case 'rubble':drawRubble(o);if(o.shake>0)o.shake--;break;
      case 'skel':drawSkel(o.x,o.y);break;
      case 'slab':drawSlab(o.x,o.y);break;
      case 'flash':drawFlash(o.x,o.y);glint(o.x,o.y-4);break;
      case 'vial':drawVial(o.x,o.y);glint(o.x,o.y-4);break;
      case 'wreck2':if(SPR.o_wreck2&&SPR.o_wreck2.ok){shadow(o.x,o.y,20,4);spr('o_wreck2',o.x,o.y+3);break;}ctx.save();ctx.filter='hue-rotate(160deg) saturate(1.4)';drawWreck(o.x,o.y);ctx.restore();break;
      case 'cap':drawCap(o.x,o.y);glint(o.x,o.y-6);break;
      case 'cave':drawCave(o.x,o.y);break;
      case 'hut':drawHut(o.x,o.y,o.big,o.flip);break;
      case 'totem':drawTotem(o.x,o.y,t);break;
      case 'vfire':drawFirePit(o.x,o.y,1,t);break;
      case 'birdItem':drawBird({x:o.x,y:o.y,dead:1},t);glint(o.x,o.y-4);break;
    }}
  // стрелы
  for(const a of G.arrows||[]){const ang=Math.atan2(a.vy,a.vx);ctx.save();ctx.translate(R(a.x),R(a.y));ctx.rotate(ang);if(SPR.o_arrow&&SPR.o_arrow.ok){ctx.drawImage(SPR.o_arrow.img,-9,-1);ctx.restore();continue;}px(-6,0,9,1,'#8a6a42');px(3,-1,2,3,'#9aa3a8');px(-7,-1,2,3,'#e05a3a');ctx.restore();}
  // натянутый лук
  if(G.bow){const P=S.p,v=DIRV[P.dir],k=G.bow.p,r=8+k*40;ctx.strokeStyle='rgba(255,240,200,'+(0.3+k*0.5)+')';ctx.setLineDash([2,3]);
    ctx.beginPath();ctx.moveTo(P.x+v[0]*6,P.y-8+v[1]*4);ctx.lineTo(P.x+v[0]*(6+r*2.2),P.y-8+v[1]*(4+r*2.2));ctx.stroke();ctx.setLineDash([]);
    px(R(P.x)-12,R(P.y)-34,24,3,'#2a2a28');px(R(P.x)-12,R(P.y)-34,R(24*k),3,k>0.95?'#ffd24a':'#e0902a');}
  // леска и поплавок
  if(G.F){const F=G.F,tip=F.tip||{x:S.p.x,y:S.p.y-20};
    let bx=F.bx,by=F.by;if(F.ph==='cast'){const k=F.t/22;bx=lerp(tip.x,F.bx,k);by=lerp(tip.y,F.by,k)-Math.sin(k*Math.PI)*18;}
    if(F.ph==='reel'){const k=clamp(F.d/100,0,1.3);bx=lerp(S.p.x,F.bx,k)+(F.res?R(Math.sin(t*0.9)*2):0);by=lerp(S.p.y,F.by,k);}
    const dip=F.ph==='bite'?(t%10<5?2:0):F.ph==='wait'?R(Math.sin(t*0.08)):0;
    if(F.ph!=='done'){ctx.strokeStyle=F.ph==='reel'&&F.res?'#ff5a4a':'rgba(240,240,230,.85)';ctx.lineWidth=F.ph==='reel'?1:0.7;ctx.beginPath();ctx.moveTo(tip.x,tip.y);
      ctx.quadraticCurveTo((tip.x+bx)/2,Math.max(tip.y,by)+(F.ph==='reel'?0:6),bx,by+dip);ctx.stroke();

  // частицы

const NPCZ={crow:'beach',rix:'beach',keaold:'village',marta:'beach',olaf:'beach',cyrus:'beach',kea:'village',ato:'village',vaina:'village'};
/* цель текущего этапа: {z, x, y} в пикселях района цели или {z, npc} */
function navGoal(){const st=S.st;const O=(z,ref)=>({z,ref});const N=id=>({z:id==='tim'?(S.f.timHome?'beach':'village'):NPCZ[id],npc:id});
  switch(st){
    case 1:return inv('wood')>=3?O('beach','fire'):O('beach',{type:'wood'});
    case 2:case 9:case 11:case 19:case 21:case 26:case 27:return N('olaf');
    case 3:return inv('line')?N('olaf'):O('beach','crate');
    case 4:case 12:return N('marta');
    case 5:return O('beach',{type:'dig'});
    case 7:return N('cyrus');
    case 8:case 22:case 25:case 30:case 35:case 38:return O('beach','fire');
    case 10:return inv('log')?O('beach','raft'):O('beach',{type:'log'});
    case 13:return O('west','cap');case 14:return O('village','vfire');
    case 15:return {z:'village',x:32*TS,y:18*TS};
    case 16:return N('kea');case 17:case 28:case 34:return N('ato');
    case 18:return N('marta');
    case 20:return inv('hlog')>=3?N('olaf'):O('jungle',{type:'itree',f:o=>!o.cut});
    case 23:return N('vaina');
    case 24:return O('jungle',{type:'herb'});
    case 29:return O('jungle',{type:'itree',f:o=>o.cut&&!S.f['res_'+o.id]});
    case 31:return O('west','cave');
    case 32:return O('cave','rubble');
    case 33:return O('cave',S.f.sawSkel?'slab':'skel');
    case 36:case 39:return O('shrine','altar');
    case 37:return O('shrine',!S.f.trialF?'st0':!S.f.trialW?'st1':'st2');
    case 40:return O('shrine',{type:'statue',f:o=>!S.f['placed'+o.k]});
    case 41:return O('shrine','pit');
    case 42:return O('vault','rmap');
    case 43:return N('olaf');
    case 45:case 50:case 53:return N('crow');
    case 46:return N('rix');
    case 47:return O('beach','oldcamp');
    case 48:return O('jungle',{type:'herb'});
    case 49:return O('beach','lab');
    case 51:case 52:return N('keaold');
    case 54:return O('vault','sdoor');
  }return null;}
/* куда идти из текущего района: сама цель или выход к следующему району */
function navTarget(){const g=navGoal();if(!g||!g.z)return null;return g;}
const LINKS={beach:{west:'x0',jungle:'top'},west:{beach:'x1',village:'top',cave:'cave'},village:{west:'bot'},jungle:{beach:'bot',shrine:'top'},cave:{west:'bot'},shrine:{jungle:'bot',vault:'pit'},vault:{shrine:'rope'}};
function navRoute(from,to){if(from===to)return to;const prev={[from]:null},q=[from];
  while(q.length){const z=q.shift();for(const n in LINKS[z]||{})if(!(n in prev)){prev[n]=z;q.push(n);}}
  if(!(to in prev))return null;let z=to;while(prev[z]!==from&&prev[z]!=null)z=prev[z];return z;}
function navPoint(){const g=navTarget();if(!g)return null;
  if(g.z!==Z.id){const nx=navRoute(Z.id,g.z);if(!nx)return null;
    const ob=t=>Z.O.find(o=>o.type===t);
    if(Z.id==='west'&&nx==='cave'){const c=ob('cave');return c&&{x:c.x,y:c.y-6,exit:1};}
    if(Z.id==='shrine'&&nx==='vault'){const c=ob('pit');return c&&{x:c.x,y:c.y,exit:1};}
    if(Z.id==='vault'){const c=ob('rope');return c&&{x:c.x,y:c.y,exit:1};}
    const e=Z.exits.find(e=>e.to===nx);return e&&{x:e.x+e.w/2,y:e.y+e.h/2,exit:1};}
  if(g.npc){const n=Z.npc.find(n=>n.id===g.npc);return n&&{x:n.x,y:n.y-18,npc:1};}
  if(g.x!=null)return {x:g.x,y:g.y};
  let o=null;if(typeof g.ref==='string')o=Z.O.find(q=>q.id===g.ref||q.type===g.ref);
  else if(g.ref){let bd=1e9;for(const q of Z.O){if(q.type!==g.ref.type||q.gone||q.hidden||(g.ref.f&&!g.ref.f(q)))continue;const d=Math.hypot(q.x-S.p.x,q.y-S.p.y);if(d<bd){bd=d;o=q;}}}
  if(!o||o.gone||o.hidden)return null;return {x:o.x,y:o.y-(o.type==='statue'?44:o.type==='itree'&&!o.cut?60:14)};}
function drawNav(){if(ST.modal||G.F||ST.noNav)return;const p=navPoint();if(!p)return;
  const sx=p.x-G.cam.x,sy=p.y-G.cam.y,m=14,t=G.t;
  const inside=sx>m&&sx<W-m&&sy>34&&sy<H-60;
  if(inside){if(p.npc)return;const by=sy-6+Math.sin(t*0.12)*2;ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.moveTo(sx-4,by-5);ctx.lineTo(sx+4,by-5);ctx.lineTo(sx,by);ctx.closePath();ctx.fill();ctx.strokeStyle='#3a2a10';ctx.lineWidth=1;ctx.stroke();return;}
  const cx=W/2,cy=H/2,dx=sx-cx,dy=sy-cy,k=Math.min((W/2-m)/Math.abs(dx||1e-6),(H/2-50)/Math.abs(dy||1e-6));
  const ax=cx+dx*k,ay=cy+dy*k,ang=Math.atan2(dy,dx),pulse=1+Math.sin(t*0.15)*0.12;
  ctx.save();ctx.translate(R(ax),R(ay));ctx.rotate(ang);ctx.scale(pulse,pulse);
  ctx.fillStyle='rgba(10,20,22,.7)';ctx.beginPath();ctx.arc(-2,0,8,0,TAU);ctx.fill();
  ctx.fillStyle=p.exit?'#7ad0ff':'#ffd24a';ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,-5);ctx.lineTo(-2,0);ctx.lineTo(-4,5);ctx.closePath();ctx.fill();ctx.restore();}
/* ================= ГЛАВНОЕ МЕНЮ ================= */
function drawTitle(){UI=[];const t=G.t;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b2a4a');g.addColorStop(0.45,'#e0885a');g.addColorStop(0.55,'#f2c27a');g.addColorStop(0.56,'#2a7f9a');g.addColorStop(1,'#123a4a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const hy=R(H*0.555);ctx.fillStyle='#ffe2a0';ctx.beginPath();ctx.arc(W/2,hy,26,Math.PI,0);ctx.fill();
  for(let i=0;i<14;i++){const yy=hy+6+i*i*1.1;ctx.fillStyle='rgba(255,226,160,'+(0.5-i*0.03)+')';ctx.fillRect(W/2-18+R(Math.sin(t*0.03+i)*4)+i,yy,36-i*2,1);}
  // силуэт острова
  ctx.fillStyle='#14222a';ctx.beginPath();ctx.moveTo(W*0.55,hy);ctx.quadraticCurveTo(W*0.72,hy-30,W*0.82,hy-16);ctx.quadraticCurveTo(W*0.9,hy-24,W+5,hy-6);ctx.lineTo(W+5,hy);ctx.fill();
  drawPalm(W-30,hy-8,t,1);
  for(let i=0;i<4;i++){const bx=(t*0.3+i*70)%(W+40)-20,by=H*0.2+i*12+Math.sin(t*0.05+i)*3;ctx.strokeStyle='#14222a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx-4,by);ctx.lineTo(bx,by+2);ctx.lineTo(bx+4,by);ctx.stroke();}
  txtS(tl('ПЕТЛЯ'),W/2,H*0.2,30,'#fff2d0','center',FD);txtS(tl('ПРИЛИВА'),W/2,H*0.2+28,22,'#ffd27a','center',FD);
  txtS(tl('ПРИКЛЮЧЕНИЕ НА ОСТРОВЕ'),W/2,H*0.2+44,7,'#ffe8c0','center',FD);
  let y=R(H*0.66);const w=150,x=(W-w)/2;
  if(hasSave()){button(tl('ПРОДОЛЖИТЬ'),x,y,w,22,()=>{auInit();startGame(false);},{hot:1,size:9});y+=28;
    button(tl('НОВАЯ ИГРА'),x,y,w,18,()=>openChoiceTitle());y+=24;}
  else{button(tl('НАЧАТЬ ИГРУ'),x,y,w,22,()=>{auInit();startGame(true);},{hot:1,size:9});y+=28;}
  button(tl('ЗВУК: ')+(AU.on?tl('ВКЛ'):tl('ВЫКЛ')),x,y,w,18,()=>{auInit();setSound(!AU.on);});y+=24;
  button(tl('ВСЕ ИГРЫ REJAR BOX'),x,y,w,18,()=>{location.href='../../';});
  txt(tl('Акт 2 «База» · глава 1'),W/2,H-8,6,'rgba(255,240,210,.6)','center');
  if(ST.confirm)drawConfirm();
}
function openChoiceTitle(){ST.confirm=1;ST.sel=0;}
function drawConfirm(){UI=[];ctx.fillStyle='rgba(5,10,12,.8)';ctx.fillRect(0,0,W,H);panel(20,H/2-46,W-40,92);
  wrap(tl('Начать заново? Сохранённая игра будет удалена.'),W-60,8).forEach((l,i)=>txt(l,W/2,H/2-26+i*11,8,'#f3ead2','center'));
  button(tl('ДА, ЗАНОВО'),30,H/2+12,(W-66)/2,20,()=>{ST.confirm=0;store.del('petlya_save');auInit();startGame(true);},{size:7});
  button(tl('НЕТ'),36+(W-66)/2,H/2+12,(W-66)/2,20,()=>{ST.confirm=0;},{hot:1,size:7});}

/* ================= ЦИКЛ ================= */
const ST={scene:'title',modal:null,sel:0,kbd:false,t:0};
function update(){
  G.t++;readInput();
  if(AU.amb&&AU.ctx){const v=ST.scene==='play'?0.18:0.1;AU.amb.gain.value+=(v-AU.amb.gain.value)*0.02;}
  musicTick();
  if(ST.scene!=='play')return;
  if(ST.modal==='dlg'){updDialog();return;}
  if(ST.modal==='sleep'){updSleep();return;}
  if(ST.modal){if(inp.menu||(inp.bag&&ST.modal==='bag'))ST.modal=null;return;}
  updTime();updPlayer();updHunt();updFollow();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(SC*DPR,0,0,SC*DPR,OX*DPR,OY*DPR);ctx.imageSmoothingEnabled=false;
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(ST.scene==='title'){drawTitle();}
  else{drawWorld();
    if(ST.modal!=='dlg'||!(DLG&&DLG.L[DLG.i].dark))drawHUD();
    if(ST.modal==='dlg')drawDialog();
    else if(ST.modal==='choice')drawChoice();
    else if(ST.modal==='bag')drawBag();
    else if(ST.modal==='pause')drawPause();
    else if(ST.modal==='sleep'){const k=G.sleepT<60?G.sleepT/60:1-(G.sleepT-60)/60;ctx.fillStyle='rgba(0,0,0,'+k+')';ctx.fillRect(0,0,W,H);
      if(k>0.6)txt('z z z',W/2,H/2,10,'#c9c3a8','center',FD);}
    else UI=[];}
  ctx.restore();
}
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){update();acc-=1000/60;}
  render();requestAnimationFrame(frame);}
loadArt();layout();requestAnimationFrame(frame);
if('serviceWorker' in navigator&&(/github\.io$/.test(location.hostname)||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__petlya={get S(){return S},G,ST,get Z(){return Z},startGame,changeZone,keys,inp,step(n){for(let i=0;i<n;i++)update();},render,talkTo,findNear,doAction,eat,get UI(){return UI},get CH(){return CH},get geo(){return {W,H,SC,OX,OY}}};
})();
</script>
