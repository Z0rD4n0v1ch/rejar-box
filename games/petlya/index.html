function drawPerson(x,y,dir,step,L,bob){
  x=R(x);y=R(y);
  const sp=SPR['ch_'+L.id];
  if(sp&&sp.ok){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y,7,2.5,0,0,TAU);ctx.fill();
    const walk=step>0;let fr;
    if(dir===0)fr=walk?(G.t>>3)%2:0;else if(dir===3)fr=walk?6+(G.t>>3)%2:6;else fr=walk?4+(G.t>>3)%2:3;
    const fw=sp.fw,fh=sp.fh;
    if(dir===1){const n=sp.img.width/fw;ctx.drawImage(sp.flip||sp.img,(n-1-fr)*fw,0,fw,fh,x-fw/2,y-fh+1-(bob?1:0),fw,fh);}
    else ctx.drawImage(sp.img,fr*fw,0,fw,fh,x-fw/2,y-fh+1-(bob?1:0),fw,fh);
    return;}const s=step%2?1:0,b=bob?1:0;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y,6,2.2,0,0,TAU);ctx.fill();
  // ноги
  const lu=s?1:0,ru=s?0:1;
  if(dir===1||dir===2){px(x-2,y-5-(step?1:0),3,5,L.pants);px(x-2,y-1,3,1,L.shoe);}
  else{px(x-3,y-5,2,5-lu,L.pants);px(x+1,y-5,2,5-ru,L.pants);px(x-3,y-1-lu,2,1,L.shoe);px(x+1,y-1-ru,2,1,L.shoe);}
  const ty=y-11-b;
  // туловище
  px(x-4,ty,8,6,L.shirt);if(L.apron&&dir!==3)px(x-3,ty+2,6,5,L.apron);
  // руки
  const sw=step?(s?1:-1):0;
  if(dir===1){px(x-1+sw,ty+1,2,5,L.shirt);px(x-1+sw,ty+5,2,1,L.skin);}
  else if(dir===2){px(x-1-sw,ty+1,2,5,L.shirt);px(x-1-sw,ty+5,2,1,L.skin);}
  else{px(x-6,ty+1+(sw>0?1:0),2,4,L.shirt);px(x+4,ty+1+(sw<0?1:0),2,4,L.shirt);px(x-6,ty+5+(sw>0?1:0),2,1,L.skin);px(x+4,ty+5+(sw<0?1:0),2,1,L.skin);}
  // голова
  const hy=ty-7;px(x-3,hy,6,7,L.skin);
  if(L.beard&&dir!==3)px(x-3,hy+4,6,3,L.beard);
  // волосы
  px(x-3,hy-1,6,2,L.hair);
  if(dir===3)px(x-3,hy,6,5,L.hair);
  else if(dir===1){px(x,hy,3,4,L.hair);}
  else if(dir===2){px(x-3,hy,3,4,L.hair);}
  else{px(x-3,hy,1,3,L.hair);px(x+2,hy,1,3,L.hair);}
  if(L.style===1&&dir!==0)px(dir===1?x+2:dir===2?x-4:x-3,hy+2,dir===3?6:2,dir===3?6:5,L.hair);
  if(L.style===1&&dir===0){px(x-4,hy+1,1,6,L.hair);px(x+3,hy+1,1,6,L.hair);}
  if(L.style===3&&dir!==3)px(x-3,hy-2,6,1,'#f2efe6');
  // глаза
  if(dir===0){px(x-2,hy+3,1,1,'#1a1410');px(x+1,hy+3,1,1,'#1a1410');}
  else if(dir===1)px(x-2,hy+3,1,1,'#1a1410');
  else if(dir===2)px(x+1,hy+3,1,1,'#1a1410');
}

  if(sp&&sp.ok){px(x,y,24,24,'#1c3a3c');ctx.save();ctx.beginPath();ctx.rect(x,y,24,24);ctx.clip();

  px(x,y,24,24,'#1c3a3c');px(x+5,y+4,14,16,L.skin);

}

/* ---- Джунгли за лагерем: железное дерево, ручей ---- */
function genJungle(){
  const w=40,h=30,m=[];
  const sx=y=>26*TS+Math.sin(y*0.021+0.5)*22+Math.sin(y*0.057)*6;   /* русло ручья */
  const P4=[[19,17],[20,11],[19,5],[20,-1]],P=[[20,30],[20,24],[19,17],[13,13],[8,11]],P2=[[19,17],[24,15.5],[29,15],[32,10],[32,8]],P3=[[29,15],[31,19],[34,22]];
  const segD=(x,y,L)=>{let d=1e9;for(let i=0;i<L.length-1;i++){const ax=L[i][0]*TS+8,ay=L[i][1]*TS+8,bx=L[i+1][0]*TS+8,by=L[i+1][1]*TS+8;
    const vx=bx-ax,vy=by-ay,t=clamp(((x-ax)*vx+(y-ay)*vy)/(vx*vx+vy*vy),0,1);d=Math.min(d,Math.hypot(x-ax-vx*t,y-ay-vy*t));}return d;};
  const pd=(x,y)=>Math.min(segD(x,y,P),segD(x,y,P2),segD(x,y,P3),S.st>=36||S.f.shrineOpen?segD(x,y,P4):1e9);
  const clear=[[8,10,46],[32,8,44],[34,21,44],[19,17,52],[24,7,30],[24,24,30]];
  const terr=(x,y)=>{const d=pd(x,y);
    const ws=Math.abs(x-sx(y));const ford=Math.abs(y-15.5*TS)<11;
    if(ws<11&&!ford)return 1;
    if(d<13)return 7;
    const edge=Math.min(x,w*TS-x,y,h*TS-y+(Math.abs(x-20*TS)<30?99:0));
    const wav=Math.sin(x*0.07)*6+Math.sin(y*0.09+1)*6;
    if(edge<34+wav)return 5;
    let near=d<40||ws<30;for(const c of clear)if(Math.hypot(x-c[0]*TS-8,y-c[1]*TS-8)<c[2])near=true;
    const v=Math.sin(x*0.021+1)*Math.sin(y*0.027+2)+Math.sin(x*0.009+y*0.013)*0.6;
    if(!near&&v>0.55)return 5;
    return 4;};
  for(let y=0;y<h;y++){m.push([]);for(let x=0;x<w;x++)m[y].push(terr(x*TS+8,y*TS+8));}
  const O=[];const o=(type,tx,ty,extra)=>{const ob=Object.assign({type,x:tx*TS+8,y:ty*TS+12},extra||{});O.push(ob);return ob;};
  o('itree',8,9,{id:'itree0',solid:[14,7]});o('itree',32,7,{id:'itree1',solid:[14,7]});o('itree',34,20,{id:'itree2',solid:[14,7]});
  for(const [x,y,k] of [[14,8,0],[5,15,1],[12,20,2],[16,25,3],[26,4,4],[36,13,5],[29,25,6],[23,10,7],[9,24,8],[37,26,9]])o('jtree',x,y,{k,solid:[10,6]});
  for(const [x,y,k] of [[17,12,0],[11,16,1],[22,21,2],[30,12,3],[15,5,4],[35,16,5],[25,27,6],[6,6,7],[18,27,8],[33,25,9]])o('fern',x,y,{k,solid:[12,5]});
  for(const [x,y,k] of [[21,13,0],[28,20,1]])o('rock',x,y,{k,solid:[10,5]});
  /* синий лист — вдоль ручья */
  let hi=0;for(const ty of [5,10,19,23,26]){const x=sx(ty*TS+8)+(hi%2?26:-26);O.push({type:'herb',x,y:ty*TS+12,id:'herb'+hi});hi++;}
  O.push({type:'vial',x:sx(19.5*TS)-24,y:19.5*TS+12,id:'vial'});
  return {id:'jungle',name:'Джунгли',w,h,m,O,npc:[],terr,stream:sx,start:{x:20*TS,y:27*TS},
    exits:[{x:20*TS-26,y:h*TS-8,w:52,h:8,to:'beach',tx:22*TS,ty:2*TS},
           {x:20*TS-26,y:0,w:52,h:8,to:'shrine',tx:20*TS,ty:31*TS,need:36,msg:'Сплошная стена зарослей.'}]};
}

function genShrine(){
  const w=40,h=34,m=[];
  const cx=20*TS+8,cy=16*TS;
  const pool=(x,y)=>{const dx=(x-9.5*TS)/(4.2*TS),dy=(y-24*TS)/(2.6*TS);return dx*dx+dy*dy;};
  const terr=(x,y)=>{const a=Math.atan2(y-cy,x-cx),wob=1+Math.sin(a*5+1)*0.05+Math.sin(a*11)*0.03;
    const ex=(x-cx)/(18*TS),ey=(y-cy)/(15*TS),d=Math.sqrt(ex*ex+ey*ey);
    const onPath=Math.abs(x-20*TS-8+Math.sin(y*0.05)*6)<16&&y>cy;
    if(d>wob&&!onPath)return 5;
    if(pool(x,y)<1)return 1;
    const pl=Math.hypot(x-cx,(y-14*TS)*1.25);if(pl<64)return 7;
    if(onPath&&d>0.4)return 7;
    return 4;};
  for(let y=0;y<h;y++){m.push([]);for(let x=0;x<w;x++)m[y].push(terr(x*TS+8,y*TS+8));}
  const O=[];const o=(type,tx,ty,extra)=>{const ob=Object.assign({type,x:tx*TS+8,y:ty*TS+12},extra||{});O.push(ob);return ob;};
  o('altar',20,14,{id:'altar',solid:[34,8]});
  o('statue',13,10,{id:'st0',k:0,solid:[16,8]});o('statue',20,7,{id:'st1',k:1,solid:[16,8]});o('statue',27,10,{id:'st2',k:2,solid:[16,8]});
  o('brazier',32,15,{id:'br0',ord:0,solid:[10,5]});o('brazier',20,3,{id:'br1',ord:1,solid:[10,5]});o('brazier',8,15,{id:'br2',ord:2,solid:[10,5]});
  o('sfire',17,28,{id:'sfire',solid:[16,8]});
  for(const [x,y,k] of [[6,10,0],[34,9,1],[5,19,2],[35,22,3],[14,4,4],[26,4,5],[15,27,6],[25,28,7]])o('jtree',x,y,{k,solid:[10,6]});
  for(const [x,y,k] of [[29,20,0],[33,25,1],[24,23,2],[31,18,3],[36,16,4],[27,27,5],[16,21,6],[12,29,7]])o('fern',x,y,{k,solid:[12,5]});
  for(const [x,y,k] of [[14,24,0],[6,22,1],[23,19,2]])o('rock',x,y,{k,solid:[10,5]});
  return {id:'shrine',name:'Святилище',w,h,m,O,npc:[],terr,pool:1,noBirds:1,start:{x:20*TS,y:31*TS},
    hunt:{x0:24*TS,x1:36*TS,y0:18*TS,y1:28*TS},
    exits:[{x:20*TS-26,y:h*TS-8,w:52,h:8,to:'jungle',tx:20*TS,ty:1.5*TS}]};
}
ZONES.shrine=genShrine;

function genVault(){
  const w=26,h=22,m=[];
  const cx=13*TS+8,cy=11*TS;
  const lake=(x,y)=>{const dx=(x-15*TS)/(6*TS),dy=(y-15*TS)/(3.2*TS);return dx*dx+dy*dy;};
  const terr=(x,y)=>{const a=Math.atan2(y-cy,x-cx),wob=1+Math.sin(a*6+2)*0.06+Math.sin(a*13)*0.03;
    const ex=(x-cx)/(11*TS),ey=(y-cy)/(9*TS);if(Math.sqrt(ex*ex+ey*ey)>wob)return 6;
    if(lake(x,y)<1)return 1;return 7;};
  for(let y=0;y<h;y++){m.push([]);for(let x=0;x<w;x++)m[y].push(terr(x*TS+8,y*TS+8));}
  const O=[];const o=(type,tx,ty,extra)=>{const ob=Object.assign({type,x:tx*TS+8,y:ty*TS+12},extra||{});O.push(ob);return ob;};
  o('rope',13,6,{id:'rope'});
  o('sdoor',7,3.5,{id:'sdoor',solid:[28,8]});
  o('rmap',11,3,{id:'rmap'});
  o('knife',20,11,{id:'knife'});
  for(const [x,y,k] of [[4,8,0],[22,6,1],[5,14,2],[23,13,3],[9,18,4],[19,4,5]])o('crystal',x,y,{k,solid:[8,4]});
  for(const [x,y,k] of [[3,11,0],[24,9,1],[16,6,2]])o('rock',x,y,{k,solid:[10,5]});
  return {id:'vault',name:'Под алтарём',w,h,m,O,npc:[],terr,dark:1,glow:1,start:{x:13*TS+8,y:7*TS},exits:[]};
}

function texData(k){const s=SPR[k];if(!s||!s.ok)return null;if(s.data)return s;
  const c=document.createElement('canvas');c.width=s.img.width;c.height=s.img.height;const g=c.getContext('2d');g.drawImage(s.img,0,0);
  s.data=g.getImageData(0,0,c.width,c.height).data;s.tw=c.width;s.th=c.height;return s;}
const GCACHE={};

/* сетка местности с шагом 2 px: считается один раз на район */
const TGC={};
function buildTG(){const W2=Z.w*TS>>1,H2=Z.h*TS>>1,kk=groundKey().replace(/t$/,'');if(TGC[kk]){Z.tg=TGC[kk];Z.tgw=W2;Z.tgh=H2;return;}const a=new Uint8Array(W2*H2);TGC[kk]=a;
  if(Z.terr){for(let y=0;y<H2;y++)for(let x=0;x<W2;x++)a[y*W2+x]=Z.terr(x*2+1,y*2+1);}

function buildGround(){
  if(!Z.tg)buildTG();
  const key=(SPR.t_sand&&SPR.t_sand.ok?'t':'c')+groundKey();
  if(GCACHE[key]){ground=GCACHE[key];G.groundTex=key[0]==='t';return;}
  ground=document.createElement('canvas');const GW=Z.w*TS,GH=Z.h*TS;ground.width=GW;ground.height=GH;const g=ground.getContext('2d');
  const TX={7:Z.dark?texData('t_cave'):texData('t_wet'),3:texData('t_sand'),2:texData('t_wet'),4:texData('t_grass'),5:texData('t_jungle'),6:texData('t_rock'),1:texData('t_water'),0:texData('t_water')};
  const C={7:[160,128,88],2:[201,185,138],3:[230,211,160],4:[111,154,72],5:[31,74,38],6:[122,118,108],1:[63,163,180],0:[31,111,143]};
  G.groundTex=!!TX[3];
  const tg=Z.tg,W2=Z.tgw,H2=Z.tgh;
  const tt=(x,y)=>{if(x<0||y<0||x>=GW||y>=GH)return 6;return tg[(y>>1)*W2+(x>>1)];};
  const SH=Z.shoreF?new Float32Array(GW):null;if(SH)for(let x=0;x<GW;x++)SH[x]=Z.shoreF(x);
  const ST=Z.stream?new Float32Array(GH):null;if(ST)for(let y=0;y<GH;y++)ST[y]=Z.stream(y);
  const img=g.createImageData(GW,GH),d=img.data;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const t=tt(x,y);let r,gg,b;const T=TX[t];
    if(T){const i=((y%T.th)*T.tw+(x%T.tw))*4;r=T.data[i];gg=T.data[i+1];b=T.data[i+2];}
    else{const c=C[t];r=c[0];gg=c[1];b=c[2];if(hash(x>>1,y>>1)>0.93){r-=12;gg-=12;b-=12;}}
    let k=1;
    if(SH){const sh=SH[x];
      if(t===0||t===1){const dd=(y-sh-6)/40;k=0.92-clamp(dd,0,1)*0.42;if(dd>0.3){b=b*1.05;gg=gg*0.92;}if(y<sh+9){r=r*0.85+40;gg=gg*0.85+45;b=b*0.85+40;}}
      if(t===2){const q=clamp((sh-y)/9,0,1);const T3=TX[3];if(T3){const i=((y%T3.th)*T3.tw+(x%T3.tw))*4;r=r*0.55+T3.data[i]*0.45;gg=gg*0.55+T3.data[i+1]*0.45;b=b*0.55+T3.data[i+2]*0.45;}k=0.95+q*0.05;}
      if(t===3&&y>sh-14){k=0.97;}
      }
    if(t===4){gg*=0.9;r*=0.95;}
    if(t!==5&&t!==6){for(let dd=2;dd<=6;dd+=2){if(tt(x,y-dd)===5){k*=0.62+dd*0.06;break;}}}
    if(t===5&&tt(x,y+4)!==5)k=0.72;
    if(t===7){k*=0.95;}
    if(Z.dark){if(t===6)k*=0.55;else{for(let dd=2;dd<=8;dd+=2){if(tt(x,y-dd)===6){k*=0.55+dd*0.05;break;}}}}
    if(Z.pool||Z.glow){if(t===1){r=r*0.42+6;gg=gg*0.55+16;b=b*0.7+20;if(tt(x,y-5)!==1||tt(x+5,y)!==1||tt(x-5,y)!==1||tt(x,y+5)!==1)k*=0.8;}else if(tt(x,y-4)===1||tt(x+4,y)===1||tt(x-4,y)===1||tt(x,y+4)===1)k*=0.8;}
    if(ST){const ws=Math.abs(x-ST[y]);
      if(t===1){r=r*0.45+8;gg=gg*0.6+18;b=b*0.7+16;k*=0.8+clamp((11-ws)/11,0,1)*0.2;if(ws>8){k*=0.75;}}
      else if(ws<15&&t!==5){k*=0.82+(ws-11)*0.04;}
      if(t===7&&ws<11){const T6=TX[6];if(T6){const i=((y%T6.th)*T6.tw+(x%T6.tw))*4;r=T6.data[i];gg=T6.data[i+1];b=T6.data[i+2];}}}
    if(t===6&&tt(x,y+4)!==6)k=0.7;
    k*=gvar(x,y,t);
    const o=(y*GW+x)*4;d[o]=clamp(r*k,0,255);d[o+1]=clamp(gg*k,0,255);d[o+2]=clamp(b*k,0,255);d[o+3]=255;}
  g.putImageData(img,0,0);decorGround(g,tt,GW,GH);
  if(G.groundTex)GCACHE[key]=ground;
}

function objSolid(o){if(!o.solid||o.hidden||o.gone)return null;return {x:o.x-o.solid[0]/2,y:o.y-o.solid[1],w:o.solid[0],h:o.solid[1]};}
function blocked(x,y,hw,hh){
  for(const [cx,cy] of [[x-hw,y-hh],[x+hw,y-hh],[x-hw,y],[x+hw,y]]){if(T_SOLID[tileAtP(cx,cy)])return true;}
  for(const o of Z.O){const r=objSolid(o);if(r&&x+hw>r.x&&x-hw<r.x+r.w&&y>r.y&&y-hh<r.y+r.h)return true;}
  for(const n of Z.npc){if(Math.abs(n.x-x)<7&&Math.abs(n.y-y)<5)return true;}
  return false;}
function isWater(x,y){const t=tileAtP(x,y);return t===0||t===1;}

/* ================= ИГРОК ================= */
const DIRV=[[0,1],[-1,0],[1,0],[0,-1]];
/* если герой оказался внутри препятствия — переставить на ближайшее свободное место */
function unstick(P){for(let r=2;r<=64;r+=2)for(let a=0;a<16;a++){const x=P.x+Math.cos(a*Math.PI/8)*r,y=P.y+Math.sin(a*Math.PI/8)*r;
  if(x>6&&x<Z.w*TS-6&&y>8&&y<Z.h*TS-4&&!blocked(x,y,4,4)){P.x=x;P.y=y;return;}}}
function updPlayer(){
  const P=S.p;if(G.F){updFish();return;}
  const sp=1.4;let ax=inp.ax,ay=inp.ay;const m=Math.hypot(ax,ay);
  if(m>0.1){
    if(Math.abs(ax)>Math.abs(ay))P.dir=ax<0?1:2;else P.dir=ay<0?3:0;
    const vx=ax*sp,vy=ay*sp,ox=P.x,oy=P.y;
    if(blocked(P.x,P.y,4,4))unstick(P);
    if(!blocked(P.x+vx,P.y,4,4))P.x+=vx;else if(Math.abs(vx)>0.3&&G.t%20===0)sfx('bump');
    if(!blocked(P.x,P.y+vy,4,4))P.y+=vy;
    if(++G.stepT>9){G.stepT=0;G.step=G.step?0:1;if(G.step)sfx('step');}
    for(const e of Z.exits){if(P.x>=e.x&&P.x<=e.x+e.w&&P.y>=e.y&&P.y<=e.y+e.h){
      if(e.to&&(!e.need||S.st>=e.need)){changeZone(e.to,e.tx,e.ty);return;}
      const tw=(e.y<=0&&vy<0)||(e.y+e.h>=Z.h*TS&&vy>0)||(e.x<=0&&vx<0)||(e.x+e.w>=Z.w*TS&&vx>0);if(!tw)continue;
      /* закрытый проход: вернуть на прошлое место и чуть отодвинуть, но только на свободную клетку */
      P.x=ox;P.y=oy;const nx=e.x<=0?6:e.x+e.w>=Z.w*TS?-6:0,ny=e.y<=0?6:e.y+e.h>=Z.h*TS?-6:0;
      if(!blocked(P.x+nx,P.y+ny,4,4)){P.x+=nx;P.y+=ny;}
      if(e.msg&&(!G.exitT||G.t-G.exitT>120)){toast(tl(e.msg));G.exitT=G.t;}}}
  }else{G.step=0;G.stepT=0;}
  P.x=clamp(P.x,6,Z.w*TS-6);P.y=clamp(P.y,8,Z.h*TS-4);
  G.near=findNear();
  if(inp.actP&&G.near)doAction(G.near);
  else if(!G.near&&inv('bow')&&Z.hunt){/* лук: держать — натянуть, отпустить — выстрел */
    if(inp.act){if(!G.bow){if(inp.actP){if(inv('arrow')>0)G.bow={p:0};else toast(tl('Нет стрел. Их продаёт Ваина.'));}}else G.bow.p=Math.min(1,G.bow.p+0.025);}
    else if(G.bow){shoot(G.bow.p);G.bow=null;}}
  if(G.bow&&!inp.act){shoot(G.bow.p);G.bow=null;}
  if(inp.bag){openBag();}
  if(inp.menu){openPause();}
}
function front(d){const P=S.p,v=DIRV[P.dir];return {x:P.x+v[0]*d,y:P.y-3+v[1]*d};}
function findNear(){
  const P=S.p,f=front(10);let best=null,bd=1e9;
  const cand=(kind,label,obj,x,y,r)=>{const d=Math.hypot(f.x-x,f.y-y);if(d<r&&d<bd){bd=d;best={kind,label,obj};}};
  for(const n of Z.npc)cand('talk','ГОВОРИТЬ',n,n.x,n.y-4,16);
  for(const o of Z.O){if(o.hidden||o.gone)continue;
    if(o.type==='wood'||o.type==='log'||o.type==='crate')cand('take','ВЗЯТЬ',o,o.x,o.y-3,14);
    else if(o.type==='dig')cand('dig','КОПАТЬ',o,o.x,o.y,13);
    else if(o.type==='fire')cand('fire',S.f.fire?'КОСТЁР':'ЗАЖЕЧЬ',o,o.x,o.y-2,18);
    else if(o.type==='raft'&&S.st>=10)cand('raft','ПЛОТ',o,o.x,o.y-6,22);
    else if((o.type==='shell'&&!o.deco)||o.type==='cap'||o.type==='birdItem')cand('take','ВЗЯТЬ',o,o.x,o.y,12);
    else if(o.type==='vfire')cand('fire','КОСТЁР',o,o.x,o.y-2,18);
    else if(o.type==='cave')cand(inv('torch')&&S.st>=31?'enter':'look',inv('torch')&&S.st>=31?'ВОЙТИ':'СМОТРЕТЬ',o,o.x,o.y-6,22);
    else if(o.type==='wreck2')cand('look','СМОТРЕТЬ',o,o.x,o.y-4,22);
    else if(o.type==='itree'&&!o.cut)cand('chop','РУБИТЬ',o,o.x,o.y-4,20);
    else if(o.type==='itree'&&o.cut&&S.st>=29&&!S.f['res_'+o.id])cand('resin','СОБРАТЬ',o,o.x,o.y-2,16);
    else if(o.type==='rubble')cand('dig2','РАЗОБРАТЬ',o,o.x,o.y-4,24);
    else if(o.type==='skel'||o.type==='slab')cand('look','СМОТРЕТЬ',o,o.x,o.y-4,20);

function fireAction(o){
  if(o.type!=='vfire'&&!S.f.fire){
    if(S.st<1){toast(tl('Костровище. Нужны дрова.'));return;}
    if(inv('wood')<3){toast(tl('Нужно 3 плавника, есть ')+inv('wood')+'.');return;}
    take('wood',3);S.f.fire=1;sfx('fire');puff(o.x,o.y-4,'#ffcf6a');storyEvent('fire');saveGame();return;}
  const opts=[];
  if(o.type==='sfire'){if(inv('torch'))opts.push({label:tl('ЗАЖЕЧЬ ФАКЕЛ'),act:()=>{S.torchT=TORCH;sfx('fire');toast(tl('Факел горит.'));}});}
  if(o.type==='cfire'){if(inv('torch'))opts.push({label:tl('ЗАЖЕЧЬ ФАКЕЛ'),act:()=>{S.torchT=TORCH;sfx('fire');toast(tl('Факел горит.'));}});
    opts.push({label:tl('ОТМЕНА'),act:()=>{}});openChoice(tl('Костёр у входа'),opts);return;}
  if(inv('resin')&&!inv('torch'))opts.push({label:tl('СДЕЛАТЬ ФАКЕЛ'),act:()=>{take('resin');give('torch');S.torchT=TORCH;sfx('fire');storyEvent('torch');saveGame();}});
  if(inv('torch')&&S.torchT<TORCH)opts.push({label:tl('ЗАЖЕЧЬ ФАКЕЛ'),act:()=>{S.torchT=TORCH;sfx('fire');toast(tl('Факел горит.'));saveGame();}});
  if(S.st===25&&inv('herb')>=3)opts.push({label:tl('СВАРИТЬ ОТВАР'),act:()=>{take('herb',3);give('medicine');sfx('fire');storyEvent('brew');saveGame();}});
  const raw=Object.keys(S.inv).filter(k=>ITEMS[k]&&ITEMS[k].ck);
  if(raw.length&&S.f.recipe)for(const k of raw)opts.push({label:tl('ГОТОВИТЬ: ')+tl(ITEMS[k].n).toUpperCase(),act:()=>cook(k)});
  else if(raw.length)opts.push({label:tl('ГОТОВИТЬ'),act:()=>toast(tl('Не знаю, как это приготовить. Спроси Сайруса.'))});
  craftOpts(opts);
  opts.push({label:isNight()?tl('СПАТЬ ДО УТРА'):tl('ВЗДРЕМНУТЬ ДО ВЕЧЕРА'),act:()=>sleep()});
  opts.push({label:tl('ОТМЕНА'),act:()=>{}});
  openChoice(tl('Костёр'),opts);
}

function eat(k){const it=ITEMS[k];take(k);S.food=Math.min(100,S.food+it.food);S.hp=Math.min(100,S.hp+(it.hp||0));sfx('eat');

function updSleep(){G.sleepT++;
  if(G.sleepT===60){const night=isNight();const h=hour();
    let add;if(night){add=((6-h)+24)%24*60;}else add=Math.max(60,(19-h)*60);

/* ================= РЫБАЛКА ================= */
const FISH={
  f_mack:{w:[0.4,1.2],str:0.9,day:1,night:0.3},
  f_bass:{w:[0.8,2.6],str:1.3,day:0.4,night:0.3},
  f_parrot:{w:[0.6,1.8],str:1.1,day:0.25,night:0,hours:[10,16]},
  f_eel:{w:[0.9,3.2],str:1.5,day:0,night:0.6},
  f_moon:{w:[1.4,2.8],str:1.25,day:0,night:0}};
function rollFish(){if(Z.pool)return 'f_moon';const h=hour(),n=isNight(),pool=[];
  for(const k in FISH){const f=FISH[k];let wgt=n?f.night:f.day;if(f.hours&&(h<f.hours[0]||h>f.hours[1]))wgt=0;if(wgt>0)pool.push([k,wgt]);}
  let s=pool.reduce((a,b)=>a+b[1],0)*Math.random();for(const [k,w] of pool){if((s-=w)<=0)return k;}return pool[0][0];}
function startFish(){
  if(Z.pool){if(S.f.trialW){toast(tl('Пруд затих. Больше здесь ничего не клюёт.'));return;}
    if(!isNight()){toast(tl('В тёмной воде ничего не шевелится. Статуя говорит о луне…'));return;}}
  if(!inv('worm')){toast(tl('Нужна наживка. Накопай червей в рыхлой земле.'));return;}
  let p=null;for(let d=40;d>=12;d-=4){const q=front(d);if(isWater(q.x,q.y)){p=q;break;}}
  if(!p)return;take('worm');sfx('cast');
  G.F={ph:'cast',t:0,bx:p.x,by:p.y,sx:S.p.x,sy:S.p.y-14,wait:inv('rod2')?ri(50,160):ri(100,320)};
}
function updFish(){const F=G.F;F.t++;
  if(F.ph==='cast'){if(F.t>=22){F.ph='wait';F.t=0;sfx('plop');}return;}
  if(F.ph==='wait'){if(inp.actP){G.F=null;toast(tl('Ты вытащил пустой крючок. Наживка пропала.'));return;}
    if(F.t>=F.wait){F.ph='bite';F.t=0;F.kind=rollFish();sfx('bite');}return;}
  if(F.ph==='bite'){if(inp.actP){const f=FISH[F.kind];F.ph='reel';F.t=0;F.d=100;F.T=0;F.res=false;F.rt=ri(40,90);F.str=f.str;F.wt=+rnd(f.w[0],f.w[1]).toFixed(1);return;}
    if(F.t>48){G.F=null;toast(tl('Сорвалась! И наживку съела.'));}return;}
  if(F.ph==='reel'){
    if(--F.rt<=0){F.res=!F.res;F.rt=F.res?ri(35,80):ri(45,110);if(F.res)sfx('bite');}
    const hold=inp.act;
    if(hold){if(F.res){F.T+=1.6*F.str;F.d-=0.12;}else{F.T=Math.max(0,F.T-0.6);F.d-=0.55/F.str;if(G.t%6===0)sfx('reel');}}
    else{F.T=Math.max(0,F.T-1.4);F.d+=F.res?0.35*F.str:0.08;}
    if(F.T>=100){G.F=null;sfx('snap');toast(tl('Леска лопнула! Не тяни, когда рыба рвётся (леска красная).'));return;}
    if(F.d>=140){G.F=null;toast(tl('Рыба ушла…'));return;}
    if(F.d<=0){F.ph='done';F.t=0;sfx('catch');give(F.kind,1,true);const nw=!S.coll[F.kind];S.coll[F.kind]=Math.max(S.coll[F.kind]||0,F.wt);F.nw=nw;storyEvent('fish',F.kind);saveGame();}
    return;}
  if(F.ph==='done'){if(F.t>30&&inp.actP||F.t>240)G.F=null;}
}

function shoot(p){if(!inv('arrow'))return;take('arrow');sfx('cast');
  const v=DIRV[S.p.dir],sp=2.2+p*3.2;G.arrows.push({x:S.p.x+v[0]*6,y:S.p.y-10+v[1]*4,vx:v[0]*sp,vy:v[1]*sp,life:16+p*42,dir:S.p.dir});}
function updHunt(){
  for(let i=G.arrows.length-1;i>=0;i--){const a=G.arrows[i];a.x+=a.vx;a.y+=a.vy;a.life--;
    for(const b of G.birds){if(!b.dead&&Math.abs(b.x-a.x)<7&&Math.abs(b.y-6-a.y)<7){b.dead=1;a.life=0;sfx('snap');
      Z.O.push({type:'birdItem',x:b.x,y:b.y});puff(b.x,b.y-4,'#f0e8d8');}}
    {const tt=tileAtP(a.x,a.y+10);if(a.life<=0||tt===5||tt===6)G.arrows.splice(i,1);}}
  updBoar();
  if(!Z.hunt)return;const P=S.p,h=Z.hunt;
  for(const b of G.birds){if(b.dead)continue;b.t++;const d=Math.hypot(b.x-P.x,b.y-P.y);
    if(d<46){const k=1.15/Math.max(d,1);b.vx=(b.x-P.x)*k;b.vy=(b.y-P.y)*k;b.run=1;}
    else{b.run=0;if(b.t%90===0){const a=rnd(0,TAU);b.vx=Math.cos(a)*0.25;b.vy=Math.sin(a)*0.25;}if(b.t%90>50){b.vx*=0.9;b.vy*=0.9;}}
    const nx=b.x+b.vx,ny=b.y+b.vy;if(nx>h.x0-40&&nx<h.x1+20&&!T_SOLID[tileAtP(nx,ny)])b.x=nx;else b.vx*=-1;
    if(ny>h.y0-30&&ny<h.y1+20&&!T_SOLID[tileAtP(b.x,ny)])b.y=ny;else b.vy*=-1;}
  G.birds=G.birds.filter(b=>!b.dead);if(G.birds.length<3&&G.t%600===0)spawnBird();
}

function updBoar(){const b=G.boar;if(!b||b.dead)return;const P=S.p,h=Z.hunt;b.t++;
  for(let i=G.arrows.length-1;i>=0;i--){const a=G.arrows[i];if(Math.abs(b.x-a.x)<10&&Math.abs(b.y-7-a.y)<8){G.arrows.splice(i,1);b.hp--;sfx('snap');puff(b.x,b.y-6,'#c05a5a');
    if(b.hp<=0){b.dead=1;S.f.boarDead=1;Z.O.push({type:'stoneItem',k:'stone_b',x:b.x,y:b.y});give('boarmeat',1,true);storyEvent('boar');saveGame();return;}
    b.state='stun';b.st=24;toast(tl('Попадание! Ещё ')+b.hp+'.');}}
  const d=Math.hypot(P.x-b.x,P.y-b.y);
  if(b.state==='stun'){if(--b.st<=0)b.state='roam';return;}
  if(b.state==='roam'){if(b.t%80===0){const a=rnd(0,TAU);b.vx=Math.cos(a)*0.35;b.vy=Math.sin(a)*0.25;}
    if(d<62&&b.t>60){b.state='charge';b.st=70;const k=1.55/Math.max(d,1);b.vx=(P.x-b.x)*k;b.vy=(P.y-b.y)*k;sfx('bump');}}
  else if(b.state==='charge'){if(--b.st<=0){b.state='roam';b.t=1;}
    if(d<11){S.hp=Math.max(1,S.hp-12);sfx('bump');const k=14/Math.max(d,1);const nx=P.x+(P.x-b.x)*k,ny=P.y+(P.y-b.y)*k;if(!blocked(nx,ny,4,4)){P.x=nx;P.y=ny;}
      if(!G.boarHint){G.boarHint=1;toast(tl('Кабан бьёт клыками! Стреляй издалека.'));}b.state='stun';b.st=50;b.vx*=-1;}}
  const nx=b.x+b.vx,ny=b.y+b.vy;
  if(nx>h.x0-30&&nx<h.x1+20&&!T_SOLID[tileAtP(nx,ny)])b.x=nx;else b.vx*=-1;
  if(ny>h.y0-30&&ny<h.y1+20&&!T_SOLID[tileAtP(b.x,ny)])b.y=ny;else b.vy*=-1;}

function updFollow(){if(!S.f.timFollow)return;const P=S.p;G.trail.push({x:P.x,y:P.y,dir:P.dir});if(G.trail.length>22)G.trail.shift();
  const t=G.trail[0];if(!G.tim)G.tim={x:P.x,y:P.y+2,dir:P.dir};const T=G.tim;const d=Math.hypot(P.x-T.x,P.y-T.y);
  if(d>18){T.x=lerp(T.x,t.x,0.12);T.y=lerp(T.y,t.y,0.12);T.dir=t.dir;T.walk=1;}else T.walk=0;}

function openTrade(){
  const PR={f_mack:2,f_bass:3,f_parrot:4,f_eel:5,c_mack:4,c_bass:5,c_parrot:6,c_eel:7,bird:3,c_bird:6};
  const sellable=Object.keys(S.inv).filter(k=>PR[k]);
  const opts=[];
  if(sellable.length){const sum=sellable.reduce((a,k)=>a+PR[k]*inv(k),0);
    opts.push({label:tl('ПРОДАТЬ ЕДУ: +')+sum+tl(' РАКУШЕК'),act:()=>{for(const k of sellable)take(k,inv(k));give('shell',sum,true);sfx('catch');toast(tl('Ракушки: ')+inv('shell'));saveGame();}});}
  opts.push({label:tl('СТРЕЛЫ ×10 — 3 РАКУШКИ'),act:()=>{if(inv('shell')<3){toast(tl('Не хватает ракушек.'));return;}take('shell',3);give('arrow',10);saveGame();}});
  if(!inv('rod2'))opts.push({label:tl('КРЕПКАЯ УДОЧКА — 12 РАКУШЕК'),act:()=>{if(inv('shell')<12){toast(tl('Не хватает ракушек.'));return;}take('shell',12);give('rod2');saveGame();}});
  opts.push({label:tl('УЙТИ'),act:()=>{}});
  openChoice(tl('Ваина: ракушек ')+inv('shell'),opts);
}

/* ================= ЗВУК ОСТРОВА: слои окружения, живые звуки, мистика ================= */
const AMB={};
function noiseBuf(sec,kind){const a=AU.ctx,n=Math.floor(a.sampleRate*sec),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);let p=0;
  for(let i=0;i<n;i++){const w=Math.random()*2-1;if(kind==='brown'){p=(p+0.02*w)/1.02;d[i]=p*3.5;}else d[i]=w;}return b;}
function ambLayer(name,buf,ftype,freq,q){const a=AU.ctx,s=a.createBufferSource();s.buffer=buf;s.loop=true;const f=a.createBiquadFilter();f.type=ftype;f.frequency.value=freq;if(q)f.Q.value=q;
  const g=a.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(AU.master);s.start();AMB[name]={g,f};}
function ambInit(){if(AMB.ok||!AU.ctx)return;AMB.ok=1;const a=AU.ctx;
  ambLayer('wind',noiseBuf(3,'white'),'bandpass',520,0.6);
  ambLayer('rain',noiseBuf(2,'white'),'highpass',1800,0.3);

    const e=Z.exits.find(e=>e.to===nx);return e&&{x:e.x+e.w/2,y:e.y+e.h/2,exit:1};}
  if(g.npc){const n=Z.npc.find(n=>n.id===g.npc);return n&&{x:n.x,y:n.y-18,npc:1};}
  if(g.x!=null)return {x:g.x,y:g.y};
  let o=null;if(typeof g.ref==='string')o=Z.O.find(q=>q.id===g.ref||q.type===g.ref);
  else if(g.ref){let bd=1e9;for(const q of Z.O){if(q.type!==g.ref.type||q.gone||q.hidden||(g.ref.f&&!g.ref.f(q)))continue;const d=Math.hypot(q.x-S.p.x,q.y-S.p.y);if(d<bd){bd=d;o=q;}}}
  if(!o||o.gone||o.hidden)return null;return {x:o.x,y:o.y-(o.type==='statue'?44:o.type==='itree'&&!o.cut?60:14)};}
function drawNav(){if(ST.modal||G.F||ST.noNav)return;const p=navPoint();if(!p)return;

const ST={scene:'title',modal:null,sel:0,kbd:false,t:0};

  if(ST.modal==='sleep'){updSleep();return;}

function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(SC*DPR,0,0,SC*DPR,OX*DPR,OY*DPR);ctx.imageSmoothingEnabled=false;

loadArt();layout();requestAnimationFrame(frame);
