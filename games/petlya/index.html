/* ================= ЭКРАН ================= */
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,3);
  const vw=innerWidth,vh=innerHeight;cv.width=Math.round(vw*DPR);cv.height=Math.round(vh*DPR);
  portrait=vh>=vw;
  SC=Math.min(vw/240,vh/(portrait?320:270));
  W=Math.floor(Math.min(portrait?300:440,vw/SC));H=Math.floor(Math.min(560,vh/SC));
  OX=Math.round((vw-W*SC)/2);OY=Math.round((vh-H*SC)/2);
}
addEventListener('resize',layout);

/* ================= ТЕКСТ ================= */
function txt(s,x,y,size,col,align,font){ctx.font=size+'px '+(font||FT);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function txtS(s,x,y,size,col,align,font){ctx.font=size+'px '+(font||FT);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function wrap(s,maxW,size,font){ctx.font=size+'px '+(font||FT);const out=[];
  for(const para of s.split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}out.push(line);}return out;}
function panel(x,y,w,h,fill,edge){ctx.fillStyle=fill||'rgba(14,24,26,.92)';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=edge||'#c9a96a';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);}

/* ================= КНОПКИ МЕНЮ ================= */
let UI=[];
function button(label,x,y,w,h,act,o){o=o||{};const nav=o.nav!==false;const idx=UI.filter(b=>b.nav).length;
  const sel=nav&&ST.sel===idx&&ST.kbd;
  ctx.fillStyle=o.hot?'#c9893a':sel?'#2f5148':'#1b3236';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=sel?'#ffe7a8':o.hot?'#ffd27a':'#5f8a7c';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  txt(label,x+w/2,y+h/2+(o.size||8)*0.36,o.size||8,o.hot?'#21160a':'#f3ead2','center',FD);
  UI.push({x,y,w,h,act,nav});}

/* ================= ВВОД ================= */
const keys=new Set(), touches=new Map();
const inp={ax:0,ay:0,act:false,actP:false,bag:false,menu:false};
let actQ=false,bagQ=false,menuQ=false;
const K_L=['ArrowLeft','KeyA'],K_R=['ArrowRight','KeyD'],K_U=['ArrowUp','KeyW'],K_D=['ArrowDown','KeyS'],K_A=['Space','KeyE','Enter','KeyJ','Digit5','Numpad5'];
const anyK=a=>a.some(k=>keys.has(k));
/* сенсорные элементы поверх карты */
function ctlGeom(){const f=[0.85,1,1.2][CFG.size]||1;
  return {stick:{x:44,y:H-46,r:28*f},act:{x:W-38,y:H-44,r:24*f},bag:{x:W-84,y:H-28,r:15*f},menu:{x:W-14,y:14,r:11}};}
function readInput(){
  let ax=0,ay=0;if(anyK(K_L))ax-=1;if(anyK(K_R))ax+=1;if(anyK(K_U))ay-=1;if(anyK(K_D))ay+=1;
  if(ax&&ay){ax*=0.7071;ay*=0.7071;}
  let act=anyK(K_A);
  for(const t of touches.values()){
    if(t.role==='stick'){const r=24;let dx=(t.x-t.x0)/r,dy=(t.y-t.y0)/r;const m=Math.hypot(dx,dy);
      if(m>0.2){if(m>1){dx/=m;dy/=m;}ax=dx;ay=dy;}}
    if(t.role==='act')act=true;}
  inp.ax=ax;inp.ay=ay;inp.actP=actQ;actQ=false;inp.act=act;inp.bag=bagQ;bagQ=false;inp.menu=menuQ;menuQ=false;
}
function toLogical(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left-OX)/SC,y:(e.clientY-r.top-OY)/SC};}
let lastTouch=0;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();auInit();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(e.pointerType==='touch')lastTouch=Date.now();ST.kbd=false;
  const p=toLogical(e);
  if(ST.scene==='play'&&!ST.modal){
    const c=ctlGeom();
    if(Math.hypot(p.x-c.menu.x,p.y-c.menu.y)<c.menu.r+6){menuQ=true;return;}
    if(Math.hypot(p.x-c.bag.x,p.y-c.bag.y)<c.bag.r+6){bagQ=true;return;}
    if(Math.hypot(p.x-c.act.x,p.y-c.act.y)<c.act.r+10||(p.x>W*0.55&&p.y>H*0.5)){touches.set(e.pointerId,{role:'act',x:p.x,y:p.y});actQ=true;return;}
    if(p.x<W*0.55&&p.y>H*0.35){touches.set(e.pointerId,{role:'stick',x0:clamp(p.x,26,W*0.55-26),y0:clamp(p.y,H*0.35+26,H-26),x:p.x,y:p.y});return;}
    actQ=true;touches.set(e.pointerId,{role:'act',x:p.x,y:p.y});return;
  }
  for(let i=UI.length-1;i>=0;i--){const b=UI[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){sfx('ui');b.act();return;}}
  actQ=true;touches.set(e.pointerId,{role:'act',x:p.x,y:p.y});
},{passive:false});
cv.addEventListener('pointermove',e=>{const t=touches.get(e.pointerId);if(!t)return;const p=toLogical(e);t.x=p.x;t.y=p.y;});
const endT=e=>touches.delete(e.pointerId);
cv.addEventListener('pointerup',endT);cv.addEventListener('pointercancel',endT);cv.addEventListener('lostpointercapture',endT);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  auInit();ST.kbd=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();
  if(keys.has(e.code)){return;}
  keys.add(e.code);
  if(K_A.includes(e.code))actQ=true;
  if(e.code==='KeyI'||e.code==='Tab'||e.code==='KeyB')bagQ=true;
  if(e.code==='Escape'||e.code==='KeyP')menuQ=true;
  if(ST.scene!=='play'||(ST.modal&&ST.modal!=='dlg'&&ST.modal!=='sleep')){
    const nav=UI.filter(b=>b.nav);if(!nav.length)return;
    if(K_U.includes(e.code)||K_L.includes(e.code)){ST.sel=(ST.sel-1+nav.length)%nav.length;sfx('ui');actQ=false;}
    else if(K_D.includes(e.code)||K_R.includes(e.code)){ST.sel=(ST.sel+1)%nav.length;sfx('ui');actQ=false;}
    else if(K_A.includes(e.code)){const b=nav[ST.sel]||nav[0];if(b){sfx('ui');b.act();actQ=false;}}
  }
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{keys.clear();touches.clear();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveGame();if(AU.ctx)AU.ctx.suspend();}else if(AU.ctx&&AU.on)AU.ctx.resume();});
addEventListener('pagehide',()=>saveGame());

const AU={ctx:null,on:store.get('petlya_snd',true),master:null,amb:null,mus:null,musT:0,track:null};
function auInit(){if(AU.ctx){if(AU.ctx.state==='suspended'&&AU.on)AU.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;AU.ctx=new AC();
  AU.master=AU.ctx.createGain();AU.master.gain.value=AU.on?0.55:0;AU.master.connect(AU.ctx.destination);
  /* шум прибоя */
  const n=AU.ctx.sampleRate*4,buf=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=buf.getChannelData(0);let b=0;
  for(let i=0;i<n;i++){b=b*0.97+(Math.random()*2-1)*0.03;d[i]=b*3;}
  const src=AU.ctx.createBufferSource();src.buffer=buf;src.loop=true;const f=AU.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=700;
  const g=AU.ctx.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(AU.master);src.start();AU.amb=g;
}
function setSound(on){AU.on=on;store.set('petlya_snd',on);if(AU.master)AU.master.gain.value=on?0.55:0;}
function tone(f,d,type,vol,slide,delay){const a=AU.ctx;if(!a||!AU.on)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(vol||0.1,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+d+0.02);}
function noise(d,vol,fq,delay){const a=AU.ctx;if(!a||!AU.on)return;const t=a.currentTime+(delay||0);
  const n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||1200;
  const g=a.createGain();g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);}
function sfx(k){if(!AU.ctx)return;
  switch(k){
    case 'ui':tone(660,0.05,'square',0.05);break;
    case 'pick':tone(520,0.06,'square',0.07);tone(780,0.08,'square',0.07,0,0.06);break;
    case 'dig':noise(0.12,0.3,400);noise(0.1,0.25,300,0.14);break;
    case 'cast':noise(0.2,0.12,2400);tone(900,0.25,'sine',0.05,0.4);break;
    case 'plop':tone(300,0.12,'sine',0.12,0.5);noise(0.1,0.12,900);break;
    case 'bite':tone(880,0.07,'square',0.08);tone(880,0.07,'square',0.08,0,0.1);break;
    case 'reel':tone(1400,0.02,'square',0.025);break;
    case 'snap':tone(1600,0.06,'sawtooth',0.08,0.3);noise(0.08,0.2,3000);break;
    case 'catch':[523,659,784,1046].forEach((f,i)=>tone(f,0.12,'square',0.07,0,i*0.08));break;
    case 'fire':noise(0.5,0.25,800);noise(0.3,0.15,2000,0.2);break;
    case 'eat':tone(300,0.05,'square',0.06);tone(260,0.05,'square',0.06,0,0.08);break;
    case 'quest':[392,523,659,784].forEach((f,i)=>tone(f,0.16,'triangle',0.1,0,i*0.1));break;
    case 'talk':tone(330+Math.random()*80,0.03,'square',0.025);break;
    case 'step':noise(0.03,0.05,500);break;
    case 'bump':tone(120,0.06,'square',0.04);break;
  }}

function music(k){AU.track=k?TRK[k]:null;AU.musT=0;AU.step=0;}
const mf=n=>440*Math.pow(2,(n-69)/12);
function musicTick(){if(!AU.ctx||!AU.on||!AU.track)return;const T=AU.track,st=60/T.bpm/2;
  const now=AU.ctx.currentTime;if(!AU.next||AU.next<now-0.5)AU.next=now+0.05;
  while(AU.next<now+0.25){const i=AU.step||0;const m=T.m[i%T.m.length];if(m)tone(mf(m),st*1.8,'triangle',0.045,0,AU.next-now);
    if(i%4===0){const b=T.b[(i>>2)%T.b.length];tone(mf(b),st*3.5,'triangle',0.05,0,AU.next-now);}
    AU.step=i+1;AU.next+=st;}}

/* --- люди: ноги в точке (x,y); dir 0 вниз,1 влево,2 вправо,3 вверх --- */
const SPR={};
/* спрайт объекта: (x,y) — точка опоры у основания */
function spr(k,x,y,flip){const s=SPR[k];if(!s||!s.ok)return false;x=R(x);y=R(y);const fx=s.fx!=null&&s.h>=40?s.fx:s.w/2;
  if(flip){ctx.save();ctx.translate(x,0);ctx.scale(-1,1);ctx.drawImage(s.img,-fx,y-s.h+1);ctx.restore();}
  else ctx.drawImage(s.img,x-fx,y-s.h+1);return true;}
function shadow(x,y,rx,ry){ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(R(x),R(y),rx,ry,0,0,TAU);ctx.fill();}
function loadArt(){if(typeof ART==='undefined')return;for(const k in ART){const a=ART[k],im=new Image();im.src=a.src;
  const rec={img:im,fw:a.fw,fh:a.fh,w:a.w,h:a.h,fx:a.fx,ok:false};im.onload=()=>{rec.ok=true;
    if(k.startsWith('ch_')){/* зеркальная копия для взгляда влево */const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');
      g.translate(im.width,0);g.scale(-1,1);g.drawImage(im,0,0);rec.flip=c;}};SPR[k]=rec;}}

function drawPerson(x,y,dir,step,L,bob){
  x=R(x);y=R(y);
  const sp=SPR['ch_'+L.id];
  if(sp&&sp.ok){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y,7,2.5,0,0,TAU);ctx.fill();
    const walk=step>0;let fr;
    if(dir===0)fr=walk?(G.t>>3)%2:0;else if(dir===3)fr=walk?6+(G.t>>3)%2:6;else fr=walk?4+(G.t>>3)%2:3;
    const fw=sp.fw,fh=sp.fh;
    if(dir===1){const n=sp.img.width/fw;ctx.drawImage(sp.flip||sp.img,(n-1-fr)*fw,0,fw,fh,x-fw/2,y-fh+1-(bob?1:0),fw,fh);}
    else ctx.drawImage(sp.img,fr*fw,0,fw,fh,x-fw/2,y-fh+1-(bob?1:0),fw,fh);
    return;}const s=step%2?1:0,b=bob?1:0;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y,6,2.2,0,0,TAU);ctx.fill();
  // ноги
  const lu=s?1:0,ru=s?0:1;
  if(dir===1||dir===2){px(x-2,y-5-(step?1:0),3,5,L.pants);px(x-2,y-1,3,1,L.shoe);}
  else{px(x-3,y-5,2,5-lu,L.pants);px(x+1,y-5,2,5-ru,L.pants);px(x-3,y-1-lu,2,1,L.shoe);px(x+1,y-1-ru,2,1,L.shoe);}
  const ty=y-11-b;
  // туловище
  px(x-4,ty,8,6,L.shirt);if(L.apron&&dir!==3)px(x-3,ty+2,6,5,L.apron);
  // руки
  const sw=step?(s?1:-1):0;
  if(dir===1){px(x-1+sw,ty+1,2,5,L.shirt);px(x-1+sw,ty+5,2,1,L.skin);}
  else if(dir===2){px(x-1-sw,ty+1,2,5,L.shirt);px(x-1-sw,ty+5,2,1,L.skin);}
  else{px(x-6,ty+1+(sw>0?1:0),2,4,L.shirt);px(x+4,ty+1+(sw<0?1:0),2,4,L.shirt);px(x-6,ty+5+(sw>0?1:0),2,1,L.skin);px(x+4,ty+5+(sw<0?1:0),2,1,L.skin);}
  // голова
  const hy=ty-7;px(x-3,hy,6,7,L.skin);
  if(L.beard&&dir!==3)px(x-3,hy+4,6,3,L.beard);
  // волосы
  px(x-3,hy-1,6,2,L.hair);
  if(dir===3)px(x-3,hy,6,5,L.hair);
  else if(dir===1){px(x,hy,3,4,L.hair);}
  else if(dir===2){px(x-3,hy,3,4,L.hair);}
  else{px(x-3,hy,1,3,L.hair);px(x+2,hy,1,3,L.hair);}
  if(L.style===1&&dir!==0)px(dir===1?x+2:dir===2?x-4:x-3,hy+2,dir===3?6:2,dir===3?6:5,L.hair);
  if(L.style===1&&dir===0){px(x-4,hy+1,1,6,L.hair);px(x+3,hy+1,1,6,L.hair);}
  if(L.style===3&&dir!==3)px(x-3,hy-2,6,1,'#f2efe6');
  // глаза
  if(dir===0){px(x-2,hy+3,1,1,'#1a1410');px(x+1,hy+3,1,1,'#1a1410');}
  else if(dir===1)px(x-2,hy+3,1,1,'#1a1410');
  else if(dir===2)px(x+1,hy+3,1,1,'#1a1410');
}

/* ================= МИР: районы острова ================= */
/* тайлы: 0 глубина, 1 мелководье, 2 мокрый песок, 3 песок, 4 трава, 5 джунгли, 6 скалы */
const T_SOLID=[1,1,0,0,0,1,1];
const ZONES={};
function genBeach(){
  const w=40,h=36,m=[];
  /* плавные границы: берег и кромка джунглей (в пикселях) */
  const shoreF=x=>16*TS+6+Math.sin(x/TS*0.33)*12+Math.sin(x*0.051+2)*5;
  const jungF=x=>3.6*TS+Math.sin(x/TS*0.45+1)*14+Math.sin(x*0.093)*4;
  const rockW=y=>(y>9*TS-4&&y<12*TS+4)?-99:44+Math.sin(y*0.11)*7+Math.sin(y*0.037)*5;
  const rockE=y=>w*TS-46+Math.sin(y*0.09+1)*7+Math.sin(y*0.031)*6;
  const terr=(x,y)=>{const sh=shoreF(x);
    if(y>sh+6)return y>sh+34?0:1;
    if(y>sh-9)return 2;
    const j=jungF(x);if(y<j)return 5;
    if(x<rockW(y)||x>rockE(y))return 6;
    if(y<j+22)return 4;return 3;};
  for(let y=0;y<h;y++){m.push([]);for(let x=0;x<w;x++)m[y].push(terr(x*TS+8,y*TS+8));}
  const O=[];const o=(type,tx,ty,extra)=>{const ob=Object.assign({type,x:tx*TS+8,y:ty*TS+12},extra||{});O.push(ob);return ob;};
  o('fire',19,9,{id:'fire',solid:[16,8]});
  o('tent',15,7,{solid:[46,10]});o('tent',24,7,{solid:[46,10],flip:1});
  o('wreck',33,15,{solid:[36,10]});
  o('crate',30,16,{id:'crate',hidden:1});
  for(const [x,y,i] of [[8,14,0],[12,15,1],[26,13,2],[34,12,3]])o('wood',x,y,{id:'wood'+i});
  for(const [x,y,i] of [[10,6,0],[13,5,1],[27,5,2],[30,6,3]])o('dig',x,y,{id:'dig'+i});
  for(const [x,y,i] of [[5,15,0],[11,16,1],[24,16,2],[31,13,3],[36,15,4]])o('log',x,y,{id:'log'+i,hidden:1});
  o('raft',27,14,{id:'raft'});
  for(const [x,y,k] of [[6,6,0],[9,4,1],[24,4,2],[32,5,3],[35,8,4],[5,12,5],[37,12,6],[16,4,7],[20,5,8]])o('palm',x,y,{k,solid:[6,4]});
  for(const [x,y,k] of [[7,8,0],[14,10,1],[29,9,2],[21,13,3],[3,12,4]])o('rock',x,y,{k,solid:[10,5]});
  for(const [x,y,k] of [[11,5,0],[18,5,1],[26,6,2],[33,6,3],[8,5,4]])o('bush',x,y,{k,solid:[12,5]});
  for(const [x,y,k] of [[9,16,0],[17,15,1],[22,16,2],[28,15,3],[14,16,4]])o('shell',x,y,{k,deco:1});
  const npc=[
    {id:'marta',name:'Марта',L:LOOK.marta,x:17*TS+4,y:9*TS+12,dir:2},
    {id:'olaf',name:'Олаф',L:LOOK.olaf,x:28*TS+8,y:13*TS+10,dir:1},
    {id:'cyrus',name:'Сайрус',L:LOOK.cyrus,x:21*TS+8,y:10*TS+10,dir:1}];
  return {id:'beach',name:'Пляж крушения',w,h,m,O,npc,terr,shoreF,jungF,start:{x:19*TS+8,y:13*TS+8},
    exits:[{x:0,y:9*TS,w:8,h:3*TS,msg:'Западный пляж. Туда пока не пройти: проход откроется в следующей версии.'}]};
}
ZONES.beach=genBeach;

let Z=null,ground=null;
function loadZone(id){Z=ZONES[id]();buildGround();}
function tileAt(tx,ty){if(tx<0||ty<0||tx>=Z.w||ty>=Z.h)return 6;return Z.m[ty][tx];}
function tileAtP(x,y){if(x<0||y<0||x>=Z.w*TS||y>=Z.h*TS)return 6;return Z.terr?Z.terr(x,y):tileAt(Math.floor(x/TS),Math.floor(y/TS));}
function texData(k){const s=SPR[k];if(!s||!s.ok)return null;if(s.data)return s;
  const c=document.createElement('canvas');c.width=s.img.width;c.height=s.img.height;const g=c.getContext('2d');g.drawImage(s.img,0,0);
  s.data=g.getImageData(0,0,c.width,c.height).data;s.tw=c.width;s.th=c.height;return s;}
function buildGround(){
  ground=document.createElement('canvas');const GW=Z.w*TS,GH=Z.h*TS;ground.width=GW;ground.height=GH;const g=ground.getContext('2d');
  const TX={3:texData('t_sand'),2:texData('t_wet'),4:texData('t_grass'),5:texData('t_jungle'),6:texData('t_rock'),1:texData('t_water'),0:texData('t_water')};
  const C={2:[201,185,138],3:[230,211,160],4:[111,154,72],5:[31,74,38],6:[122,118,108],1:[63,163,180],0:[31,111,143]};
  G.groundTex=!!TX[3];
  const img=g.createImageData(GW,GH),d=img.data;
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const t=Z.terr?Z.terr(x,y):Z.m[y>>4][x>>4];let r,gg,b;const T=TX[t];
    if(T){const i=((y%T.th)*T.tw+(x%T.tw))*4;r=T.data[i];gg=T.data[i+1];b=T.data[i+2];}
    else{const c=C[t];r=c[0];gg=c[1];b=c[2];if(hash(x>>1,y>>1)>0.93){r-=12;gg-=12;b-=12;}}
    let k=1;
    if(Z.shoreF){const sh=Z.shoreF(x);
      if(t===0||t===1){const dd=(y-sh-6)/40;k=0.92-clamp(dd,0,1)*0.42;if(dd>0.3){b=b*1.05;gg=gg*0.92;}if(y<sh+9){r=r*0.85+40;gg=gg*0.85+45;b=b*0.85+40;}}
      if(t===2){const q=clamp((sh-y)/9,0,1);const T3=TX[3];if(T3){const i=((y%T3.th)*T3.tw+(x%T3.tw))*4;r=r*0.55+T3.data[i]*0.45;gg=gg*0.55+T3.data[i+1]*0.45;b=b*0.55+T3.data[i+2]*0.45;}k=0.95+q*0.05;}
      if(t===3&&y>sh-14){k=0.97;}
      const j=Z.jungF(x);if(t===4&&y<j+6)k=0.65+(y-j)/6*0.35;if(t===4){gg*=0.9;r*=0.95;}if(t===5&&y>j-4)k=0.75;}
    if(t===6&&Z.terr&&Z.terr(x,y+4)!==6)k=0.7;
    const o=(y*GW+x)*4;d[o]=clamp(r*k,0,255);d[o+1]=clamp(gg*k,0,255);d[o+2]=clamp(b*k,0,255);d[o+3]=255;}
  g.putImageData(img,0,0);
}
/* столкновения */
function objSolid(o){if(!o.solid||o.hidden||o.gone)return null;return {x:o.x-o.solid[0]/2,y:o.y-o.solid[1],w:o.solid[0],h:o.solid[1]};}
function blocked(x,y,hw,hh){
  for(const [cx,cy] of [[x-hw,y-hh],[x+hw,y-hh],[x-hw,y],[x+hw,y]]){if(T_SOLID[tileAtP(cx,cy)])return true;}
  for(const o of Z.O){const r=objSolid(o);if(r&&x+hw>r.x&&x-hw<r.x+r.w&&y>r.y&&y-hh<r.y+r.h)return true;}
  for(const n of Z.npc){if(Math.abs(n.x-x)<7&&Math.abs(n.y-y)<5)return true;}
  return false;}
function isWater(x,y){const t=tileAtP(x,y);return t===0||t===1;}

/* ================= СОСТОЯНИЕ ИГРЫ ================= */
const DAYF=43200;            // кадров в игровых сутках (12 минут)
const MPF=1440/DAYF;         // игровых минут за кадр
let S=null;                  // сохраняемое
const G={t:0,toasts:[],fx:[],F:null,cam:{x:0,y:0},near:null,fade:0,step:0,stepT:0};
function newState(){return {v:1,zone:'beach',p:null,hp:100,food:75,inv:{},st:0,f:{},time:7*60,day:1,coll:{},raft:0,carry:0};}
function saveGame(){if(S&&ST.scene==='play'&&!ST.noSave)store.set('petlya_save',S);}
function hasSave(){const s=store.get('petlya_save',null);return !!(s&&s.v===1);}
function inv(id){return S.inv[id]||0;}
function give(id,n,silent){S.inv[id]=inv(id)+(n||1);if(!silent)toast(tl('Получено: ')+tl(ITEMS[id].n)+((n||1)>1?' ×'+n:''));}
function take(id,n){S.inv[id]=Math.max(0,inv(id)-(n||1));if(!S.inv[id])delete S.inv[id];}
function toast(s){G.toasts.push({s,t:0});if(G.toasts.length>3)G.toasts.shift();}
function hour(){return (S.time/60)%24;}
function isNight(){const h=hour();return h>=20.5||h<5;}

function startGame(fresh){
  if(fresh||!hasSave()){S=newState();}else S=store.get('petlya_save');
  loadZone(S.zone);applyFlags();
  const P=S.p||{x:Z.start.x,y:Z.start.y,dir:3};S.p=P;
  G.F=null;G.toasts=[];G.fx=[];UI=[];ST.scene='play';ST.modal=null;
  music(isNight()?'night':'day');
  if(S.st===0)startIntro();
}
function applyFlags(){for(const o of Z.O){if(o.id&&S.f['gone_'+o.id])o.gone=1;
  if(o.type==='crate')o.hidden=S.st<3;
  if(o.type==='log')o.hidden=S.st<10;}}

/* ================= ИГРОК ================= */
const DIRV=[[0,1],[-1,0],[1,0],[0,-1]];
function updPlayer(){
  const P=S.p;if(G.F){updFish();return;}
  const sp=0.95;let ax=inp.ax,ay=inp.ay;const m=Math.hypot(ax,ay);
  if(m>0.1){
    if(Math.abs(ax)>Math.abs(ay))P.dir=ax<0?1:2;else P.dir=ay<0?3:0;
    const vx=ax*sp,vy=ay*sp;
    if(!blocked(P.x+vx,P.y,4,4))P.x+=vx;else if(Math.abs(vx)>0.3&&G.t%20===0)sfx('bump');
    if(!blocked(P.x,P.y+vy,4,4))P.y+=vy;
    if(++G.stepT>9){G.stepT=0;G.step=G.step?0:1;if(G.step)sfx('step');}
    for(const e of Z.exits){if(P.x>=e.x&&P.x<=e.x+e.w&&P.y>=e.y&&P.y<=e.y+e.h){P.x+=10;if(!G.exitT||G.t-G.exitT>120){toast(tl(e.msg));G.exitT=G.t;}}}
  }else{G.step=0;G.stepT=0;}
  P.x=clamp(P.x,6,Z.w*TS-6);P.y=clamp(P.y,8,Z.h*TS-4);
  G.near=findNear();
  if(inp.actP&&G.near)doAction(G.near);
  if(inp.bag){openBag();}
  if(inp.menu){openPause();}
}
function front(d){const P=S.p,v=DIRV[P.dir];return {x:P.x+v[0]*d,y:P.y-3+v[1]*d};}
function findNear(){
  const P=S.p,f=front(10);let best=null,bd=1e9;
  const cand=(kind,label,obj,x,y,r)=>{const d=Math.hypot(f.x-x,f.y-y);if(d<r&&d<bd){bd=d;best={kind,label,obj};}};
  for(const n of Z.npc)cand('talk','ГОВОРИТЬ',n,n.x,n.y-4,16);
  for(const o of Z.O){if(o.hidden||o.gone)continue;
    if(o.type==='wood'||o.type==='log'||o.type==='crate')cand('take','ВЗЯТЬ',o,o.x,o.y-3,14);
    else if(o.type==='dig')cand('dig','КОПАТЬ',o,o.x,o.y,13);
    else if(o.type==='fire')cand('fire',S.f.fire?'КОСТЁР':'ЗАЖЕЧЬ',o,o.x,o.y-2,18);
    else if(o.type==='raft'&&S.st>=10)cand('raft','ПЛОТ',o,o.x,o.y-6,22);
    else if(o.type==='shell'&&!o.deco)cand('take','ВЗЯТЬ',o,o.x,o.y,10);}
  if(!best&&inv('rod')){for(let d=8;d<=26;d+=6){const p=front(d);if(isWater(p.x,p.y)){best={kind:'fish',label:'ЛОВИТЬ',obj:null};break;}}}
  return best;
}
function doAction(n){
  const o=n.obj;
  if(n.kind==='talk'){talkTo(o);return;}
  if(n.kind==='take'){
    if(o.type==='wood'){o.gone=1;S.f['gone_'+o.id]=1;give('wood',1,true);sfx('pick');toast(tl('Плавник')+' ('+Math.min(3,inv('wood'))+'/3)');puff(o.x,o.y);}
    else if(o.type==='log'){o.gone=1;S.f['gone_'+o.id]=1;S.carry++;give('log',1,true);sfx('pick');toast(tl('Бревно')+' ('+(S.raft+inv('log'))+'/5)');puff(o.x,o.y);}
    else if(o.type==='crate'){o.gone=1;S.f['gone_'+o.id]=1;give('line');sfx('pick');puff(o.x,o.y);storyEvent('crate');}
    saveGame();return;}
  if(n.kind==='dig'){
    if(!inv('shovel')){toast(tl('Рыхлая земля. Нужна лопата.'));return;}
    if(S.f['dug_'+o.id]===S.day){toast(tl('Здесь уже копали. Земля восстановится завтра.'));return;}
    S.f['dug_'+o.id]=S.day;const k=ri(1,2);give('worm',k);sfx('dig');puff(o.x,o.y,'#5c4630');storyEvent('dig');saveGame();return;}
  if(n.kind==='fire'){fireAction(o);return;}
  if(n.kind==='raft'){
    if(inv('log')){const k=inv('log');S.raft=Math.min(5,S.raft+k);take('log',k);sfx('dig');toast(tl('Плот: брёвен ')+S.raft+'/5');storyEvent('raft');saveGame();}
    else toast(S.raft>=5?tl('Каркас плота готов. Нужно ещё много работы.'):tl('Нужны брёвна. Море выносит их на берег.'));
    return;}
  if(n.kind==='fish'){startFish();return;}
}
function puff(x,y,c){for(let i=0;i<8;i++)G.fx.push({x,y:y-3,vx:rnd(-0.8,0.8),vy:rnd(-1.2,-0.2),t:0,life:ri(16,26),c:c||'#e8dcc0'});}

/* ================= КОСТЁР: зажечь, готовить, спать ================= */
function fireAction(o){
  if(!S.f.fire){
    if(S.st<1){toast(tl('Костровище. Нужны дрова.'));return;}
    if(inv('wood')<3){toast(tl('Нужно 3 плавника, есть ')+inv('wood')+'.');return;}
    take('wood',3);S.f.fire=1;sfx('fire');puff(o.x,o.y-4,'#ffcf6a');storyEvent('fire');saveGame();return;}
  const opts=[];
  const raw=Object.keys(S.inv).filter(k=>ITEMS[k]&&ITEMS[k].fish);
  if(raw.length&&S.f.recipe)for(const k of raw)opts.push({label:tl('ГОТОВИТЬ: ')+tl(ITEMS[k].n).toUpperCase(),act:()=>cook(k)});
  else if(raw.length)opts.push({label:tl('ГОТОВИТЬ'),act:()=>toast(tl('Не знаю, как это приготовить. Спроси Сайруса.'))});
  opts.push({label:isNight()?tl('СПАТЬ ДО УТРА'):tl('ВЗДРЕМНУТЬ ДО ВЕЧЕРА'),act:()=>sleep()});
  opts.push({label:tl('ОТМЕНА'),act:()=>{}});
  openChoice(tl('Костёр'),opts);
}
function cook(k){take(k);give(ITEMS[k].ck,1,true);sfx('fire');toast(tl('Приготовлено: ')+tl(ITEMS[ITEMS[k].ck].n));S.f.cooked=(S.f.cooked||0)+1;storyEvent('cook');saveGame();}
function eat(k){const it=ITEMS[k];take(k);S.food=Math.min(100,S.food+it.food);S.hp=Math.min(100,S.hp+(it.hp||0));sfx('eat');
  toast(it.fish?tl('Сырая рыба… Сытно, но лучше было приготовить.'):tl('Вкусно! Здоровье +')+it.hp);if(k.startsWith('c_'))storyEvent('eat');saveGame();}
function sleep(){
  G.fade=1;ST.modal='sleep';G.sleepT=0;sfx('ui');
}
function updSleep(){G.sleepT++;
  if(G.sleepT===60){const night=isNight();const h=hour();
    let add;if(night){add=((6-h)+24)%24*60;}else add=Math.max(60,(19-h)*60);
    S.time+=add;if(S.time>=1440){S.time-=1440;S.day++;}S.hp=Math.min(100,S.hp+25);S.food=Math.max(0,S.food-10);
    music(isNight()?'night':'day');saveGame();}
  if(G.sleepT>=120){ST.modal=null;G.fade=0;toast(isNight()?tl('Наступил вечер.'):tl('День ')+S.day+tl('. Утро на острове.'));}
}

/* ================= ВРЕМЯ, ГОЛОД ================= */
function updTime(){
  const wasNight=isNight();S.time+=MPF;if(S.time>=1440){S.time-=1440;S.day++;toast(tl('День ')+S.day);}
  if(wasNight!==isNight())music(isNight()?'night':'day');
  S.food=Math.max(0,S.food-100/DAYF*1.1);
  if(S.food<=0)S.hp-=0.012;
  if(S.food<20&&G.t%1800===0)toast(tl('Ник проголодался.'));
  if(S.hp<=0){S.hp=45;S.food=30;S.p.x=Z.start.x;S.p.y=Z.start.y;S.time=7*60;S.day++;G.F=null;
    openDialog([{w:'narr',s:'Голод взял своё: Ник потерял сознание.'},{w:'marta',s:'Ник! Очнись… Вот, выпей воды. Тебе надо есть, слышишь?'}]);}

/* ================= РЫБАЛКА ================= */
const FISH={
  f_mack:{w:[0.4,1.2],str:0.9,day:1,night:0.3},
  f_bass:{w:[0.8,2.6],str:1.3,day:0.4,night:0.3},
  f_parrot:{w:[0.6,1.8],str:1.1,day:0.25,night:0,hours:[10,16]},
  f_eel:{w:[0.9,3.2],str:1.5,day:0,night:0.6}};
function rollFish(){const h=hour(),n=isNight(),pool=[];
  for(const k in FISH){const f=FISH[k];let wgt=n?f.night:f.day;if(f.hours&&(h<f.hours[0]||h>f.hours[1]))wgt=0;if(wgt>0)pool.push([k,wgt]);}
  let s=pool.reduce((a,b)=>a+b[1],0)*Math.random();for(const [k,w] of pool){if((s-=w)<=0)return k;}return pool[0][0];}
function startFish(){
  if(!inv('worm')){toast(tl('Нужна наживка. Накопай червей в рыхлой земле.'));return;}
  let p=null;for(let d=40;d>=12;d-=4){const q=front(d);if(isWater(q.x,q.y)){p=q;break;}}
  if(!p)return;take('worm');sfx('cast');
  G.F={ph:'cast',t:0,bx:p.x,by:p.y,sx:S.p.x,sy:S.p.y-14,wait:ri(100,320)};
}
function updFish(){const F=G.F;F.t++;
  if(F.ph==='cast'){if(F.t>=22){F.ph='wait';F.t=0;sfx('plop');}return;}
  if(F.ph==='wait'){if(inp.actP){G.F=null;toast(tl('Ты вытащил пустой крючок. Наживка пропала.'));return;}
    if(F.t>=F.wait){F.ph='bite';F.t=0;F.kind=rollFish();sfx('bite');}return;}
  if(F.ph==='bite'){if(inp.actP){const f=FISH[F.kind];F.ph='reel';F.t=0;F.d=100;F.T=0;F.res=false;F.rt=ri(40,90);F.str=f.str;F.wt=+rnd(f.w[0],f.w[1]).toFixed(1);return;}
    if(F.t>48){G.F=null;toast(tl('Сорвалась! И наживку съела.'));}return;}
  if(F.ph==='reel'){
    if(--F.rt<=0){F.res=!F.res;F.rt=F.res?ri(35,80):ri(45,110);if(F.res)sfx('bite');}
    const hold=inp.act;
    if(hold){if(F.res){F.T+=1.6*F.str;F.d-=0.12;}else{F.T=Math.max(0,F.T-0.6);F.d-=0.55/F.str;if(G.t%6===0)sfx('reel');}}
    else{F.T=Math.max(0,F.T-1.4);F.d+=F.res?0.35*F.str:0.08;}
    if(F.T>=100){G.F=null;sfx('snap');toast(tl('Леска лопнула! Не тяни, когда рыба рвётся (леска красная).'));return;}
    if(F.d>=140){G.F=null;toast(tl('Рыба ушла…'));return;}
    if(F.d<=0){F.ph='done';F.t=0;sfx('catch');give(F.kind,1,true);const nw=!S.coll[F.kind];S.coll[F.kind]=Math.max(S.coll[F.kind]||0,F.wt);F.nw=nw;storyEvent('fish',F.kind);saveGame();}
    return;}
  if(F.ph==='done'){if(F.t>30&&inp.actP||F.t>240)G.F=null;}
}

function dirTo(a,b){const dx=b.x-a.x,dy=b.y-a.y;return Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:0);}

function camera(){const P=S.p,mw=Z.w*TS,mh=Z.h*TS;
  G.cam.x=mw<=W?R((mw-W)/2):R(clamp(P.x-W/2,0,mw-W));G.cam.y=mh<=H?R((mh-H)/2):R(clamp(P.y-H/2-10,0,mh-H));}
function drawWorld(){
  camera();const cx=G.cam.x,cy=G.cam.y,t=G.t;
  ctx.fillStyle='#1f6f8f';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-cx,-cy);
  ctx.drawImage(ground,0,0);
  // вода: блики и прибой вдоль плавного берега
  if(!G.groundTex&&SPR.t_sand&&SPR.t_sand.ok)buildGround();
  if(Z.shoreF){const x0=Math.max(0,cx-4),x1=Math.min(Z.w*TS,cx+W+4);
    for(let x=x0;x<x1;x+=2){const sh=Z.shoreF(x),w1=Math.sin(t*0.03+x*0.03)*2.5;
      ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(x,R(sh+6+w1),2,2);
      ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(x,R(sh+3+w1*1.6),2,1);
      if(hash(x,7)>0.8){const ph=Math.sin(t*0.05+x);if(ph>0.6){ctx.fillStyle='rgba(230,250,255,.5)';ctx.fillRect(x,R(sh+14+hash(x,3)*40),3,1);}}}}
  // плоское
  for(const o of Z.O){if(o.hidden||o.gone)continue;if(o.type==='dig')drawDig(o.x,o.y,S.f['dug_'+o.id]===S.day);if(o.type==='shell')drawShell(o.x,o.y,o.k);}
  // объекты по глубине
  const list=[];
  for(const o of Z.O){if(o.hidden||o.gone||o.type==='dig'||o.type==='shell')continue;if(o.type==='raft'&&S.st<10)continue;list.push({y:o.y,o});}
  for(const n of Z.npc)list.push({y:n.y,n});
  list.push({y:S.p.y,p:1});
  list.sort((a,b)=>a.y-b.y);
  for(const e of list){
    if(e.p){drawPerson(S.p.x,S.p.y,S.p.dir,G.step,LOOK.nick,G.step);
      if(G.F&&G.F.ph!=='done'){/* удочка */const P=S.p,v=DIRV[P.dir],hx=P.x+v[0]*6,hy=P.y-12+(P.dir===3?-2:0),tx=hx+v[0]*8,ty=hy-8;
        ctx.strokeStyle='#8a6a42';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx,ty);ctx.stroke();G.F.tip={x:tx,y:ty};}
      continue;}
    if(e.n){const n=e.n,idle=Math.sin(t*0.05+n.x)>0.95;drawPerson(n.x,n.y,n.dir,0,n.L,idle?1:0);
      if(questNpc()===n.id&&!ST.modal){const by=n.y-28+R(Math.sin(t*0.1)*1.5);px(n.x-2,by-7,4,1,'#ffd24a');ctx.fillStyle='#ffd24a';ctx.font='10px '+FD;ctx.textAlign='center';ctx.fillText('!',n.x,by);}
      continue;}
    const o=e.o;
    switch(o.type){
      case 'palm':drawPalm(o.x-1,o.y,t,o.k);break;
      case 'tent':drawTent(o.x,o.y,o.flip);break;
      case 'fire':drawFirePit(o.x,o.y,S.f.fire,t);break;
      case 'wreck':drawWreck(o.x,o.y);break;
      case 'crate':drawCrate(o.x,o.y);glint(o.x,o.y-10);break;
      case 'wood':if(!spr('o_drift',o.x,o.y+2))drawIcon('wood',o.x-6,o.y-9);glint(o.x,o.y-8);break;
      case 'log':drawLogItem(o.x,o.y);glint(o.x,o.y-6);break;
      case 'raft':drawRaft(o.x,o.y,S.raft);break;
      case 'rock':drawRock(o.x,o.y,o.k);break;
      case 'bush':drawBush(o.x,o.y,o.k);break;
    }}
  // леска и поплавок
  if(G.F){const F=G.F,tip=F.tip||{x:S.p.x,y:S.p.y-20};
    let bx=F.bx,by=F.by;if(F.ph==='cast'){const k=F.t/22;bx=lerp(tip.x,F.bx,k);by=lerp(tip.y,F.by,k)-Math.sin(k*Math.PI)*18;}
    if(F.ph==='reel'){const k=clamp(F.d/100,0,1.3);bx=lerp(S.p.x,F.bx,k)+(F.res?R(Math.sin(t*0.9)*2):0);by=lerp(S.p.y,F.by,k);}
    const dip=F.ph==='bite'?(t%10<5?2:0):F.ph==='wait'?R(Math.sin(t*0.08)):0;
    if(F.ph!=='done'){ctx.strokeStyle=F.ph==='reel'&&F.res?'#ff5a4a':'rgba(240,240,230,.85)';ctx.lineWidth=F.ph==='reel'?1:0.7;ctx.beginPath();ctx.moveTo(tip.x,tip.y);
      ctx.quadraticCurveTo((tip.x+bx)/2,Math.max(tip.y,by)+(F.ph==='reel'?0:6),bx,by+dip);ctx.stroke();
      if(F.ph!=='reel'){px(bx-1,by-2+dip,3,2,'#ff4a3a');px(bx-1,by+dip,3,1,'#fff');}
      if(F.ph==='bite'||(F.ph==='reel'&&F.res)){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(bx,by+1,4+(t%20)/3,2+(t%20)/6,0,0,TAU);ctx.stroke();}}
    if(F.ph==='bite'){txtS('!',S.p.x,S.p.y-26,14,'#ffd24a','center',FD);}}
  // частицы
  for(let i=G.fx.length-1;i>=0;i--){const f=G.fx[i];f.t++;f.x+=f.vx;f.y+=f.vy;f.vy+=0.05;if(f.t>f.life){G.fx.splice(i,1);continue;}px(R(f.x),R(f.y),2,2,f.c);}
  // подсказка у цели
  if(G.near&&!ST.modal&&!G.F){const o=G.near.obj;if(o){const yy=(o.type==='palm'?o.y-40:o.y-(G.near.kind==='talk'?30:16))+R(Math.sin(t*0.15)*1.5);
    ctx.fillStyle='#fff6d0';ctx.beginPath();ctx.moveTo(o.x-3,yy-3);ctx.lineTo(o.x+3,yy-3);ctx.lineTo(o.x,yy);ctx.closePath();ctx.fill();}}
  ctx.restore();
  drawNight();
}

let darkC=null;
function nightLevel(){const h=hour();
  if(h>=6.5&&h<18.5)return 0;if(h>=20.5||h<4.5)return 0.78;
  if(h>=18.5)return (h-18.5)/2*0.78;return (6.5-h)/2*0.78;}
function drawNight(){const a=nightLevel(),h=hour();
  if(h>=17.5&&h<20.5){ctx.fillStyle='rgba(255,120,40,'+(0.12*Math.sin((h-17.5)/3*Math.PI))+')';ctx.fillRect(0,0,W,H);}
  if(h>=5&&h<7.5){ctx.fillStyle='rgba(255,170,120,'+(0.1*Math.sin((h-5)/2.5*Math.PI))+')';ctx.fillRect(0,0,W,H);}
  if(a<=0.01)return;
  if(!darkC||darkC.width!==W||darkC.height!==H){darkC=document.createElement('canvas');darkC.width=W;darkC.height=H;}
  const d=darkC.getContext('2d');d.globalCompositeOperation='source-over';d.clearRect(0,0,W,H);d.fillStyle='rgba(8,14,40,'+a+')';d.fillRect(0,0,W,H);
  d.globalCompositeOperation='destination-out';
  const hole=(x,y,r,k)=>{const g=d.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,'+k+')');g.addColorStop(1,'rgba(0,0,0,0)');d.fillStyle=g;d.beginPath();d.arc(x,y,r,0,TAU);d.fill();};
  hole(S.p.x-G.cam.x,S.p.y-8-G.cam.y,34,0.55);
  const f=Z.O.find(o=>o.type==='fire');if(f&&S.f.fire)hole(f.x-G.cam.x,f.y-6-G.cam.y,62+Math.sin(G.t*0.2)*2,0.95);
  ctx.drawImage(darkC,0,0);
  if(f&&S.f.fire){ctx.fillStyle='rgba(255,140,40,'+(0.08*a/0.68)+')';ctx.beginPath();ctx.arc(f.x-G.cam.x,f.y-6-G.cam.y,50,0,TAU);ctx.fill();}
}

/* ================= HUD ================= */

    for(let i=0;i<Math.min(2,L.length);i++)txtS(L[i],99,11+i*9,7,'#fff2c8');ctx.globalAlpha=1;}
  // меню

    const L=wrap(m.s,W-30,7);const hgt=L.length*9+6,y=34+i*0;ctx.globalAlpha=a;panel(12,y+i*0,W-24,hgt,'rgba(10,20,22,.85)','rgba(201,169,106,.5)');
    L.forEach((l,k)=>txt(l,W/2,y+11+k*9,7,'#f3ead2','center'));ctx.globalAlpha=1;
    if(i<G.toasts.length-1){/* показываем только последнее */}
    break;}
  drawControls();

function drawControls(){const c=ctlGeom(),touch=isTouchUI();
  let label=G.near?tl(G.near.label):'';
  if(G.F){label={cast:'',wait:tl('ВЫТАЩИТЬ'),bite:tl('ПОДСЕЧЬ!'),reel:tl('ТЯНУТЬ'),done:'OK'}[G.F.ph];}
  if(!touch){if(label)txtS('['+tl('Пробел')+'] '+label,W-6,H-8,7,'#fff2c8','right');txtS('[I] '+tl('рюкзак'),6,H-8,7,'#c9c3a8');return;}
  ctx.globalAlpha=0.55;
  const st=[...touches.values()].find(t=>t.role==='stick');
  const sx=st?st.x0:c.stick.x,sy=st?st.y0:c.stick.y;
  ctx.fillStyle='#0c1a1f';ctx.beginPath();ctx.arc(sx,sy,c.stick.r,0,TAU);ctx.fill();ctx.strokeStyle='#c9a96a';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#e8e2c8';ctx.beginPath();ctx.arc(sx+inp.ax*14,sy+inp.ay*14,9,0,TAU);ctx.fill();

  button(tl('В ГЛАВНОЕ МЕНЮ'),x,y,w,18,()=>{saveGame();ST.modal=null;ST.scene='title';ST.sel=0;music('day');});y+=26;
  txt(tl('Игра сохраняется сама.'),W/2,y+6,6,'#9a9a88','center');}
function drawBag(){UI=[];ctx.fillStyle='rgba(8,14,16,.96)';ctx.fillRect(0,0,W,H);
  txt(tl('РЮКЗАК'),W/2,18,12,'#ffd27a','center',FD);

  tabs.forEach((t,i)=>{const on=ST.bagTab===i;ctx.fillStyle=on?'#2f5148':'#162a2c';ctx.fillRect(8+i*tw,26,tw-2,16);txt(t,8+i*tw+tw/2-1,37,7,on?'#ffe7a8':'#b8c8b8','center',FD);
    UI.push({x:8+i*tw,y:26,w:tw-2,h:16,act:()=>{ST.bagTab=i;ST.bagSel=null;},nav:false});});
  let y=50;
  if(ST.bagTab===0){const ids=Object.keys(S.inv).filter(k=>S.inv[k]>0);
    if(!ids.length)txt(tl('Пусто.'),W/2,y+20,8,'#9a9a88','center');
    ids.forEach((k,i)=>{const sel=ST.bagSel===k,ry=y+i*20;ctx.fillStyle=sel?'#2f5148':'#13222a';ctx.fillRect(8,ry,W-16,18);
      drawIcon(k,12,ry+3);txt(tl(ITEMS[k].n)+(S.inv[k]>1?' ×'+S.inv[k]:''),30,ry+12,8,'#f3ead2');
      UI.push({x:8,y:ry,w:W-16,h:18,act:()=>{ST.bagSel=k;},nav:true});});
    const k=ST.bagSel;if(k&&S.inv[k]){const it=ITEMS[k],py=H-86;panel(8,py,W-16,52);
      const L=wrap(tl(it.d),W-32,7);L.slice(0,3).forEach((l,i)=>txt(l,14,py+12+i*9,7,'#d8d2bc'));
      if(it.food)button(tl('СЪЕСТЬ'),W/2-40,py+32,80,16,()=>{eat(k);if(!S.inv[k])ST.bagSel=null;},{hot:1,size:7});}}
  if(ST.bagTab===1){panel(8,y,W-16,70);txt(tl('Сейчас:'),14,y+13,7,'#c9a96a',null,FD);
    wrap(tl(OBJ[S.st]||''),W-32,8).forEach((l,i)=>txt(l,14,y+27+i*11,8,'#f3ead2'));
    y+=80;txt(tl('Пляж крушения'),14,y+8,8,'#c9a96a',null,FD);
    wrap(tl('Тим, сын Марты, был во второй шлюпке — её отнесло на запад. Олаф собирается строить плот.'),W-28,7).forEach((l,i)=>txt(l,14,y+22+i*9,7,'#b8b2a0'));}
  if(ST.bagTab===2){const all=Object.keys(FISH);txt(tl('Пойманные виды: ')+all.filter(k=>S.coll[k]).length+' / '+all.length,14,y+10,8,'#c9a96a');
    all.forEach((k,i)=>{const ry=y+18+i*22,got=S.coll[k];ctx.fillStyle='#13222a';ctx.fillRect(8,ry,W-16,20);
      if(got){drawIcon(k,12,ry+4);txt(tl(ITEMS[k].n),30,ry+13,8,'#f3ead2');txt(tl('рекорд ')+got+tl(' кг'),W-14,ry+13,7,'#9fe07a','right');}

  button(tl('ЗАКРЫТЬ'),W/2-50,H-28,100,18,()=>{ST.modal=null;},{size:8});

/* ================= ГЛАВНОЕ МЕНЮ ================= */
function drawTitle(){UI=[];const t=G.t;

  const hy=R(H*0.555);ctx.fillStyle='#ffe2a0';ctx.beginPath();ctx.arc(W/2,hy,26,Math.PI,0);ctx.fill();

  // силуэт острова
  ctx.fillStyle='#14222a';ctx.beginPath();ctx.moveTo(W*0.55,hy);ctx.quadraticCurveTo(W*0.72,hy-30,W*0.82,hy-16);ctx.quadraticCurveTo(W*0.9,hy-24,W+5,hy-6);ctx.lineTo(W+5,hy);ctx.fill();
  drawPalm(W-30,hy-8,t,1);
  for(let i=0;i<4;i++){const bx=(t*0.3+i*70)%(W+40)-20,by=H*0.2+i*12+Math.sin(t*0.05+i)*3;ctx.strokeStyle='#14222a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(bx-4,by);ctx.lineTo(bx,by+2);ctx.lineTo(bx+4,by);ctx.stroke();}
  txtS(tl('ПЕТЛЯ'),W/2,H*0.2,30,'#fff2d0','center',FD);txtS(tl('ПРИЛИВА'),W/2,H*0.2+28,22,'#ffd27a','center',FD);
  txtS(tl('ПРИКЛЮЧЕНИЕ НА ОСТРОВЕ'),W/2,H*0.2+44,7,'#ffe8c0','center',FD);

  if(hasSave()){button(tl('ПРОДОЛЖИТЬ'),x,y,w,22,()=>{auInit();startGame(false);},{hot:1,size:9});y+=28;

  else{button(tl('НАЧАТЬ ИГРУ'),x,y,w,22,()=>{auInit();startGame(true);},{hot:1,size:9});y+=28;}

  if(ST.confirm)drawConfirm();
}
function openChoiceTitle(){ST.confirm=1;ST.sel=0;}
function drawConfirm(){UI=[];ctx.fillStyle='rgba(5,10,12,.8)';ctx.fillRect(0,0,W,H);panel(20,H/2-46,W-40,92);
  wrap(tl('Начать заново? Сохранённая игра будет удалена.'),W-60,8).forEach((l,i)=>txt(l,W/2,H/2-26+i*11,8,'#f3ead2','center'));
  button(tl('ДА, ЗАНОВО'),30,H/2+12,(W-66)/2,20,()=>{ST.confirm=0;store.del('petlya_save');auInit();startGame(true);},{size:7});
  button(tl('НЕТ'),36+(W-66)/2,H/2+12,(W-66)/2,20,()=>{ST.confirm=0;},{hot:1,size:7});}

/* ================= ЦИКЛ ================= */
const ST={scene:'title',modal:null,sel:0,kbd:false,t:0};
function update(){
  G.t++;readInput();
  if(AU.amb&&AU.ctx){const v=ST.scene==='play'?0.18:0.1;AU.amb.gain.value+=(v-AU.amb.gain.value)*0.02;}
  musicTick();
  if(ST.scene!=='play')return;
  if(ST.modal==='dlg'){updDialog();return;}
  if(ST.modal==='sleep'){updSleep();return;}
  if(ST.modal){if(inp.menu||(inp.bag&&ST.modal==='bag'))ST.modal=null;return;}
  updTime();updPlayer();
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(SC*DPR,0,0,SC*DPR,OX*DPR,OY*DPR);ctx.imageSmoothingEnabled=false;
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(ST.scene==='title'){drawTitle();}
  else{drawWorld();
    if(ST.modal!=='dlg'||!(DLG&&DLG.L[DLG.i].dark))drawHUD();
    if(ST.modal==='dlg')drawDialog();
    else if(ST.modal==='choice')drawChoice();
    else if(ST.modal==='bag')drawBag();
    else if(ST.modal==='pause')drawPause();
    else if(ST.modal==='sleep'){const k=G.sleepT<60?G.sleepT/60:1-(G.sleepT-60)/60;ctx.fillStyle='rgba(0,0,0,'+k+')';ctx.fillRect(0,0,W,H);
      if(k>0.6)txt('z z z',W/2,H/2,10,'#c9c3a8','center',FD);}
    else UI=[];}
  ctx.restore();
}
let last=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){update();acc-=1000/60;}
  render();requestAnimationFrame(frame);}
loadArt();layout();requestAnimationFrame(frame);
if('serviceWorker' in navigator&&(/github\.io$/.test(location.hostname)||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__petlya={get S(){return S},G,ST,get Z(){return Z},startGame,keys,inp,step(n){for(let i=0;i<n;i++)update();},render,talkTo,findNear,doAction,eat,get UI(){return UI},get geo(){return {W,H,SC,OX,OY}}};
})();
