<html lang="ru"><head><meta charset="utf-8">

:root{--bg:#10141c;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{display:block;width:100%;height:100%;touch-action:none;outline:none}

<canvas id="cv" tabindex="0" aria-label="Ночная стража"></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=240,H=400,SC=1,OX=0,OY=0,DPR=1,portrait=true,Z=1.5,VW=160,VH=270;
const TS=16,TAU=Math.PI*2,R=Math.round;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),sgn=v=>v<0?-1:v>0?1:0,lerp=(a,b,t)=>a+(b-a)*t;
const hash=(x,y)=>{let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)};
const FT="'PT Mono','Courier New',monospace",FD="'Russo One','Arial Black',Impact,sans-serif";
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LANG='ru';const EN={};function tl(s){return LANG==='en'&&EN[s]||s;}

/* ================= ЭКРАН ================= */
function layout(){DPR=Math.min(window.devicePixelRatio||1,3);
  const vw=cv.clientWidth||innerWidth,vh=cv.clientHeight||innerHeight;cv.width=R(vw*DPR);cv.height=R(vh*DPR);
  portrait=vh>=vw;SC=Math.min(vw/240,vh/(portrait?420:260));
  W=Math.floor(Math.min(portrait?320:520,vw/SC));H=Math.floor(Math.min(640,vh/SC));
  OX=R((vw-W*SC)/2);OY=R((vh-H*SC)/2);Z=portrait?1.45:1.6;VW=W/Z;VH=H/Z;}
addEventListener('resize',layout);

/* ================= ТЕКСТ И КНОПКИ ================= */
function txt(s,x,y,size,col,align,font){s=tl(s);ctx.font=size+'px '+(font||FT);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function txtS(s,x,y,size,col,align,font){s=tl(s);ctx.font=size+'px '+(font||FT);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function wrap(s,maxW,size,font){s=tl(s);ctx.font=size+'px '+(font||FT);const out=[];
  for(const para of s.split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}out.push(line);}return out;}
function panel(x,y,w,h,fill,edge){ctx.fillStyle=fill||'rgba(12,13,18,.93)';ctx.fillRect(x,y,w,h);ctx.strokeStyle=edge||'#b8904a';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);}
let UI=[];
function button(label,x,y,w,h,fn,o){o=o||{};const hov=PT.over&&PT.x>=x&&PT.x<=x+w&&PT.y>=y&&PT.y<=y+h;
  ctx.fillStyle=o.hot?(hov?'#c84a3a':'#a83a2e'):(hov?'#3a3226':'#1e1b17');ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=o.hot?'#f0c0a0':'#7a5e38';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  txt(label,x+w/2,y+h/2+(o.size||8)*0.36,o.size||8,o.dis?'#665':o.hot?'#fff3e0':'#f0e0c0','center',FD);
  if(!o.dis)UI.push({x,y,w,h,fn});}

/* ================= ЗВУК ================= */
const AU={ctx:null,on:store.get('strazha_snd',true),mus:null,nextT:0,step:0,master:null};
function auInit(){if(AU.ctx)return;try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.on?0.5:0;AU.master.connect(AU.ctx.destination);
  AU.sfxG=AU.ctx.createGain();AU.sfxG.connect(AU.master);AU.musG=AU.ctx.createGain();AU.musG.gain.value=AU.musOn?1:0;AU.musG.connect(AU.master);ambInit();if(AU.mus)setMusic(AU.mus);setTimeout(()=>['night','mem','chase'].forEach(loadTrack),5000);}catch(e){}}
function setSound(v){AU.on=v;store.set('strazha_snd',v);if(AU.master)AU.master.gain.value=v?0.5:0;}
function tone(f,d,type,vol,slide,t0){if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=t0||c.currentTime;const o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AU.busNext||AU.sfxG||AU.master);o.start(t);o.stop(t+d+0.02);}
function noise(d,vol,hp,t0){if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=t0||c.currentTime,n=Math.floor(c.sampleRate*d);const b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;
  const g=c.createGain();g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(AU.busNext||AU.sfxG||AU.master);s.start(t);}
const now=()=>AU.ctx?AU.ctx.currentTime:0;
function sfx(k){switch(k){
  case'jump':noise(0.05,0.05,2000);tone(260,0.07,'triangle',0.05,420);break;case'land':noise(0.07,0.1,300);break;
  case'hit':noise(0.08,0.22,1200);tone(160,0.08,'sawtooth',0.08,80);break;
  case'clang':tone(1300,0.22,'triangle',0.12,1080);tone(1950,0.3,'sine',0.06,1900);tone(3100,0.12,'square',0.025);noise(0.05,0.12,3500);break;
  case'kill':noise(0.14,0.25,500);tone(240,0.25,'sawtooth',0.08,50);break;
  case'blade':tone(2600,0.06,'sawtooth',0.05,1200);noise(0.1,0.18,900,now()+0.05);break;
  case'shot':noise(0.3,0.38,180);tone(80,0.25,'square',0.12,35);break;
  case'hurt':tone(190,0.2,'sawtooth',0.12,70);break;case'throw':noise(0.08,0.12,3000);break;
  case'pick':{const k=Math.pow(1.06,Math.min(12,(G&&G.coinN)||0));tone(880*k,0.07,'square',0.06);tone(1320*k,0.1,'square',0.05,null,now()+0.06);break;}
  case'step':noise(0.045,0.04,1800+Math.random()*900);noise(0.03,0.025,4200,now()+0.025);break;case'tin':tone(700+Math.random()*200,0.04,'triangle',0.03);noise(0.03,0.03,4000);break;
  case'heart':tone(55,0.12,'sine',0.16);tone(50,0.14,'sine',0.13,null,now()+0.16);break;case'whoosh2':noise(0.09,0.06,1800);break;
  case'alert':tone(560,0.09,'square',0.08);tone(840,0.14,'square',0.08,null,now()+0.09);break;
  case'whistle':tone(2400,0.4,'sine',0.07,2700);break;case'grab':noise(0.04,0.08,1500);break;
  case'eagle':tone(2200,0.5,'sine',0.08,1300);tone(2600,0.35,'sine',0.05,1500,now()+0.25);break;
  case'sync':for(let i=0;i<5;i++)tone(440*Math.pow(1.26,i),0.4,'triangle',0.05,null,now()+i*0.08);bell(0.06);break;
  case'whoosh':noise(0.5,0.12,600);break;case'roll':noise(0.12,0.08,700);break;
  case'ok':tone(523,0.1,'square',0.06);tone(784,0.18,'square',0.06,null,now()+0.1);break;}}
const MUS={
  calm:{bpm:76,bass:[45,45,52,52,43,43,50,50,41,41,48,48,40,40,47,47],mel:[69,0,72,71,69,0,64,0,67,0,65,64,62,0,64,0,65,0,69,67,65,0,62,0,64,0,0,0,0,0,0,0],pad:1},
  tense:{bpm:128,bass:[45,57,45,57,46,58,46,58,45,57,45,57,40,52,44,56],mel:[76,0,76,74,72,0,71,0,72,0,74,0,69,0,0,0,76,0,79,77,76,0,74,0,72,71,69,0,68,0,69,0]},
  chase:{bpm:140,bass:[38,50,38,50,41,53,41,53,36,48,36,48,40,52,40,52],mel:[74,77,81,0,79,77,76,0,74,0,72,74,76,0,0,0,74,77,81,0,82,81,79,77,76,0,79,0,81,0,0,0]},
  mem:{bpm:60,bass:[45,0,52,0,48,0,52,0,43,0,50,0,47,0,52,0],mel:[81,0,0,0,79,0,76,0,77,0,0,0,76,0,74,0,72,0,0,0,74,0,76,0,69,0,0,0,0,0,0,0]}};
function midi(n){return 440*Math.pow(2,(n-69)/12);}
function musicTick(){ambTick();if(!AU.ctx||!AU.on||!AU.mus)return;if(hasTrack()){AU.nextT=0;return;}const c=AU.ctx,m=MUS[AU.mus];const sp=60/m.bpm/2;AU.busNext=AU.musG;try{musicTick2(c,m,sp);}finally{AU.busNext=null;}}
function musicTick2(c,m,sp){
  if(AU.nextT<c.currentTime)AU.nextT=c.currentTime+0.05;
  while(AU.nextT<c.currentTime+0.2){const i=AU.step%32;
    if(i%2===0){const b=m.bass[(i>>1)%16];if(b)tone(midi(b),sp*1.8,'triangle',0.09,null,AU.nextT);}
    const n=m.mel[i];if(n)tone(midi(n),sp*1.6,AU.mus==='mem'?'sine':'square',AU.mus==='mem'?0.05:0.032,null,AU.nextT);
    if((AU.mus==='tense'||AU.mus==='chase')&&i%4===2)noise(0.04,0.05,3000,AU.nextT);
    if(AU.mus==='chase'&&i%8===0)noise(0.09,0.09,120,AU.nextT);
    AU.nextT+=sp;AU.step++;}}
// ---- записанная музыка (Suno), с плавной сменой; пока трек не загружен — играет чиптюн выше ----
const TRK={theme:'snd/theme.mp3',night:'snd/night.mp3',chase:'snd/chase.mp3',mem:'snd/mem.mp3'};
const TRKV={theme:0.55,night:0.5,chase:0.5,mem:0.55};
const TB={},TL={};let TCUR=null;// буферы, загрузка, текущий {k,src,g}
AU.musOn=store.get('strazha_mus',true);
function trackFor(k){return k==='calm'?(ST.scene==='game'?'night':'theme'):k==='tense'||k==='chase'?'chase':k;}
function loadTrack(k){if(TB[k]||TL[k]||!AU.ctx)return;TL[k]=1;
  fetch(TRK[k]).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(b=>new Promise((ok,no)=>AU.ctx.decodeAudioData(b,ok,no))).then(buf=>{TB[k]=buf;if(trackFor(AU.mus)===k)playTrack(k);}).catch(()=>{TL[k]=2;});}
function playTrack(k){const c=AU.ctx;if(!c||!AU.musG)return;if(TCUR&&TCUR.k===k)return;const t=c.currentTime;
  if(TCUR){const o=TCUR;o.g.gain.cancelScheduledValues(t);o.g.gain.setValueAtTime(o.g.gain.value,t);o.g.gain.linearRampToValueAtTime(0,t+1.2);try{o.src.stop(t+1.3);}catch(e){}TCUR=null;}
  if(!k||!TB[k])return;const src=c.createBufferSource();src.buffer=TB[k];src.loop=true;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(TRKV[k]||0.5,t+1.5);
  src.connect(g);g.connect(AU.musG);src.start(t);TCUR={k,src,g};}
function hasTrack(){const k=trackFor(AU.mus);return !!(k&&TB[k]);}
function setMusic(k){if(AU.mus!==k){AU.mus=k;AU.step=0;}const tk=trackFor(k);if(!TCUR||TCUR.k!==tk){if(TB[tk])playTrack(tk);else{if(TCUR)playTrack(null);loadTrack(tk);}}}
function setMus(v){AU.musOn=v;store.set('strazha_mus',v);if(AU.musG)AU.musG.gain.value=v?1:0;}
// ---- атмосфера: ветер, далёкий колокол, гул толпы ----
const AMB={wind:null,crowd:null,bellT:0};
function ambInit(){const c=AU.ctx;if(!c||AMB.wind)return;const n=c.sampleRate*4,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);let l=0;
  for(let i=0;i<n;i++){l=l*0.985+(Math.random()*2-1)*0.06;a[i]=l;}// мягкий «бурый» шум
  const mk=(type,f,q)=>{const s=c.createBufferSource();s.buffer=b;s.loop=true;s.playbackRate.value=0.7+Math.random()*0.6;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(AU.sfxG);s.start();return {s,fl,g};};
  AMB.wind=mk('bandpass',500,0.7);AMB.crowd=mk('bandpass',380,2.2);}
function ambTick(){const c=AU.ctx;if(!c||!AMB.wind)return;const t=c.currentTime,inG=ST.scene==='game'&&!ST.modal;
  const wv=inG?0.22+0.12*Math.sin(t*0.31)+0.06*Math.sin(t*1.7):0.0;AMB.wind.g.gain.setTargetAtTime(wv*(P&&P.y<10*TS?1.5:1),t,0.4);AMB.wind.fl.frequency.setTargetAtTime(420+260*Math.sin(t*0.23),t,0.5);
  let cv=0;if(inG&&L&&L.crowds&&P){for(const cr of L.crowds){if(cr.gone)continue;const d=Math.hypot(cr.x-P.x,(cr.y||P.y)-P.y);cv=Math.max(cv,clamp(1-d/(TS*14),0,1));}}
  AMB.crowd.g.gain.setTargetAtTime(cv*0.5,t,0.3);
  if(inG&&ST.t>AMB.bellT){AMB.bellT=ST.t+60*(14+Math.random()*16);if(ST.t>600)bell(0.05);}}
function bell(v){const t=now();for(const [f,k] of [[196,1],[392,0.5],[588,0.3],[784,0.18]])tone(f*(1+Math.random()*0.003),3.2,'sine',v*k,null,t);}

/* ================= ВВОД ================= */
const K={},PT={x:0,y:0,over:false};const TOUCH={};let kbd=false;
const IN={l:0,r:0,u:0,d:0,j:0,a:0,b:0,v:0,jP:0,aP:0,uP:0,dP:0,lP:0,rP:0};let prevIN={};
addEventListener('keydown',e=>{if(e.repeat)return;K[e.code]=1;kbd=true;auInit();
  if(ST.scene==='act'&&(e.code==='Enter'||e.code==='Space'||e.code==='Escape')){actTap();e.preventDefault();return;}
  if(mapKey(e.code)){e.preventDefault();return;}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Escape'||e.code==='KeyP')togglePause();
  if(e.code==='KeyQ'||e.code==='Tab'){nextWeapon();e.preventDefault();}
  if((e.code==='Enter'||e.code==='Space')&&ST.dlg){dlgNext();e.preventDefault();}});
addEventListener('keyup',e=>{K[e.code]=0;});
function toLogical(cx,cy){const r=cv.getBoundingClientRect();return {x:(cx-r.left-OX)/SC,y:(cy-r.top-OY)/SC};}
function padLayout(){const s=CFG.big?1.2:1;const by=H-10;
  return {dpad:{x:50*s,y:by-46*s,r:34*s},
    btn:[{k:'j',x:W-34*s,y:by-34*s,r:23*s,l:'ПРЫЖОК'},{k:'a',x:W-86*s,y:by-24*s,r:21*s,l:'УДАР'},
      {k:'b',x:W-30*s,y:by-88*s,r:15*s,l:'БЛОК'},{k:'v',x:W-78*s,y:by-78*s,r:13*s,l:'ЧУТЬЁ'}]};}
function padTouch(){for(const id in TOUCH){const t=TOUCH[id];if(t.pad)return t;}return null;}
function touchKeys(){const o={l:0,r:0,u:0,d:0,j:0,a:0,b:0,v:0};if(ST.scene!=='game'||ST.modal)return o;const Lp=padLayout();
  for(const id in TOUCH){const t=TOUCH[id];if(t.ui)continue;
    if(!t.pad&&!t.btn&&(t.sx??t.x)<W*0.45&&(t.sy??t.y)>H*0.3){t.pad=1;t.ox=t.sx??t.x;t.oy=t.sy??t.y;}
    if(t.pad){let dx=t.x-t.ox,dy=t.y-t.oy,dd=Math.hypot(dx,dy);const r=Lp.dpad.r;
      if(dd>r){t.ox=t.x-dx/dd*r;t.oy=t.y-dy/dd*r;dx=t.x-t.ox;dy=t.y-t.oy;dd=r;}// крестовина едет за пальцем
      if(dd<8)continue;const c=dx/dd,s=dy/dd;if(c>0.42)o.r=1;if(c<-0.42)o.l=1;if(s<-0.62)o.u=1;if(s>0.62)o.d=1;continue;}
    let best=null,bd=1e9;for(const b of Lp.btn){const d=Math.hypot(t.x-b.x,t.y-b.y);if(d<b.r*1.4&&d<bd){bd=d;best=b;}}
    if(best){o[best.k]=1;t.btn=1;}}
  return o;}
function hitUI(p){for(let i=UI.length-1;i>=0;i--){const u=UI[i];if(p.x>=u.x&&p.x<=u.x+u.w&&p.y>=u.y&&p.y<=u.y+u.h){u.fn();return true;}}return false;}
cv.addEventListener('touchstart',e=>{e.preventDefault();auInit();kbd=false;for(const t of e.changedTouches){const p=toLogical(t.clientX,t.clientY);
  if(ST.dlg){dlgNext();TOUCH[t.identifier]={...p,ui:1};continue;}
  const ui=hitUI(p);TOUCH[t.identifier]={...p,sx:p.x,sy:p.y,ui:ui?1:0};if(!ui)mapDragStart(p);}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const o=TOUCH[t.identifier];if(!o)continue;const p=toLogical(t.clientX,t.clientY);o.x=p.x;o.y=p.y;mapDragMove(p);}},{passive:false});
const tEnd=e=>{e.preventDefault();for(const t of e.changedTouches){if(MAP.drag)mapDragEnd(toLogical(t.clientX,t.clientY));delete TOUCH[t.identifier];}};
cv.addEventListener('touchend',tEnd,{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
cv.addEventListener('mousemove',e=>{const p=toLogical(e.clientX,e.clientY);PT.x=p.x;PT.y=p.y;PT.over=true;mapDragMove(p);});
addEventListener('mouseup',e=>{if(MAP.drag)mapDragEnd(toLogical(e.clientX,e.clientY));});
cv.addEventListener('mousedown',e=>{auInit();const p=toLogical(e.clientX,e.clientY);if(ST.dlg){dlgNext();return;}if(!hitUI(p))mapDragStart(p);});
function readInput(){const t=touchKeys();
  IN.l=K.ArrowLeft||K.KeyA||t.l?1:0;IN.r=K.ArrowRight||K.KeyD||t.r?1:0;IN.u=K.ArrowUp||K.KeyW||t.u?1:0;IN.d=K.ArrowDown||K.KeyS||t.d?1:0;
  IN.j=K.Space||K.KeyZ||t.j?1:0;IN.a=K.KeyJ||K.KeyX||t.a?1:0;IN.b=K.KeyK||K.KeyC||K.ShiftLeft||t.b?1:0;IN.v=K.KeyL||K.KeyV||t.v?1:0;
  IN.jP=IN.j&&!prevIN.j;IN.aP=IN.a&&!prevIN.a;IN.uP=IN.u&&!prevIN.u;IN.dP=IN.d&&!prevIN.d;IN.lP=IN.l&&!prevIN.l;IN.rP=IN.r&&!prevIN.r;
  prevIN={...IN};}

/* ================= СОСТОЯНИЕ ================= */
const CFG=store.get('strazha_cfg',{big:0});
const SAVE=store.get('strazha_prog',{m:{},parts:{},rub:0});
function saveProg(){store.set('strazha_prog',SAVE);}
const ST={scene:'title',modal:null,dlg:null,t:0,hint:null,hintT:0,obj:'',menu:'main'};
let L=null,P=null,G=null;

/* ================= ТАЙЛЫ =================
  ' ' воздух  G земля  W стена (по бокам можно лезть)  X ящик  R крыша (сверху)  = балкон  - балка

const SOLID={G:1,W:1,X:1},ONEWAY={R:1,'=':1,'-':1};
function tile(tx,ty){if(tx<0||tx>=L.w)return 'W';if(ty<0)return ' ';if(ty>=L.h)return 'G';return L.map[ty][tx];}
const isSolid=(tx,ty)=>!!SOLID[tile(tx,ty)],isOne=(tx,ty)=>!!ONEWAY[tile(tx,ty)];
const isTop=(tx,ty)=>isSolid(tx,ty)||isOne(tx,ty),isAir=(tx,ty)=>!isSolid(tx,ty)&&!isOne(tx,ty);
const isPipe=(tx,ty)=>tile(tx,ty)==='|';

const EHP={cop:3,soldier:3,officer:5,line:99};
function mkEnemy(o){return {...o,hp:EHP[o.k],st:'patrol',meter:0,t:0,cd:0,stun:0,aim:0,wind:0,lost:0,dead:0,dt:0,face:o.face||1,anim:0,x1:o.x1==null?o.x:o.x1,x2:o.x2==null?o.x:o.x2,heavyN:0,pose:null,wait:0};}
function mkCrowd(c){const ms=[];for(let i=0;i<c.n;i++)ms.push({dx:(i-(c.n-1)/2)*7+rnd(-2,2),ph:rnd(0,TAU),look:i%3,woman:i%2===1});return {...c,ms,gone:0};}
function startMission(n){const M=MISSIONS[n-1];if(!M.build)return;L=M.build();L.mi=n;
  G={t:0,kills:0,silent:0,alarms:0,retries:0,rub:0,part:0,cp:0,flags:{},trigDone:{},shake:0,fx:[],snow:[],vision:0,done:0,deadT:0,camX:0,camY:0,slow:0,zoomK:1,tok:null,knives:[],sync:0,tgt:null};
  L.enemies=L.ent.map(mkEnemy);L.crowds=L.crowds.map(mkCrowd);cityPrep();L.softs=L.hides.map(h=>({x:h.x,y:h.y,w:h.w}));
  for(let y=0;y<L.h;y++){let x=0;while(x<L.w){if(L.map[y][x]==='s'){let x2=x;while(x2+1<L.w&&L.map[y][x2+1]==='s')x2++;L.softs.push({x:(x+x2+1)*TS/2,y:(y+1)*TS,w:(x2-x+1)*TS});x=x2+1;}else x++;}}
  P=newPlayer(L.startX,L.startY);snapCP();
  for(let i=0;i<90;i++)G.snow.push({x:Math.random()*W,y:Math.random()*H,s:rnd(0.3,1.2),d:rnd(0,TAU)});

  cutscene(M.brief,()=>{});}

/* ================= ФИЗИКА ================= */
const PW=10;function PH(){return P.crouch||P.roll>0?14:22;}
function boxHit(x,y,w,h,fn){const x0=Math.floor((x-w/2)/TS),x1=Math.floor((x+w/2-0.01)/TS),y0=Math.floor((y-h)/TS),y1=Math.floor((y-0.01)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(fn(tx,ty))return {tx,ty};return null;}
function moveX(o,dx,w,h){o.x+=dx;const hit=boxHit(o.x,o.y,w,h,isSolid);if(hit){if(dx>0)o.x=hit.tx*TS-w/2-0.01;else if(dx<0)o.x=(hit.tx+1)*TS+w/2+0.01;return true;}return false;}
function moveY(o,dy,w,h,drop){const prevFeet=o.y;o.y+=dy;let landed=false;
  if(dy>0){const x0=Math.floor((o.x-w/2)/TS),x1=Math.floor((o.x+w/2-0.01)/TS),ty=Math.floor((o.y-0.01)/TS);
    for(let tx=x0;tx<=x1;tx++){if(isSolid(tx,ty)||(isOne(tx,ty)&&!drop&&prevFeet<=ty*TS+0.01)){o.y=ty*TS;landed=true;break;}}}
  else if(dy<0){const hit=boxHit(o.x,o.y,w,h,isSolid);if(hit){o.y=(hit.ty+1)*TS+h+0.01;o.vy=0;}}
  return landed;}
function onGround(o,w){const x0=Math.floor((o.x-w/2)/TS),x1=Math.floor((o.x+w/2-0.01)/TS),ty=Math.floor((o.y+0.5)/TS);
  if(Math.abs(o.y-ty*TS)>0.6)return false;for(let tx=x0;tx<=x1;tx++)if(isTop(tx,ty))return true;return false;}
function hideAt(x,y){const tx=Math.floor(x/TS),ty=Math.floor((y-4)/TS);if(tile(tx,ty)==='s')return 'snow';
  for(const h of L.hides)if(Math.abs(x-h.x)<h.w/2&&Math.abs(y-h.y)<4)return 'hay';return '';}
function crowdAt(x,y){for(const c of L.crowds)if(!c.gone&&!c.flee&&Math.abs(x-c.x)<c.n*3.5+6&&Math.abs(y-c.y)<4)return c;return null;}
function softBelow(x,y){let best=null,bd=1e9;for(const s of L.softs){if(s.y<y)continue;const d=Math.abs(s.x-x);if(d<s.w/2+44&&d<bd){// нет ли крыши между
    let ok=true;const tx=Math.floor(s.x/TS);for(let ty=Math.floor(y/TS)+1;ty<Math.floor((s.y-1)/TS);ty++)if(isTop(tx,ty)){ok=false;break;}if(ok){bd=d;best=s;}}}return best;}

    const see=canSee(e);const dx=P.x-e.x,adx=Math.abs(dx),ady=Math.abs(P.y-e.y);
    if(e.st==='alert'){alert++;
      if(see){e.lost=0;}else if(++e.lost>240){e.st='search';e.t=150;e.meter=0.5;if(G.tok===e)G.tok=null;continue;}
      if(e.stun>0){continue;}
      if(e.wind>0){e.wind--;if(e.wind===0)enemyStrike(e,e.heavy);continue;}
      if(adx>4)e.face=sgn(dx);
      const ranged=e.k==='soldier'||e.k==='line';
      if(ranged&&(adx>40||e.k==='line')){if(see){e.aim++;const need=e.k==='line'?44:60;if(e.aim>=need){e.aim=0;e.cd=e.k==='line'?40:80;shoot(e);}}else e.aim=Math.max(0,e.aim-2);
        if(e.k==='soldier'&&adx<70&&ady<20){const nx=clamp(e.x-sgn(dx)*0.5,e.x1,e.x2);e.x=nx;}continue;}
      e.aim=0;
      if(ady>22){continue;}
      const want=G.tok===null||G.tok===e?18:34;
      if(adx>want+2){e.x=clamp(e.x+sgn(dx)*(adx>60?1.2:0.8),e.x1,e.x2);}
      else if(adx<want-8&&G.tok!==e){e.x=clamp(e.x-sgn(dx)*0.5,e.x1,e.x2);}
      if(adx<=26&&e.cd===0&&(G.tok===null||G.tok.dead)&&P.st!=='dead'){G.tok=e;e.heavy=e.k==='officer'&&(++e.heavyN%2===0);e.wind=e.heavy?40:26;}}
    else{
      if(see){const r=RANGE[e.k];const k=e.k==='line'?0.06:(1.4-adx/r)*(P.crouch?0.016:0.03)*(Math.abs(P.vx)>1.3?1.6:1)*(P.st==='climb'?1.4:1);e.meter=Math.min(1,e.meter+k);if(e.meter>=1)alertE(e);}
      else e.meter=Math.max(0,e.meter-0.004);
      if(e.meter>0.3)susp++;
      if(e.k==='line'){e.face=-1;continue;}
      if(e.st==='search'){if(--e.t<=0)e.st='patrol';if(e.anim%70===0)e.face*=-1;continue;}
      if(e.guard){continue;}
      if(e.wait>0){e.wait--;continue;}
      e.x+=e.face*0.42;if(e.x>=e.x2){e.x=e.x2;e.face=-1;e.wait=80;}else if(e.x<=e.x1){e.x=e.x1;e.face=1;e.wait=80;}}}
  if(G.tok&&(G.tok.dead||G.tok.st!=='alert'))G.tok=null;
  G.alert=alert;G.susp=susp;
  setMusic(G.tgt&&G.tgt.run?'chase':alert?'tense':'calm');}

    if(mode==='zip')sp=2.5;t.seg=(t.seg||0)+sp/len;

/* ================= СКЕЛЕТНАЯ АНИМАЦИЯ =================

  aF/aB — рука передняя/задняя [плечо, локоть], lF/lB — нога [бедро, колено]. */
const POSE0={hip:-11.5,tor:0.05,head:0,aF:[0.15,0.35],aB:[-0.1,0.3],lF:[0.08,-0.1],lB:[-0.08,-0.1],rot:0,wpn:0};
function poseFor(o){const p={...POSE0,aF:[...POSE0.aF],aB:[...POSE0.aB],lF:[...POSE0.lF],lB:[...POSE0.lB]};const t=o.t||0;
  switch(o.k){
    case'idle':p.aF=[0.12+Math.sin(t*0.05)*0.03,0.4];p.aB=[-0.08,0.35];p.hip=-11.5+Math.sin(t*0.05)*0.2;break;
    case'walk':{const s=Math.sin(t);p.lF=[0.45*s,-0.15-0.35*Math.max(0,-Math.cos(t))];p.lB=[-0.45*s,-0.15-0.35*Math.max(0,Math.cos(t))];p.aF=[-0.35*s,0.4];p.aB=[0.35*s,0.4];p.tor=0.08;break;}
    case'run':{const s=Math.sin(t),c=Math.cos(t);p.lF=[0.95*s,-0.25-1.1*Math.max(0,-c)];p.lB=[-0.95*s,-0.25-1.1*Math.max(0,c)];p.aF=[-0.8*s,1.1];p.aB=[0.8*s,1.1];p.tor=0.32;p.hip=-11.2+Math.abs(c)*-0.7;break;}
    case'jump':p.lF=[1.0,-1.4];p.lB=[0.2,-1.0];p.aF=[2.2,0.4];p.aB=[-0.6,0.8];p.tor=0.15;p.hip=-12;break;
    case'fall':p.lF=[0.5,-0.6];p.lB=[-0.3,-0.4];p.aF=[2.5,0.3];p.aB=[2.2,0.4];p.tor=0.0;break;
    case'dive':p.rot=1.2;p.lF=[0.1,-0.1];p.lB=[-0.15,-0.1];p.aF=[2.0,0];p.aB=[1.2,0];p.tor=0;break;
    case'climb':{const s=Math.sin(t);p.aF=[2.9+0.25*s,-0.3];p.aB=[2.9-0.25*s,-0.3];p.lF=[0.9+0.4*s,-1.6];p.lB=[0.9-0.4*s,-1.6];p.tor=0.1;p.hip=-12;break;}
    case'wall':{const s=Math.sin(t);p.aF=[2.7+0.3*s,0.2];p.aB=[2.7-0.3*s,0.2];p.lF=[1.2+0.4*s,-1.7];p.lB=[1.2-0.4*s,-1.7];p.tor=0.25;break;}
    case'hang':p.aF=[3.0,0];p.aB=[3.0,0];p.lF=[0.15,-0.2];p.lB=[-0.1,-0.3];p.tor=0;break;
    case'pull':{const k=o.k2;p.aF=[3.0-k*2.0,k*1.2];p.aB=[3.0-k*2.0,k*1.0];p.lF=[0.3+k*1.2,-0.4-k*1.4];p.lB=[0.2+k*0.8,-0.3-k];p.tor=k*0.6;break;}
    case'crouch':p.hip=-7;p.lF=[1.4,-2.0];p.lB=[0.9,-1.9];p.tor=0.5;p.aF=[0.8,0.6];p.aB=[0.4,0.8];break;

    case'atk1':{const k=o.k2;p.aF=[lerp(-0.6,1.7,k),lerp(1.2,0.1,k)];p.aB=[0.4,0.6];p.tor=lerp(-0.1,0.35,k);p.lF=[0.5,-0.3];p.lB=[-0.4,-0.2];p.wpn=1;break;}
    case'atk2':{const k=o.k2;p.aF=[lerp(2.6,0.9,k),lerp(-0.2,0.4,k)];p.aB=[-0.4,0.8];p.tor=lerp(-0.15,0.3,k);p.lF=[0.4,-0.4];p.lB=[-0.5,-0.2];p.wpn=1;break;}

    case'kill':{const k=o.k2;p.aB=[1.5,0.2];p.aF=[lerp(0.6,1.5,k),lerp(1.4,0.1,k)];p.tor=0.5;p.lF=[0.8,-0.6];p.lB=[-0.6,-0.3];p.hip=-10;p.wpn=1;break;}
    case'throw':{const k=o.k2;p.aF=[lerp(-1.8,1.6,k),0.2];p.aB=[0.6,0.5];p.tor=lerp(-0.2,0.3,k);p.lF=[0.5,-0.3];p.lB=[-0.4,-0.2];break;}
    case'roll':p.rot=o.k2*TAU;p.hip=-7;p.lF=[1.6,-2.2];p.lB=[1.4,-2.2];p.aF=[1.2,1.2];p.aB=[1.0,1.2];p.tor=0.8;break;

    case'zip':p.aF=[2.9,0.3];p.aB=[2.7,0.3];p.lF=[0.9,-0.3];p.lB=[0.7,-0.4];p.tor=-0.1;break;

    case'strike':p.aF=[1.4,0];p.aB=[-0.3,0.4];p.tor=0.45;p.lF=[0.7,-0.4];p.lB=[-0.6,-0.1];p.wpn=1;break;

  return p;}
function blendPose(a,b,k){if(!a)return b;const r={};for(const key in b){const v=b[key];if(Array.isArray(v))r[key]=[lerp(a[key][0],v[0],k),lerp(a[key][1],v[1],k)];else if(key==='rot'){let d=v-a.rot;r.rot=Math.abs(d)>2?v:a.rot+d*k;}else r[key]=typeof v==='number'?lerp(a[key],v,k):v;}return r;}
/* рисование фигуры по позе. look: цвета и одежда */

function spr(name,x,y,face,o){const f=SPR.m[name];if(!SPR.ok||!f)return false;const [sx,sy,w,h,ax,ay]=f;o=o||{};
  ctx.save();ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);ctx.scale(face*(o.sx||1),o.sy||1);
  ctx.drawImage(SPR.img,sx,sy,w,h,-ax*0.5,-(ay+1)*0.5,w*0.5,h*0.5);
  if(o.flash){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,ctx.globalAlpha*o.flash);ctx.drawImage(SPR.img,sx,sy,w,h,-ax*0.5,-(ay+1)*0.5,w*0.5,h*0.5);ctx.drawImage(SPR.img,sx,sy,w,h,-ax*0.5,-(ay+1)*0.5,w*0.5,h*0.5);ctx.globalCompositeOperation='source-over';}

function ilyaFrame(){const p=P,sp=Math.abs(p.vx),gr=onGround(p,PW);
  if(p.st==='dead')return 'ilya_dead';if(p.st==='sync')return 'ilya_sync';if(p.st==='tackle')return 'ilya_crouch';
  if(p.st==='hang')return 'ilya_hang';if(p.st==='pull')return p.pull>7?'ilya_pull0':'ilya_pull1';
  if(p.st==='climb')return p.cm&&p.cm.k==='wall'?(Math.floor(p.climb/12)%2?'ilya_wall':'ilya_climb'+(Math.floor(p.climb/12)%4)):'ilya_climb'+(Math.floor(p.climb/10)%4);
  if(p.st==='swing')return p.sw&&p.sw.a*p.face>0.3?'ilya_swing1':'ilya_swing0';if(p.st==='zip')return 'ilya_zip';
  if(p.roll>0)return p.roll>10?'ilya_roll0':'ilya_roll1';if(p.hurt>0)return 'ilya_hurt';
  if(p.atk>0){const n=p.atkN;const tot=n===3?20:n===4?20:n===5?14:15;const k=clamp(1-(p.atk-4)/(tot-6),0,1);
    if(n===1)return k<0.35?'ilya_wind1':'ilya_atk1';if(n===2)return k<0.35?'ilya_wind2':'ilya_atk2';if(n===3)return k<0.3?'ilya_wind1':'ilya_atk3';if(n===4)return 'ilya_kill';return 'ilya_throw';}
  if(p.blk)return 'ilya_block';
  if(!gr)return p.dive?'ilya_dive':p.vy<0?'ilya_jump':'ilya_fall';
  if(p.land>0)return 'ilya_land';if(p.crouch)return 'ilya_crouch';
  p.runPh=(p.runPh||0)+sp*0.075;
  if(sp>1.2)return 'ilya_run'+(Math.floor(p.runPh)%8);
  if(sp>0.15)return 'ilya_walk'+(Math.floor(p.runPh*1.4)%2);
  return 'ilya_idle';}
function enemyFrame(e){const w=e.k==='line'?'soldier':e.k;
  if(e.dead)return w+'_dead';if(e.wind>0)return e.wind<6?w+'_strike':w+'_wind';
  if((e.k==='soldier'||e.k==='line')&&e.st==='alert'&&e.aim>0)return 'soldier_aim';
  if(e.st==='patrol'&&!e.wait&&!e.guard&&e.k!=='line')return w+'_walk'+(Math.floor(e.anim/10)%4);

  return w+'_idle';}

function update(){ST.t++;readInput();if(ST.scene!=='game'&&AU.ctx){if(AU.mus!=='calm')setMusic('calm');else if(TB.theme){if(!TCUR||TCUR.k!=='theme')playTrack('theme');}else loadTrack('theme');}musicTick();if(ST.scene==='act'&&ST.act)ST.act.t++;

  G.vision+=((IN.v&&P.st!=='dead'?1:0)-G.vision)*0.15;
