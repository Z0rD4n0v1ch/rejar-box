<script>
(()=>{
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=240,H=400,SC=1,OX=0,OY=0,DPR=1,portrait=true;
const TS=16,TAU=Math.PI*2,R=Math.round;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),sgn=v=>v<0?-1:v>0?1:0;
const hash=(x,y)=>{let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)};
const FT="'PT Mono','Courier New',monospace",FD="'Russo One','Arial Black',Impact,sans-serif";
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LANG='ru';const EN={};function tl(s){return LANG==='en'&&EN[s]||s;}

/* ================= ЭКРАН ================= */
function layout(){DPR=Math.min(window.devicePixelRatio||1,3);
  const vw=cv.clientWidth||innerWidth,vh=cv.clientHeight||innerHeight;cv.width=R(vw*DPR);cv.height=R(vh*DPR);
  portrait=vh>=vw;SC=Math.min(vw/240,vh/(portrait?420:260));
  W=Math.floor(Math.min(portrait?320:480,vw/SC));H=Math.floor(Math.min(620,vh/SC));
  OX=R((vw-W*SC)/2);OY=R((vh-H*SC)/2);}
addEventListener('resize',layout);

/* ================= ТЕКСТ И КНОПКИ ================= */
function txt(s,x,y,size,col,align,font){s=tl(s);ctx.font=size+'px '+(font||FT);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function txtS(s,x,y,size,col,align,font){s=tl(s);ctx.font=size+'px '+(font||FT);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function wrap(s,maxW,size,font){s=tl(s);ctx.font=size+'px '+(font||FT);const out=[];
  for(const para of s.split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}out.push(line);}return out;}
function panel(x,y,w,h,fill,edge){ctx.fillStyle=fill||'rgba(14,16,22,.93)';ctx.fillRect(x,y,w,h);ctx.strokeStyle=edge||'#b8904a';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);}
let UI=[];
function button(label,x,y,w,h,fn,o){o=o||{};const hov=PT.over&&PT.x>=x&&PT.x<=x+w&&PT.y>=y&&PT.y<=y+h;
  ctx.fillStyle=o.hot?(hov?'#d8a04a':'#b8803a'):(hov?'#3a3226':'#231f19');ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=o.hot?'#ffe0a0':'#8a6a3a';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  txt(label,x+w/2,y+h/2+(o.size||8)*0.36,o.size||8,o.dis?'#776':o.hot?'#1a1208':'#f0e0c0','center',FD);
  if(!o.dis)UI.push({x,y,w,h,fn});}

/* ================= ЗВУК ================= */
const AU={ctx:null,on:store.get('strazha_snd',true),mus:null,nextT:0,step:0,master:null};
function auInit(){if(AU.ctx)return;try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.on?0.5:0;AU.master.connect(AU.ctx.destination);}catch(e){}}
function setSound(v){AU.on=v;store.set('strazha_snd',v);if(AU.master)AU.master.gain.value=v?0.5:0;}
function tone(f,d,type,vol,slide,t0){if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=t0||c.currentTime;const o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+d+0.02);}
function noise(d,vol,hp,t0){if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=t0||c.currentTime,n=Math.floor(c.sampleRate*d);const b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;
  const g=c.createGain();g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);}
function sfx(k){switch(k){
  case'jump':tone(320,0.09,'square',0.06,520);break;case'land':noise(0.06,0.08,300);break;
  case'hit':noise(0.08,0.2,1200);tone(180,0.08,'sawtooth',0.08,90);break;
  case'clang':tone(1200,0.12,'triangle',0.12,900);tone(1800,0.08,'square',0.04);break;
  case'kill':noise(0.12,0.22,600);tone(220,0.2,'sawtooth',0.08,60);break;
  case'shot':noise(0.25,0.35,200);tone(90,0.2,'square',0.1,40);break;
  case'hurt':tone(200,0.18,'sawtooth',0.12,80);break;
  case'pick':tone(880,0.07,'square',0.06);tone(1320,0.1,'square',0.05,null,AU.ctx&&AU.ctx.currentTime+0.06);break;
  case'alert':tone(660,0.07,'square',0.07);tone(990,0.12,'square',0.07,null,AU.ctx&&AU.ctx.currentTime+0.08);break;
  case'whistle':tone(2400,0.35,'sine',0.06,2600);break;
  case'grab':tone(260,0.05,'triangle',0.08);break;
  case'ok':tone(523,0.1,'square',0.06);tone(784,0.16,'square',0.06,null,AU.ctx&&AU.ctx.currentTime+0.1);break;}}
/* музыка: своя мелодия в миноре, бас + тема в духе старинного вальса-романса */
const MUS={
  calm:{bpm:84,bass:[45,45,52,52,43,43,50,50,41,41,48,48,40,40,47,47],mel:[69,0,72,71,69,0,64,0,67,0,65,64,62,0,64,0,65,0,69,67,65,0,62,0,64,0,0,0,0,0,0,0]},
  tense:{bpm:120,bass:[45,57,45,57,46,58,46,58,45,57,45,57,40,52,44,56],mel:[76,0,76,74,72,0,71,0,72,0,74,0,69,0,0,0,76,0,79,77,76,0,74,0,72,71,69,0,68,0,69,0]}};
function midi(n){return 440*Math.pow(2,(n-69)/12);}
function musicTick(){if(!AU.ctx||!AU.on||!AU.mus)return;const c=AU.ctx,m=MUS[AU.mus];const sp=60/m.bpm/2;
  if(AU.nextT<c.currentTime)AU.nextT=c.currentTime+0.05;
  while(AU.nextT<c.currentTime+0.2){const i=AU.step%32;
    if(i%2===0){const b=m.bass[(i>>1)%16];tone(midi(b),sp*1.8,'triangle',0.09,null,AU.nextT);}
    const n=m.mel[i];if(n)tone(midi(n),sp*1.6,'square',0.035,null,AU.nextT);
    if(AU.mus==='tense'&&i%4===2)noise(0.04,0.05,3000,AU.nextT);
    AU.nextT+=sp;AU.step++;}}
function setMusic(k){if(AU.mus!==k){AU.mus=k;AU.step=0;}}

/* ================= ВВОД ================= */
const K={},PT={x:0,y:0,over:false};const TOUCH={};let kbd=false;
const IN={l:0,r:0,u:0,d:0,j:0,a:0,b:0,v:0,jP:0,aP:0,uP:0,dP:0};let prevIN={};
addEventListener('keydown',e=>{if(e.repeat)return;K[e.code]=1;kbd=true;auInit();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Escape'||e.code==='KeyP')togglePause();
  if((e.code==='Enter'||e.code==='Space')&&ST.dlg){dlgNext();e.preventDefault();}});
addEventListener('keyup',e=>{K[e.code]=0;});
function toLogical(cx,cy){const r=cv.getBoundingClientRect();return {x:(cx-r.left-OX)/SC,y:(cy-r.top-OY)/SC};}
/* экранные кнопки: крестовина слева, действия справа */
function padLayout(){const s=CFG.big?1.2:1;const by=H-12;
  return {dpad:{x:46*s,y:by-40*s,r:34*s},
    btn:[{k:'j',x:W-30*s,y:by-52*s,r:17*s,l:'ПРЫЖОК'},{k:'a',x:W-68*s,y:by-28*s,r:17*s,l:'УДАР'},
      {k:'b',x:W-30*s,y:by-14*s,r:13*s,l:'БЛОК'},{k:'v',x:W-74*s,y:by-66*s,r:12*s,l:'ЧУТЬЁ'}]};}
function touchKeys(){const o={l:0,r:0,u:0,d:0,j:0,a:0,b:0,v:0};if(ST.scene!=='game'||ST.modal)return o;const L=padLayout();
  for(const id in TOUCH){const t=TOUCH[id];if(t.ui)continue;
    const dx=t.x-L.dpad.x,dy=t.y-L.dpad.y;
    if(t.pad||(Math.hypot(dx,dy)<L.dpad.r*1.5&&t.x<W/2)){t.pad=1;const a=Math.atan2(dy,dx),dd=Math.hypot(dx,dy);if(dd<6)continue;
      const c=Math.cos(a),s=Math.sin(a);if(c>0.38)o.r=1;if(c<-0.38)o.l=1;if(s<-0.45)o.u=1;if(s>0.45)o.d=1;continue;}
    let best=null,bd=1e9;for(const b of L.btn){const d=Math.hypot(t.x-b.x,t.y-b.y);if(d<b.r*1.35&&d<bd){bd=d;best=b;}}
    if(best)o[best.k]=1;}
  return o;}
function hitUI(p){for(let i=UI.length-1;i>=0;i--){const u=UI[i];if(p.x>=u.x&&p.x<=u.x+u.w&&p.y>=u.y&&p.y<=u.y+u.h){u.fn();return true;}}return false;}
cv.addEventListener('touchstart',e=>{e.preventDefault();auInit();kbd=false;for(const t of e.changedTouches){const p=toLogical(t.clientX,t.clientY);
  if(ST.dlg){dlgNext();TOUCH[t.identifier]={...p,ui:1};continue;}
  const ui=hitUI(p);TOUCH[t.identifier]={...p,ui:ui?1:0};}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const o=TOUCH[t.identifier];if(!o)continue;const p=toLogical(t.clientX,t.clientY);o.x=p.x;o.y=p.y;}},{passive:false});
const tEnd=e=>{e.preventDefault();for(const t of e.changedTouches)delete TOUCH[t.identifier];};
cv.addEventListener('touchend',tEnd,{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
cv.addEventListener('mousemove',e=>{const p=toLogical(e.clientX,e.clientY);PT.x=p.x;PT.y=p.y;PT.over=true;});
cv.addEventListener('mousedown',e=>{auInit();const p=toLogical(e.clientX,e.clientY);if(ST.dlg){dlgNext();return;}hitUI(p);});
function readInput(){const t=touchKeys();
  IN.l=K.ArrowLeft||K.KeyA||t.l?1:0;IN.r=K.ArrowRight||K.KeyD||t.r?1:0;IN.u=K.ArrowUp||K.KeyW||t.u?1:0;IN.d=K.ArrowDown||K.KeyS||t.d?1:0;
  IN.j=K.Space||K.KeyZ||t.j?1:0;IN.a=K.KeyJ||K.KeyX||t.a?1:0;IN.b=K.KeyK||K.KeyC||K.ShiftLeft||t.b?1:0;IN.v=K.KeyL||K.KeyV||t.v?1:0;
  IN.jP=IN.j&&!prevIN.j;IN.aP=IN.a&&!prevIN.a;IN.uP=IN.u&&!prevIN.u;IN.dP=IN.d&&!prevIN.d;
  prevIN={...IN};}

/* ================= СОСТОЯНИЕ ================= */
const CFG=store.get('strazha_cfg',{big:0});
const SAVE=store.get('strazha_prog',{m:{},parts:{},rub:0});
function saveProg(){store.set('strazha_prog',SAVE);}
const ST={scene:'title',modal:null,dlg:null,t:0,fade:0,hint:null,hintT:0,obj:'',menu:'main'};
let L=null,P=null,G=null;// уровень, игрок, игровое состояние

/* ================= ТАЙЛЫ =================
  ' ' воздух  G земля  W стена  X ящик/бочка  R крыша (сверху проходима)  = балкон
  | водосточная труба  s сугроб (мягкое падение, укрытие)                               */
const SOLID={G:1,W:1,X:1},ONEWAY={R:1,'=':1};
function tile(tx,ty){if(tx<0||tx>=L.w)return 'W';if(ty<0)return ' ';if(ty>=L.h)return 'G';return L.map[ty][tx];}
const isSolid=(tx,ty)=>!!SOLID[tile(tx,ty)],isOne=(tx,ty)=>!!ONEWAY[tile(tx,ty)];
const isTop=(tx,ty)=>isSolid(tx,ty)||isOne(tx,ty),isAir=(tx,ty)=>!isSolid(tx,ty)&&!isOne(tx,ty);
const isPipe=(tx,ty)=>tile(tx,ty)==='|';

/* ================= МИССИЯ 1: НАРВСКИЕ ВОРОТА ================= */
function buildM1(){const w=160,h=24;const m=[];for(let y=0;y<h;y++)m.push(Array(w).fill(' '));
  const bg=[];for(let y=0;y<h;y++)bg.push(Array(w).fill(0));
  const set=(x,y,c)=>{if(x>=0&&x<w&&y>=0&&y<h)m[y][x]=c;};
  const fill=(x0,y0,x1,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,c);};
  const house=(x0,x1,roof,style)=>{for(let y=roof;y<=20;y++)for(let x=x0;x<=x1;x++)bg[y][x]=style;fill(x0,roof,x1,roof,'R');};
  fill(0,21,w-1,23,'G');fill(0,0,0,20,'W');fill(w-1,0,w-1,20,'W');
  house(1,14,12,1);house(15,30,10,2);house(31,44,11,3);
  fill(15,10,15,11,'W');set(15,10,'R');            // край высокого дома над крышей A
  fill(2,13,2,20,'|');fill(28,11,28,20,'|');fill(44,12,44,20,'|');
  set(10,20,'X');set(11,20,'X');set(11,19,'X');set(18,20,'X');set(19,20,'X');
  house(48,60,9,4);fill(48,10,48,20,'W');fill(60,10,60,20,'W');
  // двор-колодец 61..79
  for(let y=6;y<=20;y++)for(let x=61;x<=79;x++)bg[y][x]=9;
  fill(61,20,65,20,'s');
  fill(72,20,72,20,'X');
  house(81,100,8,5);fill(81,9,81,20,'W');fill(80,9,80,20,'|');
  house(103,126,10,6);fill(103,11,103,20,'W');
  house(127,150,7,7);fill(127,7,127,9,'W');set(127,7,'R');
  fill(151,20,156,20,'s');
  for(let y=4;y<=20;y++)for(let x=155;x<=158;x++)bg[y][x]=8; // арка
  const ent=[];const E=(o)=>ent.push(o);
  const tx=x=>x*TS+8,ty=y=>y*TS;
  // враги: cop — городовой (сабля), rifle — солдат, line — строй у ворот (не пройти)
  E({k:'line',x:tx(39),y:ty(21),face:-1});E({k:'line',x:tx(41),y:ty(21),face:-1});E({k:'line',x:tx(43),y:ty(21),face:-1});
  E({k:'cop',x:tx(55),y:ty(9),face:1,x1:tx(52),x2:tx(58)});
  E({k:'cop',x:tx(68),y:ty(21),face:1,x1:tx(65),x2:tx(77)});
  E({k:'cop',x:tx(77),y:ty(21),face:-1,x1:tx(74),x2:tx(79),guard:1});
  E({k:'rifle',x:tx(97),y:ty(8),face:-1,x1:tx(90),x2:tx(99)});
  E({k:'cop',x:tx(110),y:ty(10),face:1,x1:tx(105),x2:tx(116)});
  E({k:'rifle',x:tx(123),y:ty(10),face:-1,x1:tx(119),x2:tx(125)});
  const items=[];const I=(o)=>items.push(o);
  I({k:'part',x:tx(4),y:ty(12)});I({k:'tea',x:tx(78),y:ty(21)});I({k:'tea',x:tx(120),y:ty(10)});
  for(const [x,y] of [[20,10],[24,10],[35,11],[39,11],[53,9],[57,9],[66,21],[70,21],[86,8],[92,8],[108,10],[114,10],[132,7],[140,7],[8,12],[6,21]])I({k:'rub',x:tx(x),y:ty(y)});
  const props=[{k:'father',x:tx(5),y:ty(21)},{k:'hay',x:tx(70)+8,y:ty(21)},{k:'wood',x:tx(75),y:ty(21)},{k:'lamp',x:tx(23),y:ty(21)},{k:'lamp',x:tx(36),y:ty(21)},
    {k:'chim',x:tx(55),y:ty(9)},{k:'chim',x:tx(90),y:ty(8)},{k:'chim',x:tx(112),y:ty(10)},{k:'chim',x:tx(138),y:ty(7)},{k:'arch',x:tx(156),y:ty(21)}];
  const cps=[{x:tx(3),y:ty(21)},{x:tx(29),y:ty(10)},{x:tx(57),y:ty(9)},{x:tx(83),y:ty(8)},{x:tx(105),y:ty(10)},{x:tx(129),y:ty(7)}];
  const hides=[{x:tx(70)+8,y:ty(21),w:30}];
  const touch=!kbd&&('ontouchstart' in window);
  const trig=[
    {x:tx(1),fn:()=>dialog([['father','Илюша… беги… Не ко мне — к нему. Тот, на крыше… Он махнул им рукой.'],['father','У него перстень… часы… без стрелок…'],['ilya','Отец!..'],['father','Беги, сынок…'],['ilya','Я найду его. Слышишь? Найду.']],()=>{setObj('Доберись до крыши, где стоял человек в штатском.');hint(touch?'Бег — крестовина слева. Прыжок — кнопка ПРЫЖОК.':'Бег — стрелки или A/D. Прыжок — пробел.');})},
    {x:tx(8),fn:()=>hint('Перепрыгни бочки.')},
    {x:tx(22),fn:()=>hint(touch?'Впереди солдаты. Уходи наверх: встань у водосточной трубы и жми ▲.':'Впереди солдаты. Уходи наверх: встань у водосточной трубы и жми ↑.')},
    {x:tx(31),y:ty(12),fn:()=>hint('Беги по крышам. Высота опасна: с большой высоты можно разбиться.')},
    {x:tx(42),y:ty(12),fn:()=>hint('Прыгай к высокой крыше — Илья сам схватится за край. Затем жми ▲, чтобы залезть.')},
    {x:tx(49),y:ty(10),fn:()=>hint('Городовой не видит, что у него за спиной. Подкрадись и ударь — тихий удар.')},
    {x:tx(58),y:ty(10),fn:()=>hint('Прыжок веры: прыгни с края в сугроб — он смягчит падение.')},
    {x:tx(64),y:ty(22),fn:()=>hint('Спрячься в возе с сеном (встань в него и замри) и пропусти патруль.')},
    {x:tx(73),y:ty(22),fn:()=>hint('Этот городовой ждёт тебя. Держи БЛОК, а когда он ударит — сразу УДАР: контрудар.')},
    {x:tx(84),y:ty(9),fn:()=>hint(touch?'Солдат с винтовкой долго целится. Присядь (▼) — пуля пройдёт над головой.':'Солдат с винтовкой долго целится. Присядь (↓) — пуля пройдёт над головой.')},
    {x:tx(88),y:ty(9),fn:()=>hint(touch?'Удерживай ЧУТЬЁ — увидишь врагов, их взгляд и тайники.':'Удерживай L — Чутьё: видно врагов, их взгляд и тайники.')},

function mkEnemy(o){const hp=o.k==='line'?99:o.k==='rifle'?2:3;
  return {...o,hp,st:'patrol',meter:0,t:0,cd:0,stun:0,aim:0,wind:0,lost:0,dead:0,dt:0,face:o.face||1,anim:0,x1:o.x1==null?o.x:o.x1,x2:o.x2==null?o.x:o.x2,hx:o.x};}

  G={t:0,kills:0,silent:0,alarms:0,retries:0,rub:0,part:0,cp:0,flags:{},trigDone:{},shake:0,fx:[],snow:[],vision:0,done:0,deadT:0,camX:0,camY:0};

function newPlayer(x,y){return {x,y,vx:0,vy:0,face:1,st:'stand',on:true,hp:5,maxhp:5,inv:0,crouch:0,atk:0,combo:0,blk:0,ctr:0,hang:null,pull:0,climb:0,fallY:y,noGrab:0,hurt:0,anim:0,hidden:0,dropT:0,kill:0,coyote:0,jbuf:0};}

function restoreCP(){const s=JSON.parse(G.snap);L.enemies=s.e;L.items=s.i;G.flags=s.f;G.trigDone=s.td;G.rub=s.rub;G.part=s.part;G.kills=s.kills;G.silent=s.silent;ST.obj=s.obj;

/* ================= ИГРОК ================= */
const PW=10;function PH(){return P.crouch?14:22;}
function boxHit(x,y,w,h,fn){const x0=Math.floor((x-w/2)/TS),x1=Math.floor((x+w/2-0.01)/TS),y0=Math.floor((y-h)/TS),y1=Math.floor((y-0.01)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(fn(tx,ty))return {tx,ty};return null;}
function moveX(o,dx,w,h){o.x+=dx;const hit=boxHit(o.x,o.y,w,h,isSolid);if(hit){if(dx>0)o.x=hit.tx*TS-w/2-0.01;else if(dx<0)o.x=(hit.tx+1)*TS+w/2+0.01;return true;}return false;}
function moveY(o,dy,w,h,drop){const prevFeet=o.y;o.y+=dy;let landed=false;
  if(dy>0){const x0=Math.floor((o.x-w/2)/TS),x1=Math.floor((o.x+w/2-0.01)/TS),ty=Math.floor((o.y-0.01)/TS);
    for(let tx=x0;tx<=x1;tx++){if(isSolid(tx,ty)||(isOne(tx,ty)&&!drop&&prevFeet<=ty*TS+0.01)){o.y=ty*TS;landed=true;break;}}}
  else if(dy<0){const hit=boxHit(o.x,o.y,w,h,isSolid);if(hit){o.y=(hit.ty+1)*TS+h+0.01;o.vy=0;}}
  return landed;}
function onGround(o,w){const x0=Math.floor((o.x-w/2)/TS),x1=Math.floor((o.x+w/2-0.01)/TS),ty=Math.floor((o.y+0.5)/TS);
  if(Math.abs(o.y-ty*TS)>0.6)return false;for(let tx=x0;tx<=x1;tx++)if(isTop(tx,ty))return true;return false;}
function inHide(){const tx=Math.floor(P.x/TS),ty=Math.floor((P.y-4)/TS);if(tile(tx,ty)==='s')return true;
  for(const h of L.hides)if(Math.abs(P.x-h.x)<h.w/2&&Math.abs(P.y-h.y)<4)return true;return false;}
function damage(n,fromX){if(P.inv>0||P.st==='dead')return;P.hp-=n;P.inv=70;P.hurt=18;sfx('hurt');G.shake=8;
  P.vx=sgn(P.x-(fromX==null?P.x-P.face:fromX))*2.2;if(P.st==='hang'||P.st==='climb'){P.st='air';P.hang=null;}
  if(P.hp<=0)die();}
function die(){if(P.st==='dead')return;P.st='dead';P.hp=0;G.deadT=1;sfx('kill');G.shake=10;}
function tryGrab(){if(P.noGrab>0||P.vy<-2.2)return false;const dir=IN.r?1:IN.l?-1:P.face;
  const fx=Math.floor((P.x+dir*(PW/2+5))/TS);const handY=P.y-20;
  for(let ty=Math.floor((handY-14)/TS);ty<=Math.floor((handY+8)/TS);ty++){
    const d=handY-ty*TS;
    if(isTop(fx,ty)&&isAir(fx,ty-1)&&isAir(fx,ty-2)&&d>-8&&d<14){
      const px=Math.floor(P.x/TS);if(isTop(px,ty)&&!isPipe(px,ty))continue;
      P.st='hang';P.face=dir;P.hang={tx:fx,ty};P.x=dir>0?fx*TS-PW/2-0.5:(fx+1)*TS+PW/2+0.5;P.y=ty*TS+20;P.vx=0;P.vy=0;sfx('grab');return true;}}
  return false;}
function landCheck(){const fell=(P.y-P.fallY)/TS;const tx=Math.floor(P.x/TS),ty=Math.floor((P.y-4)/TS);
  const soft=tile(tx,ty)==='s'||L.hides.some(h=>Math.abs(P.x-h.x)<h.w/2&&Math.abs(P.y-h.y)<4);
  if(soft){if(fell>3){fx('snow',P.x,P.y);sfx('land');}return;}
  if(fell>11)die();else if(fell>6.5){damage(Math.ceil((fell-6.5)/1.6),P.x);}else if(fell>2)sfx('land');}
function updPlayer(){const p=P;p.anim++;if(p.inv>0)p.inv--;if(p.hurt>0)p.hurt--;if(p.noGrab>0)p.noGrab--;if(p.ctr>0)p.ctr--;if(p.kill>0)p.kill--;
  if(p.st==='dead'){p.vy=Math.min(p.vy+0.35,7);moveY(p,p.vy,PW,8);return;}
  const dir=(IN.r?1:0)-(IN.l?1:0);
  if(IN.jP)p.jbuf=8;else if(p.jbuf>0)p.jbuf--;
  // висит на краю
  if(p.st==='hang'){p.hangT=(dir===p.face||IN.u)?(p.hangT||0)+1:0;if(IN.uP||IN.jP||p.hangT>8){p.st='pull';p.pull=16;p.hangT=0;sfx('grab');}else if(IN.dP||(dir&&dir!==p.face)){p.st='air';p.hang=null;p.noGrab=14;p.fallY=p.y;}return;}
  if(p.st==='pull'){p.pull--;if(p.pull<=0){const h=p.hang;p.x=h.tx*TS+(p.face>0?5:11);p.y=h.ty*TS;p.st='stand';p.hang=null;p.fallY=p.y;}return;}
  // труба
  const ptx=Math.floor(p.x/TS),midTy=Math.floor((p.y-11)/TS);
  if(p.st==='climb'){p.vx=0;
    if(p.jbuf&&dir){p.st='air';p.vy=-4.2;p.vx=dir*1.9;p.face=dir;p.jbuf=0;p.noGrab=10;p.fallY=p.y;sfx('jump');return;}
    if(IN.u){const ny=p.y-1.1;const topMid=Math.floor((ny-11)/TS);
      if(isPipe(ptx,topMid))p.y=ny;else{// верх трубы
        let top=midTy;while(isPipe(ptx,top-1))top--;const above=top-1;
        if(isTop(ptx,above)&&isAir(ptx,above-1)){p.y=above*TS;p.st='stand';p.fallY=p.y;return;}
        for(const s of [p.face,-p.face]){for(const ly of [above,above+1]){if(isTop(ptx+s,ly)&&isAir(ptx+s,ly-1)&&isAir(ptx+s,ly-2)){p.face=s;p.hang={tx:ptx+s,ty:ly};p.st='pull';p.pull=14;return;}}}}
      p.climb++;}
    else if(IN.d){p.y+=1.6;p.climb++;if(onGround(p,PW)||isSolid(ptx,Math.floor(p.y/TS))){p.y=Math.floor(p.y/TS)*TS;p.st='stand';}
      if(!isPipe(ptx,Math.floor((p.y-11)/TS))){p.st='air';p.fallY=p.y;}}
    return;}
  if(isPipe(ptx,midTy)&&(IN.uP||(IN.dP&&!onGround(p,PW)))&&p.atk===0){p.st='climb';p.x=ptx*TS+8;p.vx=0;p.vy=0;p.crouch=0;return;}
  if(isPipe(ptx,midTy)&&IN.u&&p.st==='air'&&p.vy>-1){p.st='climb';p.x=ptx*TS+8;p.vx=0;p.vy=0;return;}
  const grounded=onGround(p,PW);
  if(grounded){p.coyote=6;}else if(p.coyote>0)p.coyote--;
  // атака
  if(IN.aP&&p.atk===0&&p.hurt===0){if(p.ctr>0&&p.ctrE&&!p.ctrE.dead){killEnemy(p.ctrE,'counter');p.ctr=0;p.atk=14;p.atkK=1;}
    else{p.atk=16;p.atkK=0;p.combo=(p.combo+1)%3;p.hitDone=0;if(!grounded)p.atk=14;}}
  if(p.atk>0){p.atk--;if(!p.hitDone&&p.atk<=11&&p.atk>=6){p.hitDone=attackHit();}}
  // блок
  p.blk=IN.b&&grounded&&p.atk===0&&p.hurt===0?1:0;
  // присед
  const wantC=IN.d&&grounded&&!IN.j;
  if(wantC)p.crouch=1;else if(p.crouch){p.crouch=0;if(boxHit(p.x,p.y,PW,22,isSolid))p.crouch=1;}
  // горизонталь
  let sp=p.crouch?0.65:p.blk?0:1.75;if(p.atk>0&&grounded)sp=0.25;
  if(p.hurt>0){p.vx*=0.9;}else{const target=dir*sp;p.vx+= (target-p.vx)*(grounded?0.35:0.12);if(dir&&p.atk===0&&!p.blk)p.face=dir;}
  moveX(p,p.vx,PW,PH());
  // прыжок
  if(p.jbuf&&(grounded||p.coyote>0)&&!p.crouch&&p.atk<8){p.vy=-5.7;p.coyote=0;p.jbuf=0;p.st='air';p.fallY=p.y;sfx('jump');}
  else if(p.jbuf&&grounded&&IN.d&&isOne(Math.floor(p.x/TS),Math.floor((p.y+1)/TS))){p.dropT=10;p.y+=1;p.jbuf=0;p.crouch=0;}
  if(!IN.j&&p.vy<-2.5)p.vy+=0.35;// короткий прыжок
  p.vy=Math.min(p.vy+0.35,7.2);
  const wasAir=!grounded;if(p.dropT>0)p.dropT--;
  const landed=moveY(p,p.vy,PW,PH(),p.dropT>0);
  if(landed){if(p.vy>0.5&&wasAir)landCheck();p.vy=0;if(p.st==='dead')return;p.st='stand';p.fallY=p.y;}
  else if(!onGround(p,PW)){if(p.st!=='air'){p.st='air';p.fallY=Math.min(p.fallY,p.y);}if(p.vy<0)p.fallY=p.y;
    if(p.atk===0)tryGrab();airKill();}
  else{p.fallY=p.y;}
  p.hidden=(inHide()&&Math.abs(p.vx)<0.6&&p.atk===0&&grounded)?1:0;
  if(p.y>L.h*TS+40)die();}
/* удар: попадание по врагам впереди */
function attackHit(){let hit=false;for(const e of L.enemies){if(e.dead)continue;const dx=(e.x-P.x)*P.face;
  if(dx>-4&&dx<22&&Math.abs(e.y-P.y)<18){hit=true;
    const unaware=e.st!=='alert'&&e.face===P.face; // со спины, не замечен
    if(e.k==='line'){sfx('clang');fx('spark',e.x,e.y-14);continue;}
    if(unaware||e.stun>40){killEnemy(e,'silent');continue;}
    if(e.st==='alert'&&e.k==='cop'&&e.wind===0&&Math.random()<0.3&&e.face===-P.face){sfx('clang');fx('spark',e.x-e.face*6,e.y-14);e.cd=Math.max(e.cd,10);continue;}
    e.hp--;e.stun=18;e.hx=e.x;e.x+=P.face*4;e.x=clamp(e.x,e.x1,e.x2);sfx('hit');fx('blood',e.x,e.y-12);alertE(e);if(e.hp<=0)killEnemy(e,'fight');}}
  if(hit)G.shake=3;return hit;}
function airKill(){if(P.vy<1.5)return;for(const e of L.enemies){if(e.dead||e.k==='line')continue;
  if(Math.abs(e.x-P.x)<10&&P.y>e.y-26&&P.y<e.y-10){killEnemy(e,'air');P.vy=-3;P.fallY=P.y;return;}}}
function killEnemy(e,how){e.dead=1;e.dt=0;e.st='dead';G.kills++;if(how==='silent'||how==='air'){G.silent++;P.kill=20;}sfx(how==='fight'?'hit':'kill');fx('blood',e.x,e.y-12);G.shake=5;
  if(how!=='fight')toastTxt(how==='air'?'Удар сверху!':how==='counter'?'Контрудар!':'Тихий удар!');}
let toastS=null,toastT=0;function toastTxt(s){toastS=s;toastT=70;}

/* ================= ВРАГИ ================= */
function canSee(e){if(P.st==='dead'||P.hidden)return false;const dx=P.x-e.x,dy=P.y-e.y;const range=e.k==='cop'?100:e.k==='line'?150:140;
  if(Math.abs(dy)>30)return false;if(dx*e.face<-6)return false;if(Math.abs(dx)>range)return false;
  const ty=Math.floor((e.y-18)/TS);for(let x=Math.min(e.x,P.x);x<Math.max(e.x,P.x);x+=8)if(isSolid(Math.floor(x/TS),ty))return false;return true;}
function alertE(e){if(e.st!=='alert'){e.st='alert';e.lost=0;e.meter=1;G.alarms++;sfx('alert');}e.face=sgn(P.x-e.x)||e.face;}
function updEnemies(){let anyAlert=false;for(const e of L.enemies){e.anim++;
  if(e.k==='line'&&!e.dead&&Math.abs(P.y-e.y)<20&&P.x>e.x-12&&P.x<e.x+12){P.x=e.x-12;P.vx=Math.min(P.vx,0);}
  if(e.dead){e.dt++;continue;}if(e.stun>0)e.stun--;if(e.cd>0)e.cd--;
  const see=canSee(e);const dx=P.x-e.x,adx=Math.abs(dx);
  if(e.st==='alert'){anyAlert=true;
    if(see){e.lost=0;e.face=sgn(dx)||e.face;}else if(++e.lost>200){e.st='search';e.t=120;e.meter=0.5;}
    if(e.k==='cop'){if(e.stun>0){}else if(e.wind>0){e.wind--;if(e.wind===0){e.cd=40;
        if(adx<24&&Math.abs(P.y-e.y)<20){if(P.blk&&P.face===-sgn(dx||1)){sfx('clang');fx('spark',e.x+e.face*10,e.y-14);P.ctr=18;P.ctrE=e;e.stun=22;}else damage(1,e.x);}}}
      else if(adx>18&&see||adx>18&&e.lost<60){const nx=clamp(e.x+sgn(dx)*1.15,e.x1,e.x2);e.x=nx;}
      else if(adx<=20&&Math.abs(P.y-e.y)<20&&e.cd===0){e.wind=26;}}
    else{// стрелки
      if(e.stun>0){e.aim=0;}else if(see){e.aim++;const need=e.k==='line'?42:58;if(e.aim>=need){e.aim=0;e.cd=e.k==='line'?40:80;shoot(e);}}
      else e.aim=Math.max(0,e.aim-2);
      if(e.k==='rifle'&&adx<26&&see&&e.cd===0&&e.aim<20){/* штык вблизи */e.wind=e.wind||24;}
      if(e.wind>0){e.wind--;if(e.wind===0){e.cd=50;if(adx<26&&Math.abs(P.y-e.y)<20){if(P.blk&&P.face===-sgn(dx||1)){sfx('clang');P.ctr=18;P.ctrE=e;e.stun=22;}else damage(1,e.x);}}}}}
  else{// патруль/поиск
    if(see){const k=e.k==='line'?0.05:(1.4-adx/(e.k==='cop'?100:140))*(P.crouch?0.018:0.032)*(Math.abs(P.vx)>1.2?1.6:1);e.meter=Math.min(1,e.meter+k);if(e.meter>=1)alertE(e);}
    else e.meter=Math.max(0,e.meter-0.004);
    if(e.k==='line'){e.face=-1;continue;}
    if(e.st==='search'){if(--e.t<=0)e.st='patrol';if(e.anim%60===0)e.face*=-1;continue;}
    if(e.guard){e.face=sgn(P.x-e.x)||e.face;continue;}
    if(e.wait>0){e.wait--;continue;}
    e.x+=e.face*0.45;if(e.x>=e.x2){e.x=e.x2;e.face=-1;e.wait=70;}else if(e.x<=e.x1){e.x=e.x1;e.face=1;e.wait=70;}}}
  setMusic(anyAlert?'tense':'calm');}
function shoot(e){sfx('shot');G.shake=4;const dy=Math.abs(P.y-e.y),dx=P.x-e.x;fx('flash',e.x+e.face*14,e.y-17);
  const inLine=dx*e.face>0&&Math.abs(dx)<(e.k==='line'?170:160)&&dy<20&&!P.crouch&&P.st!=='hang'&&!P.hidden;
  fx('tracer',e.x+e.face*14,e.y-17,{x2:inLine?P.x:e.x+e.face*170});if(inLine)damage(e.k==='line'?2:1,e.x);}

/* ================= ПРЕДМЕТЫ, ТРИГГЕРЫ ================= */
function updItems(){for(const it of L.items){if(it.got)continue;if(Math.abs(it.x-P.x)<11&&Math.abs(it.y-6-(P.y-10))<16){it.got=1;sfx('pick');
  if(it.k==='rub'){G.rub++;}else if(it.k==='tea'){P.hp=Math.min(P.maxhp,P.hp+2);toastTxt('Горячий чай: +2 ♥');}

function drawFx(){for(const f of G.fx){const sx=f.x-G.camX,sy=f.y-G.camY;
  if(f.k==='pt'){ctx.fillStyle=f.c;ctx.fillRect(R(sx),R(sy),2,2);}
  else if(f.k==='flash'){ctx.fillStyle='rgba(255,220,120,'+(1-f.t/6)+')';ctx.beginPath();ctx.arc(sx,sy,6,0,TAU);ctx.fill();}
  else if(f.k==='tracer'){ctx.strokeStyle='rgba(255,240,200,'+(1-f.t/8)+')';ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(f.x2-G.camX,sy);ctx.stroke();}}}
function drawCps(){for(let i=0;i<L.cps.length;i++){const c=L.cps[i],sx=R(c.x-G.camX),sy=R(c.y-G.camY);if(i===0)continue;
  ctx.fillStyle='#3a3026';ctx.fillRect(sx-1,sy-14,2,14);ctx.fillStyle=i<=G.cp?'#e8c050':'#8a8070';ctx.fillRect(sx+1,sy-14,7,5);}}
function drawSnow(){ctx.fillStyle='rgba(240,245,255,.8)';for(const s of G.snow)ctx.fillRect(R(s.x),R(s.y),s.s>0.7?2:1,s.s>0.7?2:1);}
function drawVision(){if(G.vision<=0.01)return;ctx.fillStyle='rgba(10,12,30,'+0.55*G.vision+')';ctx.fillRect(0,0,W,H);
  for(const e of L.enemies){if(e.dead)continue;const sx=e.x-G.camX,sy=e.y-G.camY;ctx.fillStyle='rgba(255,50,40,'+0.5*G.vision+')';ctx.fillRect(sx-7,sy-30,14,30);
    const range=e.k==='cop'?100:140;ctx.fillStyle='rgba(255,80,60,'+0.12*G.vision+')';ctx.beginPath();ctx.moveTo(sx,sy-20);ctx.lineTo(sx+e.face*range,sy-46);ctx.lineTo(sx+e.face*range,sy+6);ctx.fill();}
  for(const it of L.items){if(it.got||it.k==='rub')continue;ctx.fillStyle='rgba(120,200,255,'+0.7*G.vision+')';ctx.beginPath();ctx.arc(it.x-G.camX,it.y-6-G.camY,6,0,TAU);ctx.fill();}
  for(const h of L.hides){ctx.strokeStyle='rgba(120,255,160,'+0.7*G.vision+')';ctx.strokeRect(h.x-h.w/2-G.camX,h.y-24-G.camY,h.w,24);}
  for(const p of L.props)if(p.k==='agentNpc'&&!p.gone){ctx.fillStyle='rgba(255,210,60,'+0.6*G.vision+')';ctx.fillRect(p.x-G.camX-7,p.y-G.camY-30,14,30);}}

/* ================= HUD И УПРАВЛЕНИЕ ================= */
function drawHUD(){for(let i=0;i<P.maxhp;i++){const x=6+i*11,y=6;ctx.fillStyle=i<P.hp?'#d03030':'#3a2a2a';ctx.beginPath();ctx.arc(x+3,y+3,3,0,TAU);ctx.arc(x+7,y+3,3,0,TAU);ctx.fill();ctx.beginPath();ctx.moveTo(x,y+4);ctx.lineTo(x+5,y+10);ctx.lineTo(x+10,y+4);ctx.fill();}
  txtS('₽ '+G.rub,64,14,8,'#e8c050','left',FT);if(G.part)txtS('⚙',100,14,9,'#ffd870','left');
  // пауза
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(W-24,4,20,18);ctx.fillStyle='#eee';ctx.fillRect(W-18,8,3,10);ctx.fillRect(W-12,8,3,10);UI.push({x:W-28,y:0,w:28,h:26,fn:togglePause});
  if(ST.obj){const lines=wrap(ST.obj,W-60,7);lines.forEach((l,i)=>txtS(l,6,30+i*9,7,toastObj>0&&(toastObj>>4)%2?'#fff':'#e8d8a8','left'));}
  if(toastObj>0)toastObj--;
  if(ST.hint&&ST.hintT>0){ST.hintT--;const lines=wrap(ST.hint,W-40,8);const h=lines.length*10+8,y=portrait?H*0.36:40;ctx.globalAlpha=Math.min(1,ST.hintT/30);
    panel(14,y,W-28,h,'rgba(16,18,24,.82)','#6a5a3a');lines.forEach((l,i)=>txt(l,W/2,y+12+i*10,8,'#f0e6c8','center'));ctx.globalAlpha=1;}
  if(toastT>0){toastT--;txtS(toastS,W/2,H*0.3,10,'#ffe090','center',FD);}
  if(!kbd&&('ontouchstart' in window||CFG.forcePad))drawPad();}
function drawPad(){const Lp=padLayout(),t=touchKeys();const d=Lp.dpad;ctx.globalAlpha=0.5;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,TAU);ctx.fill();
  ctx.fillStyle='#ddd';const a=[['r',1,0],['l',-1,0],['u',0,-1],['d',0,1]];for(const [k,x,y] of a){ctx.globalAlpha=t[k]?0.9:0.45;ctx.beginPath();const cx=d.x+x*d.r*0.6,cy=d.y+y*d.r*0.6;
    ctx.moveTo(cx+x*7,cy+y*7);ctx.lineTo(cx-y*6-x*3,cy-x*6-y*3);ctx.lineTo(cx+y*6-x*3,cy+x*6-y*3);ctx.fill();}
  for(const b of Lp.btn){ctx.globalAlpha=t[b.k]?0.85:0.5;ctx.fillStyle=b.k==='a'?'#7a2a20':b.k==='b'?'#2a3a5a':b.k==='v'?'#5a4a1a':'#2a4a2a';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
    ctx.globalAlpha=0.9;txt(b.l,b.x,b.y+2,b.r>14?6:5,'#fff','center',FD);}
  ctx.globalAlpha=1;}
function drawDialog(){const d=ST.dlg;if(!d)return;const [who,s0]=d.lines[d.i];const s=tl(s0);d.ch=Math.min(s.length,d.ch+1.2);const shown=s.slice(0,Math.floor(d.ch));
  if(d.cut){ctx.fillStyle='rgba(6,6,10,.94)';ctx.fillRect(0,0,W,H);const lines=wrap(shown,W-40,10);const y0=H/2-lines.length*7;
    lines.forEach((l,i)=>txt(l,W/2,y0+i*14,10,'#e8dcc0','center'));txt('▼',W/2,H-30,8,'rgba(232,220,192,'+(0.4+0.4*Math.sin(G.t*0.1))+')','center');return;}
  const h=66,y=H-h-6;panel(6,y,W-12,h);const [nm,col]=WHO[who];if(nm)txt(nm,14,y+12,8,col,'left',FD);
  wrap(shown,W-30,8).forEach((l,i)=>txt(l,14,y+(nm?25:15)+i*10,8,'#eee'));txt('▼',W-16,y+h-6,7,'#b8904a','center');}

/* ================= МЕНЮ ================= */
function togglePause(){if(ST.scene!=='game'||ST.dlg||G.done)return;ST.modal=ST.modal==='pause'?null:'pause';}
function drawTitle(){UI=[];const t=ST.t;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#141824');g.addColorStop(0.7,'#3a3a4c');g.addColorStop(1,'#6a6a74');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // силуэт города
  ctx.fillStyle='#0e1018';const base=H*0.58;for(let i=0;i<12;i++){const x=i*W/10-10,h=30+hash(i,1)*40;ctx.fillRect(x,base-h,W/10+2,h+200);}
  ctx.fillRect(W*0.62,base-110,6,110);ctx.beginPath();ctx.moveTo(W*0.62+3,base-150);ctx.lineTo(W*0.62-1,base-110);ctx.lineTo(W*0.62+7,base-110);ctx.fill();// шпиль
  ctx.beginPath();ctx.arc(W*0.3,base-60,16,Math.PI,0);ctx.fill();ctx.fillRect(W*0.3-16,base-60,32,60);ctx.fillRect(W*0.3-1,base-86,2,12);
  for(let i=0;i<40;i++){ctx.fillStyle='rgba(240,245,255,.7)';ctx.fillRect((hash(i,2)*W+t*0.2*(0.5+hash(i,3)))%W,(hash(i,4)*H+t*0.5*(0.5+hash(i,5)))%H,1,1);}
  // герой на крыше
  ctx.fillStyle='#0e1018';ctx.fillRect(W*0.68,base-40,W*0.32,200);drawMan(W*0.78,base-41,{coat:'#4a3e34',pants:'#2a2a30',skin:'#e0c0a0',scarf:'#9a2a2a',hat:'cap',face:-1});ctx.fillStyle='#0e1018';ctx.fillRect(W*0.68,base-40,W*0.32,200);ctx.fillStyle='#d8dde6';ctx.fillRect(W*0.68,base-41,W*0.32,2);
  txtS('НОЧНАЯ',W/2,H*0.16,28,'#e8dcc0','center',FD);txtS('СТРАЖА',W/2,H*0.16+30,28,'#c84a3a','center',FD);
  txtS('ПЕТЕРБУРГ · 1905 — 1917',W/2,H*0.16+46,8,'#c8bca0','center',FD);
  const w=150,x=(W-w)/2;let y=R(Math.min(H*0.66,H-150));
  if(ST.menu==='missions'){drawMissionList();return;}
  const any=Object.keys(SAVE.m).length>0;
  button(any?'МИССИИ':'НАЧАТЬ ИГРУ',x,y,w,22,()=>{auInit();if(any)ST.menu='missions';else startMission(1);},{hot:1,size:9});y+=28;
  button('ЗВУК: '+(AU.on?'ВКЛ':'ВЫКЛ'),x,y,w,18,()=>{auInit();setSound(!AU.on);});y+=24;
  button('КНОПКИ: '+(CFG.big?'КРУПНЫЕ':'ОБЫЧНЫЕ'),x,y,w,18,()=>{CFG.big=CFG.big?0:1;store.set('strazha_cfg',CFG);});y+=24;
  button('ВСЕ ИГРЫ REJAR BOX',x,y,w,18,()=>{location.href='../../';});
  txt('Ранняя версия · миссия 1 из 15',W/2,H-8,6,'rgba(232,220,192,.55)','center');}
function drawMissionList(){ctx.fillStyle='rgba(8,10,14,.86)';ctx.fillRect(0,0,W,H);panel(8,6,W-16,H-12);txt('МИССИИ',W/2,22,10,'#e8c070','center',FD);let y=30;const rh=Math.max(12,Math.min(17,(H-80)/18));
  const acts=[['АКТ I · «КРОВАВЫЙ СНЕГ» · 1905',0],['АКТ II · «ФЕВРАЛЬ» · 1917',5],['АКТ III · «ОКТЯБРЬ» · 1917',10]];
  for(const [an,s] of acts){txt(an,18,y+8,6,'#b8a070','left',FD);y+=11;for(let i=s;i<s+5;i++){const M=MISSIONS[i],ok=!!M.build,r=SAVE.m[M.n];
      button((M.n+'. '+M.name)+(r?'  ['+r.rank+']':''),16,y,W-32,rh-2,()=>startMission(M.n),{size:7,dis:!ok});if(!ok)txt('скоро',W-22,y+rh/2+2,6,'#776','right');y+=rh;}y+=2;}
  button('НАЗАД',W/2-40,H-30,80,18,()=>{ST.menu='main';},{size:7});}
function drawPause(){ctx.fillStyle='rgba(6,8,12,.8)';ctx.fillRect(0,0,W,H);const w=170,x=(W-w)/2;let y=H/2-70;panel(x-8,y-14,w+16,150);
  txt('ПАУЗА',W/2,y,11,'#e8c070','center',FD);y+=12;
  button('ПРОДОЛЖИТЬ',x,y,w,20,()=>{ST.modal=null;},{hot:1});y+=26;
  button('С КОНТРОЛЬНОЙ ТОЧКИ',x,y,w,18,()=>{ST.modal=null;restoreCP();});y+=24;
  button('МИССИЯ ЗАНОВО',x,y,w,18,()=>{startMission(L.mi);});y+=24;
  button('ЗВУК: '+(AU.on?'ВКЛ':'ВЫКЛ'),x,y,w,18,()=>setSound(!AU.on));y+=24;
  button('В ГЛАВНОЕ МЕНЮ',x,y,w,18,()=>{ST.scene='title';ST.modal=null;ST.menu='main';setMusic('calm');});}
function drawResult(){ctx.fillStyle='rgba(6,8,12,.9)';ctx.fillRect(0,0,W,H);const r=G.result,w=190,x=(W-w)/2;let y=H*0.18;
  txt('МИССИЯ ВЫПОЛНЕНА',W/2,y,12,'#e8c070','center',FD);y+=14;txt('«'+L.name+'»',W/2,y,9,'#d8ccb0','center',FD);y+=26;
  const m=Math.floor(r.sec/60),s=Math.floor(r.sec%60);
  const rows=[['Время',m+':'+String(s).padStart(2,'0')],['Врагов обезврежено',G.kills],['Из них тихо',G.silent],['Тревог поднято',Math.max(0,G.alarms)],['Попыток',G.retries],['Рубли',G.rub],['Деталь часов',G.part?'найдена':'—'],['Очки',r.score]];
  for(const [a,b] of rows){txt(a,x,y,8,'#bbb');txt(String(b),x+w,y,8,'#fff','right');y+=13;}
  y+=10;txt('РАНГ',W/2,y,8,'#bbb','center');txtS(r.rank,W/2,y+30,30,r.rank==='S'?'#ffd060':r.rank==='A'?'#e0e0e0':'#c89060','center',FD);y+=46;
  txt('Миссия 2 «Двор-колодец» — в следующей версии.',W/2,y,7,'#998','center');y+=12;
  button('В МЕНЮ',x,y,w,20,()=>{ST.scene='title';ST.menu='missions';ST.modal=null;},{hot:1});y+=26;
  button('ПЕРЕИГРАТЬ',x,y,w,18,()=>startMission(L.mi));}

/* ================= ЦИКЛ ================= */
function update(){ST.t++;readInput();musicTick();
  if(ST.scene!=='game')return;
  if(ST.dlg||ST.modal){return;}
  G.t++;updPlayer();updEnemies();updItems();updFx();updCam();
  G.vision+=((IN.v&&P.st!=='dead'?1:0)-G.vision)*0.15;
  if(G.shake>0)G.shake*=0.85;
  if(P.st==='dead'){G.deadT++;if(G.deadT>90)restoreCP();}}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(SC*DPR,0,0,SC*DPR,OX*DPR,OY*DPR);ctx.imageSmoothingEnabled=false;ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();UI=[];
  if(ST.scene==='title'){drawTitle();return;}
  const sh=G.shake>0.5?{x:rnd(-G.shake,G.shake)*0.4,y:rnd(-G.shake,G.shake)*0.4}:{x:0,y:0};
  ctx.save();ctx.translate(R(sh.x),R(sh.y));drawSky();drawTiles();
  for(const o of L.props)if(!o.gone)drawProp(o);drawCps();for(const it of L.items)drawItem(it);
  for(const e of L.enemies)drawEnemy(e);drawPlayer();drawFx();drawSnow();drawVision();ctx.restore();
  if(P.st==='dead'){ctx.fillStyle='rgba(60,0,0,'+Math.min(0.6,G.deadT/90)+')';ctx.fillRect(0,0,W,H);txtS('ИЛЬЯ ПОГИБ',W/2,H/2,14,'#f0d0c0','center',FD);}
  drawHUD();
  if(ST.modal==='pause'){UI=[];drawPause();}
  if(ST.modal==='result'){UI=[];drawResult();}
  if(ST.dlg){UI=[];drawDialog();}}
let last=0,acc=0;function loop(ts){requestAnimationFrame(loop);if(!last)last=ts;acc+=Math.min(100,ts-last);last=ts;
  while(acc>=1000/60){update();acc-=1000/60;}draw();}
layout();requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
/* отладка и автотесты */
window.__strazha={get P(){return P},get L(){return L},get G(){return G},ST,IN,K,startMission,step:n=>{for(let i=0;i<(n||1);i++)update();},dlgNext,restoreCP,SAVE,tile,MISSIONS};
})();
</script>
</body></html>
