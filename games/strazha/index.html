<script>
(()=>{
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=240,H=400,SC=1,OX=0,OY=0,DPR=1,portrait=true,Z=1.5,VW=160,VH=270;
const TS=16,TAU=Math.PI*2,R=Math.round;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),sgn=v=>v<0?-1:v>0?1:0,lerp=(a,b,t)=>a+(b-a)*t;
const hash=(x,y)=>{let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)};
const FT="'PT Mono','Courier New',monospace",FD="'Russo One','Arial Black',Impact,sans-serif";
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const LANG='ru';const EN={};function tl(s){return LANG==='en'&&EN[s]||s;}

/* ================= ЭКРАН ================= */
function layout(){DPR=Math.min(window.devicePixelRatio||1,3);
  const vw=cv.clientWidth||innerWidth,vh=cv.clientHeight||innerHeight;cv.width=R(vw*DPR);cv.height=R(vh*DPR);
  portrait=vh>=vw;SC=Math.min(vw/240,vh/(portrait?420:260));
  W=Math.floor(Math.min(portrait?320:520,vw/SC));H=Math.floor(Math.min(640,vh/SC));
  OX=R((vw-W*SC)/2);OY=R((vh-H*SC)/2);Z=portrait?1.45:1.6;VW=W/Z;VH=H/Z;}
addEventListener('resize',layout);

/* ================= ТЕКСТ И КНОПКИ ================= */
function txt(s,x,y,size,col,align,font){s=tl(s);ctx.font=size+'px '+(font||FT);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function txtS(s,x,y,size,col,align,font){s=tl(s);ctx.font=size+'px '+(font||FT);ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function wrap(s,maxW,size,font){s=tl(s);ctx.font=size+'px '+(font||FT);const out=[];
  for(const para of s.split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}out.push(line);}return out;}
function panel(x,y,w,h,fill,edge){ctx.fillStyle=fill||'rgba(12,13,18,.93)';ctx.fillRect(x,y,w,h);ctx.strokeStyle=edge||'#b8904a';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);}
let UI=[];
function button(label,x,y,w,h,fn,o){o=o||{};const hov=PT.over&&PT.x>=x&&PT.x<=x+w&&PT.y>=y&&PT.y<=y+h;
  ctx.fillStyle=o.hot?(hov?'#c84a3a':'#a83a2e'):(hov?'#3a3226':'#1e1b17');ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=o.hot?'#f0c0a0':'#7a5e38';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  txt(label,x+w/2,y+h/2+(o.size||8)*0.36,o.size||8,o.dis?'#665':o.hot?'#fff3e0':'#f0e0c0','center',FD);
  if(!o.dis)UI.push({x,y,w,h,fn});}

/* ================= ЗВУК ================= */
const AU={ctx:null,on:store.get('strazha_snd',true),mus:null,nextT:0,step:0,master:null};
function auInit(){if(AU.ctx)return;try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.on?0.5:0;AU.master.connect(AU.ctx.destination);}catch(e){}}
function setSound(v){AU.on=v;store.set('strazha_snd',v);if(AU.master)AU.master.gain.value=v?0.5:0;}
function tone(f,d,type,vol,slide,t0){if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=t0||c.currentTime;const o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+d+0.02);}
function noise(d,vol,hp,t0){if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=t0||c.currentTime,n=Math.floor(c.sampleRate*d);const b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;
  const g=c.createGain();g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);}
const now=()=>AU.ctx?AU.ctx.currentTime:0;
function sfx(k){switch(k){
  case'jump':noise(0.05,0.05,2000);tone(260,0.07,'triangle',0.05,420);break;case'land':noise(0.07,0.1,300);break;
  case'hit':noise(0.08,0.22,1200);tone(160,0.08,'sawtooth',0.08,80);break;
  case'clang':tone(1300,0.14,'triangle',0.12,1000);tone(2100,0.08,'square',0.035);break;
  case'kill':noise(0.14,0.25,500);tone(240,0.25,'sawtooth',0.08,50);break;
  case'blade':tone(2600,0.06,'sawtooth',0.05,1200);noise(0.1,0.18,900,now()+0.05);break;
  case'shot':noise(0.3,0.38,180);tone(80,0.25,'square',0.12,35);break;
  case'hurt':tone(190,0.2,'sawtooth',0.12,70);break;case'throw':noise(0.08,0.12,3000);break;
  case'pick':tone(880,0.07,'square',0.06);tone(1320,0.1,'square',0.05,null,now()+0.06);break;
  case'alert':tone(560,0.09,'square',0.08);tone(840,0.14,'square',0.08,null,now()+0.09);break;
  case'whistle':tone(2400,0.4,'sine',0.07,2700);break;case'grab':noise(0.04,0.08,1500);break;
  case'eagle':tone(2200,0.5,'sine',0.08,1300);tone(2600,0.35,'sine',0.05,1500,now()+0.25);break;
  case'sync':for(let i=0;i<5;i++)tone(440*Math.pow(1.26,i),0.4,'triangle',0.05,null,now()+i*0.08);break;
  case'whoosh':noise(0.5,0.12,600);break;case'roll':noise(0.12,0.08,700);break;
  case'ok':tone(523,0.1,'square',0.06);tone(784,0.18,'square',0.06,null,now()+0.1);break;}}
const MUS={
  calm:{bpm:76,bass:[45,45,52,52,43,43,50,50,41,41,48,48,40,40,47,47],mel:[69,0,72,71,69,0,64,0,67,0,65,64,62,0,64,0,65,0,69,67,65,0,62,0,64,0,0,0,0,0,0,0],pad:1},
  tense:{bpm:128,bass:[45,57,45,57,46,58,46,58,45,57,45,57,40,52,44,56],mel:[76,0,76,74,72,0,71,0,72,0,74,0,69,0,0,0,76,0,79,77,76,0,74,0,72,71,69,0,68,0,69,0]},
  chase:{bpm:140,bass:[38,50,38,50,41,53,41,53,36,48,36,48,40,52,40,52],mel:[74,77,81,0,79,77,76,0,74,0,72,74,76,0,0,0,74,77,81,0,82,81,79,77,76,0,79,0,81,0,0,0]},
  mem:{bpm:60,bass:[45,0,52,0,48,0,52,0,43,0,50,0,47,0,52,0],mel:[81,0,0,0,79,0,76,0,77,0,0,0,76,0,74,0,72,0,0,0,74,0,76,0,69,0,0,0,0,0,0,0]}};
function midi(n){return 440*Math.pow(2,(n-69)/12);}
function musicTick(){if(!AU.ctx||!AU.on||!AU.mus)return;const c=AU.ctx,m=MUS[AU.mus];const sp=60/m.bpm/2;
  if(AU.nextT<c.currentTime)AU.nextT=c.currentTime+0.05;
  while(AU.nextT<c.currentTime+0.2){const i=AU.step%32;
    if(i%2===0){const b=m.bass[(i>>1)%16];if(b)tone(midi(b),sp*1.8,'triangle',0.09,null,AU.nextT);}
    const n=m.mel[i];if(n)tone(midi(n),sp*1.6,AU.mus==='mem'?'sine':'square',AU.mus==='mem'?0.05:0.032,null,AU.nextT);
    if((AU.mus==='tense'||AU.mus==='chase')&&i%4===2)noise(0.04,0.05,3000,AU.nextT);
    if(AU.mus==='chase'&&i%8===0)noise(0.09,0.09,120,AU.nextT);
    AU.nextT+=sp;AU.step++;}}
function setMusic(k){if(AU.mus!==k){AU.mus=k;AU.step=0;}}

/* ================= ВВОД ================= */
const K={},PT={x:0,y:0,over:false};const TOUCH={};let kbd=false;
const IN={l:0,r:0,u:0,d:0,j:0,a:0,b:0,v:0,jP:0,aP:0,uP:0,dP:0,lP:0,rP:0};let prevIN={};
addEventListener('keydown',e=>{if(e.repeat)return;K[e.code]=1;kbd=true;auInit();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='Escape'||e.code==='KeyP')togglePause();
  if(e.code==='KeyQ'||e.code==='Tab'){nextWeapon();e.preventDefault();}
  if((e.code==='Enter'||e.code==='Space')&&ST.dlg){dlgNext();e.preventDefault();}});
addEventListener('keyup',e=>{K[e.code]=0;});
function toLogical(cx,cy){const r=cv.getBoundingClientRect();return {x:(cx-r.left-OX)/SC,y:(cy-r.top-OY)/SC};}
function padLayout(){const s=CFG.big?1.2:1;const by=H-10;
  return {dpad:{x:50*s,y:by-46*s,r:34*s},
    btn:[{k:'j',x:W-34*s,y:by-34*s,r:23*s,l:'ПРЫЖОК'},{k:'a',x:W-86*s,y:by-24*s,r:21*s,l:'УДАР'},
      {k:'b',x:W-30*s,y:by-88*s,r:15*s,l:'БЛОК'},{k:'v',x:W-78*s,y:by-78*s,r:13*s,l:'ЧУТЬЁ'}]};}
function padTouch(){for(const id in TOUCH){const t=TOUCH[id];if(t.pad)return t;}return null;}
function touchKeys(){const o={l:0,r:0,u:0,d:0,j:0,a:0,b:0,v:0};if(ST.scene!=='game'||ST.modal)return o;const Lp=padLayout();
  for(const id in TOUCH){const t=TOUCH[id];if(t.ui)continue;
    if(!t.pad&&!t.btn&&(t.sx??t.x)<W*0.45&&(t.sy??t.y)>H*0.3){t.pad=1;t.ox=t.sx??t.x;t.oy=t.sy??t.y;}
    if(t.pad){let dx=t.x-t.ox,dy=t.y-t.oy,dd=Math.hypot(dx,dy);const r=Lp.dpad.r;
      if(dd>r){t.ox=t.x-dx/dd*r;t.oy=t.y-dy/dd*r;dx=t.x-t.ox;dy=t.y-t.oy;dd=r;}// крестовина едет за пальцем
      if(dd<8)continue;const c=dx/dd,s=dy/dd;if(c>0.42)o.r=1;if(c<-0.42)o.l=1;if(s<-0.62)o.u=1;if(s>0.62)o.d=1;continue;}
    let best=null,bd=1e9;for(const b of Lp.btn){const d=Math.hypot(t.x-b.x,t.y-b.y);if(d<b.r*1.4&&d<bd){bd=d;best=b;}}
    if(best){o[best.k]=1;t.btn=1;}}
  return o;}
function hitUI(p){for(let i=UI.length-1;i>=0;i--){const u=UI[i];if(p.x>=u.x&&p.x<=u.x+u.w&&p.y>=u.y&&p.y<=u.y+u.h){u.fn();return true;}}return false;}
cv.addEventListener('touchstart',e=>{e.preventDefault();auInit();kbd=false;for(const t of e.changedTouches){const p=toLogical(t.clientX,t.clientY);
  if(ST.dlg){dlgNext();TOUCH[t.identifier]={...p,ui:1};continue;}
  const ui=hitUI(p);TOUCH[t.identifier]={...p,sx:p.x,sy:p.y,ui:ui?1:0};}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const o=TOUCH[t.identifier];if(!o)continue;const p=toLogical(t.clientX,t.clientY);o.x=p.x;o.y=p.y;}},{passive:false});
const tEnd=e=>{e.preventDefault();for(const t of e.changedTouches)delete TOUCH[t.identifier];};
cv.addEventListener('touchend',tEnd,{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
cv.addEventListener('mousemove',e=>{const p=toLogical(e.clientX,e.clientY);PT.x=p.x;PT.y=p.y;PT.over=true;});
cv.addEventListener('mousedown',e=>{auInit();const p=toLogical(e.clientX,e.clientY);if(ST.dlg){dlgNext();return;}hitUI(p);});
function readInput(){const t=touchKeys();
  IN.l=K.ArrowLeft||K.KeyA||t.l?1:0;IN.r=K.ArrowRight||K.KeyD||t.r?1:0;IN.u=K.ArrowUp||K.KeyW||t.u?1:0;IN.d=K.ArrowDown||K.KeyS||t.d?1:0;
  IN.j=K.Space||K.KeyZ||t.j?1:0;IN.a=K.KeyJ||K.KeyX||t.a?1:0;IN.b=K.KeyK||K.KeyC||K.ShiftLeft||t.b?1:0;IN.v=K.KeyL||K.KeyV||t.v?1:0;
  IN.jP=IN.j&&!prevIN.j;IN.aP=IN.a&&!prevIN.a;IN.uP=IN.u&&!prevIN.u;IN.dP=IN.d&&!prevIN.d;IN.lP=IN.l&&!prevIN.l;IN.rP=IN.r&&!prevIN.r;
  prevIN={...IN};}

/* ================= СОСТОЯНИЕ ================= */
const CFG=store.get('strazha_cfg',{big:0});
const SAVE=store.get('strazha_prog',{m:{},parts:{},rub:0});
function saveProg(){store.set('strazha_prog',SAVE);}
const ST={scene:'title',modal:null,dlg:null,t:0,hint:null,hintT:0,obj:'',menu:'main'};
let L=null,P=null,G=null;

/* ================= ТАЙЛЫ =================
  ' ' воздух  G земля  W стена (по бокам можно лезть)  X ящик  R крыша (сверху)  = балкон  - балка
  | водосточная труба  s сугроб  o шест для раскачки
  фон L.bg: номер стиля дома; у стилей с climb:1 по фасаду (карнизы, наличники) можно лазать */
const SOLID={G:1,W:1,X:1},ONEWAY={R:1,'=':1,'-':1};
function tile(tx,ty){if(tx<0||tx>=L.w)return 'W';if(ty<0)return ' ';if(ty>=L.h)return 'G';return L.map[ty][tx];}
const isSolid=(tx,ty)=>!!SOLID[tile(tx,ty)],isOne=(tx,ty)=>!!ONEWAY[tile(tx,ty)];
const isTop=(tx,ty)=>isSolid(tx,ty)||isOne(tx,ty),isAir=(tx,ty)=>!isSolid(tx,ty)&&!isOne(tx,ty);
const isPipe=(tx,ty)=>tile(tx,ty)==='|';
const STY=[null,
  {c:['#5a4a44','#463a36'],climb:1,win:'#d8a860'},{c:['#4e5a60','#3e484c'],climb:1,win:'#c8b070'},{c:['#5e5440','#4a4232'],climb:0,win:'#e0b868'},
  {c:['#46523e','#384230'],climb:1,win:'#d0a858'},{c:['#5a4650','#463640'],climb:0,win:'#d8b070'},{c:['#4a4c5a','#3a3c48'],climb:1,win:'#e0c078'},
  {c:['#6a3a30','#542e26'],climb:1,win:'#e8b060',tower:1},{c:['#504a42','#403a34'],climb:1,win:'#c8a060'},
  {c:['#2e2a26','#26221e'],climb:0,yard:1,win:'#c89048'}];
function bgAt(tx,ty){if(tx<0||tx>=L.w||ty<0||ty>=L.h)return 0;return L.bg[ty][tx];}
function climbCell(tx,ty){return isPipe(tx,ty);}// лазать можно только по трубам (и по боковым стенам — см. startClimb)

/* ================= МИССИЯ 1: НАРВСКИЕ ВОРОТА ================= */
function buildM1(){const w=212,h=26,GR=23;const m=[];for(let y=0;y<h;y++)m.push(Array(w).fill(' '));
  const bg=[];for(let y=0;y<h;y++)bg.push(Array(w).fill(0));
  const set=(x,y,c)=>{if(x>=0&&x<w&&y>=0&&y<h)m[y][x]=c;};
  const fill=(x0,y0,x1,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,c);};
  const house=(x0,x1,roof,style,bot)=>{for(let y=roof;y<=(bot||GR-1);y++)for(let x=x0;x<=x1;x++)bg[y][x]=style;fill(x0,roof,x1,roof,'R');};
  fill(0,GR,w-1,h-1,'G');fill(0,0,0,GR-1,'W');fill(w-1,0,w-1,GR-1,'W');
  // A. улица у ворот
  house(1,12,15,1);house(13,26,12,2);house(27,42,13,3);
  set(9,22,'X');set(10,22,'X');set(10,21,'X');set(20,22,'X');
  fill(11,16,11,GR-1,'|');fill(24,13,24,GR-1,'|');
  fill(42,14,42,GR-1,'|');
  // B. крыши: шест над проулком, дом D, высокая стена E
  set(44,11,'o');
  house(46,58,11,4);fill(46,11,46,GR-1,'W');
  house(59,72,7,5);fill(59,7,59,10,'W');fill(72,7,72,GR-1,'W');
  fill(73,7,75,7,'-');// балка над двором
  // C. двор-колодец
  for(let y=4;y<=GR-1;y++)for(let x=73;x<=92;x++)bg[y][x]=9;
  set(80,22,'X');fill(85,18,87,18,'=');
  fill(93,9,93,GR-1,'W');
  // D. дом F и пожарная каланча
  house(93,112,9,6);set(93,9,'W');
  for(let y=1;y<=8;y++)for(let x=104;x<=107;x++)bg[y][x]=7;fill(104,1,107,1,'R');fill(106,2,106,8,'|');fill(103,1,103,1,'-');fill(108,1,108,1,'-');
  // E. погоня: крыши G, H, трос, I
  fill(109,8,112,8,'s');house(113,140,12,8);
  house(143,160,10,1);fill(143,10,143,GR-1,'W');
  set(141,11,'-');
  house(170,195,14,2);fill(170,14,170,GR-1,'W');fill(195,14,195,GR-1,'W');
  // F. улица к арке
  for(let y=6;y<=GR-1;y++)for(let x=200;x<=205;x++)bg[y][x]=10;
  const tx=x=>x*TS+8,ty=y=>y*TS;
  const ent=[];const E=(o)=>ent.push(o);
  E({k:'line',x:tx(34),y:ty(GR),face:-1});E({k:'line',x:tx(36),y:ty(GR),face:-1});E({k:'line',x:tx(38),y:ty(GR),face:-1});
  E({k:'cop',x:tx(54),y:ty(11),face:1,x1:tx(49),x2:tx(57)});
  E({k:'soldier',x:tx(69),y:ty(7),face:-1,x1:tx(64),x2:tx(71)});
  E({k:'cop',x:tx(78),y:ty(GR),face:1,x1:tx(75),x2:tx(84)});

const PW=10;function PH(){return P.crouch||P.roll>0?14:22;}
function boxHit(x,y,w,h,fn){const x0=Math.floor((x-w/2)/TS),x1=Math.floor((x+w/2-0.01)/TS),y0=Math.floor((y-h)/TS),y1=Math.floor((y-0.01)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(fn(tx,ty))return {tx,ty};return null;}
function moveX(o,dx,w,h){o.x+=dx;const hit=boxHit(o.x,o.y,w,h,isSolid);if(hit){if(dx>0)o.x=hit.tx*TS-w/2-0.01;else if(dx<0)o.x=(hit.tx+1)*TS+w/2+0.01;return true;}return false;}
function moveY(o,dy,w,h,drop){const prevFeet=o.y;o.y+=dy;let landed=false;
  if(dy>0){const x0=Math.floor((o.x-w/2)/TS),x1=Math.floor((o.x+w/2-0.01)/TS),ty=Math.floor((o.y-0.01)/TS);
    for(let tx=x0;tx<=x1;tx++){if(isSolid(tx,ty)||(isOne(tx,ty)&&!drop&&prevFeet<=ty*TS+0.01)){o.y=ty*TS;landed=true;break;}}}
  else if(dy<0){const hit=boxHit(o.x,o.y,w,h,isSolid);if(hit){o.y=(hit.ty+1)*TS+h+0.01;o.vy=0;}}
  return landed;}
function onGround(o,w){const x0=Math.floor((o.x-w/2)/TS),x1=Math.floor((o.x+w/2-0.01)/TS),ty=Math.floor((o.y+0.5)/TS);
  if(Math.abs(o.y-ty*TS)>0.6)return false;for(let tx=x0;tx<=x1;tx++)if(isTop(tx,ty))return true;return false;}
function hideAt(x,y){const tx=Math.floor(x/TS),ty=Math.floor((y-4)/TS);if(tile(tx,ty)==='s')return 'snow';
  for(const h of L.hides)if(Math.abs(x-h.x)<h.w/2&&Math.abs(y-h.y)<4)return 'hay';return '';}
function crowdAt(x,y){for(const c of L.crowds)if(!c.gone&&!c.flee&&Math.abs(x-c.x)<c.n*3.5+6&&Math.abs(y-c.y)<4)return c;return null;}
function softBelow(x,y){let best=null,bd=1e9;for(const s of L.softs){if(s.y<y)continue;const d=Math.abs(s.x-x);if(d<s.w/2+44&&d<bd){// нет ли крыши между
    let ok=true;const tx=Math.floor(s.x/TS);for(let ty=Math.floor(y/TS)+1;ty<Math.floor((s.y-1)/TS);ty++)if(isTop(tx,ty)){ok=false;break;}if(ok){bd=d;best=s;}}}return best;}

  if(P.hp<=0)die();}
function die(){if(P.st==='dead')return;P.st='dead';P.hp=0;G.deadT=1;sfx('kill');G.shake=10;}
function tryGrab(dir){if(P.noGrab>0||P.vy<-2.2)return false;
  const fx=Math.floor((P.x+dir*(PW/2+5))/TS);const handY=P.y-20;
  for(let ty=Math.floor((handY-14)/TS);ty<=Math.floor((handY+8)/TS);ty++){const d=handY-ty*TS;
    if(isTop(fx,ty)&&isAir(fx,ty-1)&&isAir(fx,ty-2)&&d>-8&&d<14){const px=Math.floor(P.x/TS);if(isTop(px,ty)&&!isPipe(px,ty))continue;
      P.st='hang';P.face=dir;P.hang={tx:fx,ty};P.x=dir>0?fx*TS-PW/2-0.5:(fx+1)*TS+PW/2+0.5;P.y=ty*TS+20;P.vx=0;P.vy=0;sfx('grab');return true;}}
  return false;}
/* лазание: по фасаду (свободно) или по боковой стене (вертикально) */
function wallSide(dir){const tx=Math.floor((P.x+dir*(PW/2+2))/TS),ty=Math.floor((P.y-12)/TS);return isSolid(tx,ty)&&tile(tx,ty)==='W'?tx:null;}
function startClimb(){const tx=Math.floor(P.x/TS),ty=Math.floor((P.y-12)/TS);
  if(climbCell(tx,ty)){P.st='climb';P.cm={k:isPipe(tx,ty)?'pipe':'face'};if(P.cm.k==='pipe')P.x=tx*TS+8;P.vx=0;P.vy=0;P.crouch=0;sfx('grab');return true;}
  for(const d of [P.face,-P.face]){const wx=wallSide(d);if(wx!=null){P.st='climb';P.face=d;P.cm={k:'wall',dir:d};P.x=d>0?wx*TS-PW/2-0.6:(wx+1)*TS+PW/2+0.6;P.vx=0;P.vy=0;P.crouch=0;sfx('grab');return true;}}
  return false;}
function canStay(x,y){const tx=Math.floor(x/TS),ty=Math.floor((y-12)/TS);
  if(P.cm.k==='wall'){const wx=Math.floor((x+P.cm.dir*(PW/2+2))/TS);return tile(wx,ty)==='W';}
  return climbCell(tx,ty)||climbCell(tx,Math.floor((y-4)/TS))&&climbCell(tx,Math.floor((y-18)/TS));}
function climbTop(){// найти, куда подтянуться сверху
  const cx=P.cm.k==='wall'?Math.floor((P.x+P.cm.dir*(PW/2+2))/TS):Math.floor(P.x/TS);
  for(let ty=Math.floor((P.y-26)/TS);ty<=Math.floor((P.y-4)/TS);ty++){if(isTop(cx,ty)&&isAir(cx,ty-1)&&isAir(cx,ty-2))return {tx:cx,ty,keep:P.cm.k!=='wall'};}
  return null;}
function updClimb(dir){const p=P;p.climbT=(p.climbT||0)+1;
  if(p.jbuf){p.jbuf=0;p.noGrab=8;
    if(IN.d){p.st='air';p.vy=0.5;p.noGrab=18;p.fallY=p.y;return;}
    const away=p.cm.k==='wall'&&dir===-p.cm.dir;
    if(away){p.st='air';p.vx=dir*2.5;p.vy=-4.6;p.face=dir;p.fallY=p.y;sfx('jump');return;}// отскок от стены
    if(dir&&p.cm.k!=='wall'){p.st='air';p.vx=dir*2.0;p.vy=-3.9;p.face=dir;p.cj=16;p.fallY=p.y;sfx('jump');return;}
    p.st='air';p.vy=-4.7;p.vx=0;p.cj=18;p.fallY=p.y;sfx('jump');return;}// прыжок вверх по стене
  let moved=false;
  if(IN.u){const ny=p.y-1.3;if(canStay(p.x,ny)&&!boxHit(p.x,ny,PW,22,isSolid)){p.y=ny;moved=true;}else{const t=climbTop();if(t){p.hang=t;p.st='pull';p.pull=14;sfx('grab');return;}}}
  else if(IN.d){const ny=p.y+1.7;if(onGround(p,PW)){p.st='stand';p.cm=null;return;}
    if(canStay(p.x,ny)){const lt=moveY(p,1.7,PW,22,false);moved=true;if(lt){p.st='stand';p.cm=null;return;}}else{p.st='air';p.fallY=p.y;p.noGrab=12;return;}}
  if(dir&&p.cm.k!=='wall'&&p.cm.k!=='pipe'){const nx=p.x+dir*1.1;if(canStay(nx,p.y)&&!boxHit(nx,p.y,PW,22,isSolid)){p.x=nx;moved=true;}p.face=dir;}
  else if(dir&&p.cm.k==='pipe'){const nx=p.x+dir*0.85;if(climbCell(Math.floor(nx/TS),Math.floor((p.y-12)/TS))){p.cm.k='face';p.x=nx;}p.face=dir;}
  if(moved)p.climb++;}
function landCheck(){const fell=(P.y-P.fallY)/TS;const soft=hideAt(P.x,P.y);
  if(soft){if(fell>3){fx('snow',P.x,P.y-6);sfx('land');if(fell>5)toastTxt('Прыжок веры!');}return;}

function updPlayer(){const p=P;p.anim++;if(p.inv>0)p.inv--;if(p.hurt>0)p.hurt--;if(p.noGrab>0)p.noGrab--;if(p.ctr>0)p.ctr--;if(p.kill>0)p.kill--;if(p.cj>0)p.cj--;if(p.land>0)p.land--;if(p.comboT>0)p.comboT--;

  if(p.st==='sync'||p.st==='tackle')return;
  const dir=(IN.r?1:0)-(IN.l?1:0);
  if(IN.jP)p.jbuf=8;else if(p.jbuf>0)p.jbuf--;
  // висит на краю
  if(p.st==='hang'){p.hangT=(dir===p.face||IN.u)?(p.hangT||0)+1:0;
    if(IN.uP||IN.jP||p.hangT>7){p.st='pull';p.pull=14;p.hangT=0;p.jbuf=0;sfx('grab');}
    else if(IN.dP||(dir&&dir!==p.face)){p.st='air';p.hang=null;p.noGrab=14;p.fallY=p.y;}return;}
  if(p.st==='pull'){p.pull--;if(p.pull<=0){const h=p.hang;if(!h.keep)p.x=h.tx*TS+(p.face>0?5:11);else p.x=clamp(p.x,h.tx*TS+5,h.tx*TS+11);p.y=h.ty*TS;p.st='stand';p.hang=null;p.cm=null;p.fallY=p.y;}return;}
  if(p.st==='climb'){updClimb(dir);return;}
  // шест
  if(p.st==='swing'){const s=p.sw;s.t++;s.a=Math.sin(s.t*0.11)*1.05*s.f;p.x=s.x+Math.sin(s.a)*16;p.y=s.y+Math.cos(s.a)*22;
    if(p.jbuf){p.jbuf=0;const f=dir||s.f;p.st='air';p.vx=f*2.9;p.vy=-4.4-Math.max(0,Math.cos(s.t*0.11)*s.f*f)*0.8;p.face=f;p.noGrab=14;p.fallY=p.y;p.sw=null;sfx('whoosh');}
    else if(IN.dP){p.st='air';p.vy=0;p.noGrab=18;p.fallY=p.y;p.sw=null;}return;}
  // трос
  if(p.st==='zip'){const w=p.zw,len=Math.hypot(w.x2-w.x1,w.y2-w.y1);p.zt+=2.7/len;p.face=sgn(w.x2-w.x1);
    p.x=lerp(w.x1,w.x2,p.zt);p.y=lerp(w.y1,w.y2,p.zt)+22;if(p.anim%6===0)fx('spark',p.x,p.y-23);
    if(p.zt>=1||p.jbuf){p.st='air';p.vx=p.face*2.6;p.vy=p.jbuf?-3:0;p.jbuf=0;p.noGrab=14;p.fallY=p.y;p.zw=null;}return;}
  // перекат
  if(p.roll>0){p.roll--;moveX(p,p.vx,PW,14);p.vy=Math.min(p.vy+0.35,7);const ld=moveY(p,p.vy,PW,14);if(ld)p.vy=0;if(p.roll===0){p.st='stand';if(boxHit(p.x,p.y,PW,22,isSolid))p.crouch=1;}return;}
  const grounded=onGround(p,PW);
  if(grounded)p.coyote=9;else if(p.coyote>0)p.coyote--;
  // начать лазание
  p.upT=IN.u?(p.upT||0)+1:0;
  if(p.atk===0&&p.noGrab===0&&(IN.uP||(IN.u&&grounded&&p.upT>6)||(IN.u&&!grounded&&p.vy>-1.5)||(p.cj>0&&!grounded))&&!crowdAt(p.x,p.y)){if(startClimb())return;}
  if(p.atk===0&&!grounded&&p.noGrab===0&&dir&&p.vy>-1.2&&wallSide(dir)!=null){if(tryGrab(dir))return;if(startClimb())return;}
  if(p.atk===0&&grounded&&IN.dP&&isOne(Math.floor(p.x/TS),Math.floor((p.y+1)/TS))){const bt=Math.floor((p.y+1)/TS);if(climbCell(Math.floor(p.x/TS),bt+1)){p.y+=18;p.st='climb';p.cm={k:'face'};return;}}
  // перекат: БЛОК + направление
  if(grounded&&IN.b&&dir&&(IN.lP||IN.rP||!p.rollLock)&&p.atk===0){p.roll=20;p.vx=dir*2.4;p.face=dir;p.inv=Math.max(p.inv,16);p.rollLock=1;sfx('roll');return;}
  if(!IN.b)p.rollLock=0;
  // атака
  const W0=WPN[p.wpn];
  if(IN.aP&&p.hurt===0){
    if(p.ctr>0&&p.ctrE&&!p.ctrE.dead){finisher(p.ctrE,'counter');p.ctr=0;p.atk=20;p.atkN=4;}
    else if(W0==='throw'){if(p.atk===0&&p.throwN>0){p.throwN--;p.atk=14;p.atkN=5;G.knives.push({x:p.x+p.face*8,y:p.y-15,vx:p.face*5.5,t:0});sfx('throw');if(p.throwN===0)p.wpn=0;}}
    else if(p.atk===0||p.atk<7){const asg=assassinTarget();if(asg){finisher(asg,asg.how);p.atk=22;p.atkN=4;}
      else{p.combo=p.comboT>0?Math.min(3,p.combo+1):1;p.atk=p.combo===3?20:15;p.atkN=p.combo;p.comboT=p.atk+12;p.hitDone=0;}}}
  if(p.atk>0){p.atk--;if(!p.hitDone&&p.atkN<=3&&p.atk<=(p.atkN===3?13:10)&&p.atk>=5){p.hitDone=attackHit();}}
  p.blk=IN.b&&grounded&&p.atk===0&&p.hurt===0&&!dir?1:0;
  const wantC=IN.d&&grounded&&!IN.j;
  if(wantC)p.crouch=1;else if(p.crouch){p.crouch=0;if(boxHit(p.x,p.y,PW,22,isSolid))p.crouch=1;}
  const cr=crowdAt(p.x,p.y);p.blend=cr&&grounded&&!p.crouch?1:0;
  let sp=p.crouch?0.65:p.blk?0:p.blend?0.75:1.85;if(p.atk>0&&grounded)sp=p.atkN===3?0.6:0.3;
  if(p.hurt>0){p.vx*=0.9;}else{const target=dir*sp;p.vx+=(target-p.vx)*(grounded?0.3:0.16);if(dir&&p.atk===0&&!p.blk)p.face=dir;}
  if(p.atk>0&&p.atkN===3&&grounded)p.vx=p.face*0.9;
  if(grounded&&dir&&Math.abs(p.vx)>1.3&&!p.crouch&&p.atk===0){const fx2=Math.floor((p.x+dir*(PW/2+3))/TS),fy=Math.floor((p.y-1)/TS);
    if(isSolid(fx2,fy)&&!isSolid(fx2,fy-1)&&!isTop(fx2,fy-1)&&!isSolid(Math.floor(p.x/TS),fy-2)){p.vy=-4.3;p.st='air';p.fallY=p.y;p.coyote=0;sfx('jump');p.vault=10;}}
  moveX(p,p.vx,PW,PH());
  if(p.jbuf&&(grounded||p.coyote>0)&&!p.crouch&&p.atk<8){p.vy=-5.8;p.coyote=0;p.jbuf=0;p.st='air';p.fallY=p.y;sfx('jump');
    if(Math.abs(p.vx)>1.4&&wallSide(p.face)!=null){p.vy=-6.6;}}
  else if(p.jbuf&&grounded&&IN.d&&isOne(Math.floor(p.x/TS),Math.floor((p.y+1)/TS))){p.dropT=10;p.y+=1;p.jbuf=0;p.crouch=0;}
  if(!IN.j&&p.vy<-2.5&&p.cj===0)p.vy+=0.3;
  p.vy=Math.min(p.vy+0.34,7.2);
  const wasAir=!grounded;if(p.dropT>0)p.dropT--;
  const landed=moveY(p,p.vy,PW,PH(),p.dropT>0);
  if(landed){if(p.vy>0.5&&wasAir)landCheck();p.vy=0;p.dive=0;if(p.st==='dead')return;p.st='stand';p.fallY=p.y;}
  else if(!onGround(p,PW)){if(p.st!=='air'){p.st='air';p.fallY=Math.min(p.fallY,p.y);}if(p.vy<0)p.fallY=p.y;
    const sb=p.y-p.fallY>30&&p.vy>1.5?softBelow(p.x,p.y):null;p.dive=sb&&p.y-p.fallY>48?1:0;
    if(sb){const dx=sb.x-p.x;p.vx=clamp(dx*0.07,-2.2,2.2);}// прыжок веры: Илья сам доворачивает в сено
    if(p.atk===0){if(!tryGrab(dir||p.face)){grabPole();grabWire();}}airKill();}
  else p.fallY=p.y;
  const hk=grounded&&Math.abs(p.vx)<0.6&&p.atk===0?hideAt(p.x,p.y):'';
  p.hidden=hk||p.blend&&p.atk===0?1:0;p.hideK=hk||(p.blend?'crowd':'');
  if(p.y>L.h*TS+40)die();}
function grabPole(){if(P.noGrab>0)return;const hx=P.x,hy=P.y-21;const tx=Math.floor(hx/TS),ty=Math.floor(hy/TS);
  for(let yy=ty-1;yy<=ty+1;yy++)for(let xx=tx-1;xx<=tx+1;xx++)if(tile(xx,yy)==='o'){const cx=xx*TS+8,cy=yy*TS+8;if(Math.abs(hx-cx)<14&&Math.abs(hy-cy)<12){
    P.st='swing';const f=sgn(P.vx)||P.face;P.sw={x:cx,y:cy,t:Math.PI/0.11*0.0,a:0,f};P.sw.t=0;P.vx=0;P.vy=0;P.face=f;sfx('grab');return;}}}
function grabWire(){if(P.noGrab>0||P.vy<-1)return;for(const w of L.wires){const hx=P.x,hy=P.y-22;const t=(hx-w.x1)/(w.x2-w.x1);if(t<0||t>0.9)continue;
  const wy=lerp(w.y1,w.y2,t);if(Math.abs(hy-wy)<7){P.st='zip';P.zw=w;P.zt=t;P.vx=0;P.vy=0;sfx('grab');return;}}}
/* скрытое убийство: сзади, из укрытия, из толпы */
function assassinTarget(){for(const e of L.enemies){if(e.dead||e.k==='line')continue;const dx=(e.x-P.x)*P.face;if(dx<-2||dx>18||Math.abs(e.y-P.y)>14)continue;
  if(e.st!=='alert'&&e.face===P.face)return Object.assign(e,{how:'back'});
  if(P.hidden&&e.st!=='alert')return Object.assign(e,{how:'hide'});}return null;}
function attackHit(){let hit=false;const knife=WPN[P.wpn]==='knife';for(const e of L.enemies){if(e.dead)continue;const dx=(e.x-P.x)*P.face;
  if(dx>-4&&dx<(knife?22:18)&&Math.abs(e.y-P.y)<18){hit=true;
    if(e.k==='line'){sfx('clang');fx('spark',e.x,e.y-14);continue;}
    if(e.st!=='alert'&&e.face===P.face){finisher(e,'back');continue;}
    const bc={cop:0.3,soldier:0.25,officer:0.55}[e.k];
    if(P.atkN<3&&e.wind===0&&e.stun===0&&e.face===-P.face&&Math.random()<bc){sfx('clang');fx('spark',e.x-e.face*6,e.y-15);e.cd=Math.max(e.cd,8);alertE(e);continue;}
    const dmg=knife?(P.atkN===3?2:1):1;e.hp-=dmg;e.stun=P.atkN===3?30:16;e.x=clamp(e.x+P.face*(P.atkN===3?6:3),e.x1,e.x2);e.wind=0;if(G.tok===e)G.tok=null;
    sfx('hit');fx('blood',e.x,e.y-13);alertE(e);if(e.hp<=0)finisher(e,'fight');}}
  if(hit)G.shake=3;return hit;}
function airKill(){if(P.vy<1.5)return;for(const e of L.enemies){if(e.dead||e.k==='line')continue;
  if(Math.abs(e.x-P.x)<11&&P.y>e.y-28&&P.y<e.y-8){finisher(e,'air');P.vy=-2.5;P.fallY=P.y;return;}}}
function finisher(e,how){e.dead=1;e.dt=0;e.st='dead';e.how=how;e.dface=sgn(P.x-e.x)||1;if(G.tok===e)G.tok=null;G.kills++;
  const silent=(how==='back'||how==='hide'||how==='air')&&WPN[P.wpn]!=='knife';
  if(silent)G.silent++;else for(const o of L.enemies)if(!o.dead&&o!==e&&Math.abs(o.x-e.x)<90&&Math.abs(o.y-e.y)<30&&o.st!=='alert')o.meter=Math.min(1,o.meter+0.6);
  P.kill=24;G.slow=how==='fight'?0:22;buzz(how==='fight'?20:35);sfx(silent?'blade':'kill');fx('blood',e.x,e.y-13);G.shake=5;
  toastTxt({air:'Удар сверху!',counter:'Контрудар!',back:silent?'Тихий удар':'Удар в спину',hide:'Удар из укрытия',fight:''}[how]||'');}

/* ================= ВРАГИ ================= */
const RANGE={cop:84,soldier:120,officer:90,line:150};
function canSee(e){if(P.st==='dead'||P.hidden)return false;const dx=P.x-e.x,dy=P.y-e.y;
  if(Math.abs(dy)>34)return false;if(dx*e.face<-6)return false;if(Math.abs(dx)>RANGE[e.k])return false;
  const ty=Math.floor((e.y-18)/TS);for(let x=Math.min(e.x,P.x);x<Math.max(e.x,P.x);x+=8)if(isSolid(Math.floor(x/TS),ty))return false;return true;}
function alertE(e,quiet){if(e.st!=='alert'){e.st='alert';e.lost=0;e.meter=1;G.alarms++;if(!quiet)sfx('alert');}e.face=sgn(P.x-e.x)||e.face;}
function enemyStrike(e,heavy){const dx=P.x-e.x;e.cd=45+R(rnd(0,30));if(G.tok===e)G.tok=null;
  if(Math.abs(dx)<26&&Math.abs(P.y-e.y)<20&&P.roll===0){
    if(P.blk&&P.face===-sgn(dx||1)){if(heavy){sfx('clang');damage(2,e.x);toastTxt('Блок пробит!');}else{sfx('clang');fx('spark',e.x+e.face*10,e.y-15);P.ctr=22;P.ctrE=e;e.stun=24;}}
    else damage(heavy?2:1,e.x);}}
function updEnemies(){let alert=0,susp=0;
  for(const e of L.enemies){e.anim++;
    if(e.k==='line'&&!e.dead&&Math.abs(P.y-e.y)<20&&P.x>e.x-12&&P.x<e.x+12){P.x=e.x-12;P.vx=Math.min(P.vx,0);}
    if(e.dead){e.dt++;continue;}if(e.stun>0)e.stun--;if(e.cd>0)e.cd--;
    const see=canSee(e);const dx=P.x-e.x,adx=Math.abs(dx),ady=Math.abs(P.y-e.y);
    if(e.st==='alert'){alert++;
      if(see){e.lost=0;}else if(++e.lost>240){e.st='search';e.t=150;e.meter=0.5;if(G.tok===e)G.tok=null;continue;}
      if(e.stun>0){continue;}
      if(e.wind>0){e.wind--;if(e.wind===0)enemyStrike(e,e.heavy);continue;}
      if(adx>4)e.face=sgn(dx);
      const ranged=e.k==='soldier'||e.k==='line';
      if(ranged&&(adx>40||e.k==='line')){if(see){e.aim++;const need=e.k==='line'?44:60;if(e.aim>=need){e.aim=0;e.cd=e.k==='line'?40:80;shoot(e);}}else e.aim=Math.max(0,e.aim-2);
        if(e.k==='soldier'&&adx<70&&ady<20){const nx=clamp(e.x-sgn(dx)*0.5,e.x1,e.x2);e.x=nx;}continue;}
      e.aim=0;
      if(ady>22){continue;}
      const want=G.tok===null||G.tok===e?18:34;
      if(adx>want+2){e.x=clamp(e.x+sgn(dx)*(adx>60?1.2:0.8),e.x1,e.x2);}
      else if(adx<want-8&&G.tok!==e){e.x=clamp(e.x-sgn(dx)*0.5,e.x1,e.x2);}
      if(adx<=26&&e.cd===0&&(G.tok===null||G.tok.dead)&&P.st!=='dead'){G.tok=e;e.heavy=e.k==='officer'&&(++e.heavyN%2===0);e.wind=e.heavy?40:26;}}
    else{
      if(see){const r=RANGE[e.k];const k=e.k==='line'?0.06:(1.4-adx/r)*(P.crouch?0.016:0.03)*(Math.abs(P.vx)>1.3?1.6:1)*(P.st==='climb'?1.4:1);e.meter=Math.min(1,e.meter+k);if(e.meter>=1)alertE(e);}
      else e.meter=Math.max(0,e.meter-0.004);
      if(e.meter>0.3)susp++;
      if(e.k==='line'){e.face=-1;continue;}
      if(e.st==='search'){if(--e.t<=0)e.st='patrol';if(e.anim%70===0)e.face*=-1;continue;}
      if(e.guard){continue;}
      if(e.wait>0){e.wait--;continue;}
      e.x+=e.face*0.42;if(e.x>=e.x2){e.x=e.x2;e.face=-1;e.wait=80;}else if(e.x<=e.x1){e.x=e.x1;e.face=1;e.wait=80;}}}
  if(G.tok&&(G.tok.dead||G.tok.st!=='alert'))G.tok=null;
  G.alert=alert;G.susp=susp;
  setMusic(G.tgt&&G.tgt.run?'chase':alert?'tense':'calm');}
function shoot(e){sfx('shot');G.shake=4;const dy=Math.abs(P.y-e.y),dx=P.x-e.x;fx('flash',e.x+e.face*15,e.y-16);
  const inLine=dx*e.face>0&&Math.abs(dx)<(e.k==='line'?170:160)&&dy<20&&!P.crouch&&P.roll===0&&P.st!=='hang'&&!P.hidden;
  fx('tracer',e.x+e.face*15,e.y-16,{x2:inLine?P.x:e.x+e.face*170});if(inLine)damage(e.k==='line'?2:1,e.x);}
function updKnives(){for(const k of G.knives){k.x+=k.vx;k.t++;
  if(isSolid(Math.floor(k.x/TS),Math.floor(k.y/TS))){k.dead=1;fx('spark',k.x,k.y);continue;}
  for(const e of L.enemies){if(e.dead||e.k==='line')continue;if(Math.abs(e.x-k.x)<6&&k.y>e.y-26&&k.y<e.y){k.dead=1;
    if(e.st!=='alert'){finisher(e,'back');}else{e.hp--;e.stun=20;sfx('hit');fx('blood',e.x,e.y-13);if(e.hp<=0)finisher(e,'fight');}break;}}
  if(k.t>60)k.dead=1;}G.knives=G.knives.filter(k=>!k.dead);}

/* ================= ТОЛПА ================= */
function updCrowds(){for(const c of L.crowds){if(c.gone)continue;for(const m of c.ms)m.ph+=c.flee?0.35:0.12;
  if(c.flee){c.x-=1.6;if(c.x<-60)c.gone=1;continue;}
  c.x+=c.dir*c.sp;if(c.x>c.x2){c.x=c.x2;c.dir=-1;}if(c.x<c.x1){c.x=c.x1;c.dir=1;}}}

/* ================= ЦЕЛЬ: ПОГОНЯ ================= */
function startChase(){if(G.tgt)return;const T=L.target;G.tgt={x:T.x,y:T.y,i:0,run:1,t:0,far:0,face:1,mode:'run',ph:0};
  setObj('Догони человека в штатском!');toastTxt('ПОГОНЯ');sfx('alert');snapCP();}
function updTarget(){const t=G.tgt;if(!t||!t.run)return;t.t++;t.ph+=0.3;const path=L.target.path;
  const d=Math.hypot(P.x-t.x,P.y-t.y);
  let sp=d<60?1.75:d>150?1.15:1.55;
  if(t.i<path.length-1){const a=path[t.i],b=path[t.i+1];const mode=b[2];t.mode=mode;const len=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(mode==='zip')sp=2.5;t.seg=(t.seg||0)+sp/len;
    const k=Math.min(1,t.seg);t.x=lerp(a[0],b[0],k);t.y=lerp(a[1],b[1],k);if(mode==='jump')t.y-=Math.sin(k*Math.PI)*28;
    if(mode==='zip'){t.y=lerp(a[1],b[1],k);}
    t.face=sgn(b[0]-a[0])||t.face;if(t.seg>=1){t.i++;t.seg=0;}}
  else{t.mode='stop';t.face=-1;}
  if(d>260)t.far++;else t.far=0;
  if(t.far>150&&P.st!=='dead'){t.run=0;cutscene(['Человек в штатском скрылся.','Цель ушла. Ещё раз — с контрольной точки.'],()=>restoreCP());return;}
  if(d<16&&Math.abs(P.y-t.y)<16&&P.st!=='dead')tackle();}
function tackle(){const t=G.tgt;t.run=0;t.caught=1;P.st='tackle';P.vx=0;P.vy=0;sfx('hit');G.shake=8;G.slow=20;
  dialog([['narr','Илья сбивает его с ног у самого края крыши.'],['agent','Ты… быстрый, мальчишка…'],['ilya','Кто ты такой? Зачем ты подал им знак?'],
    ['agent','Я — никто. Секундная стрелка. Часы заводят другие.'],['ilya','Кто?'],
    ['agent','«Циферблат». Им всё равно, кто победит — царь или толпа. Важно, кто держит стрелки.'],
    ['agent','Сегодня кровь, завтра страх. А страх хорошо платит…'],['ilya','Мой отец погиб из-за вас.'],
    ['agent','Сотни отцов, мальчик. Время всех рассудит. А перстень… Перстень они тебе не простят.'],
    ['narr','Залп с соседней крыши. Человек в штатском обмякает. Свидетелей «Циферблат» не оставляет.']],()=>{
    t.dead=1;P.st='stand';G.flags.escape=1;giveRing();setMusic('tense');sfx('whistle');
    setObj('Уходи! Оторвись от погони и спрячься, потом беги к арке.');

  if(ST.scene!=='game')return;
  if(ST.dlg||ST.modal)return;
  if(G.syncT>0){G.syncT--;G.camX+=((G.tgt?0:0))*0;if(G.syncT===0)endSync();}

  G.vision+=((IN.v&&P.st!=='dead'?1:0)-G.vision)*0.15;
  if(G.shake>0)G.shake*=0.85;
  if(P.st==='dead'){G.deadT++;if(G.deadT>90)restoreCP();}}
