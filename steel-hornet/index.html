<p>«Стальной Шершень» переехал.<br><a href="../games/shershen/">Открыть игру</a> · <a href="../">Все игры Rejar Box</a></p>
<script>
// Старый адрес: убираем прежний офлайн-кэш этой папки и уходим на новый адрес. Рекорды сохраняются.
(async()=>{try{if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())if(/\/steel-hornet\/$/.test(r.scope))await r.unregister();}
  if(window.caches)for(const k of await caches.keys())if(k.startsWith('hornet-'))await caches.delete(k);}catch(e){}
  location.replace('../games/shershen/');})();
</script>
