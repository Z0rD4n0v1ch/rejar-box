<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rejar Box</title>
<meta name="description" content="Rejar Box — бесплатные ремейки старых Java-игр для телефона, со своей графикой и музыкой.">
<meta name="theme-color" content="#11150d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=PT+Mono&display=swap">
<style>
/* Shelf of game cartridges: dark olive field, amber accents, one column on phones */
:root{--bg:#11150d;--panel:#1a2013;--line:#3a4a26;--fg:#e8e2c8;--muted:#9db36a;--accent:#e8b33a;--good:#9fe07a;color-scheme:dark;
  --disp:'Russo One','Arial Black',sans-serif;--mono:'PT Mono','Courier New',monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--mono);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:720px;margin:0 auto;padding-block:max(32px,env(safe-area-inset-top,0px)) 56px}
header{display:flex;align-items:center;gap:14px}
header img{width:56px;height:56px;image-rendering:pixelated}
h1{font:400 clamp(36px,9vw,60px)/1 var(--disp);color:var(--accent);margin:0;letter-spacing:.02em}
.tag{color:var(--muted);margin:14px 0 20px;max-width:56ch}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:24px;min-height:8px}
.btn{font:400 15px var(--disp);background:var(--accent);color:#14160f;border:0;padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.note{font-size:13px;color:#c8c2a8}
.status{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.status.off{color:#ffb36b}
.games{display:grid;gap:14px}
.game{display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);
  padding:20px;text-decoration:none;color:inherit}
.game:hover,.game:focus-visible{border-color:var(--accent);outline:none}
.game img{width:120px;height:auto;image-rendering:pixelated}
.game h2{font:400 26px/1.1 var(--disp);margin:0 0 6px;color:var(--fg)}
.game p{margin:0;color:#c8c2a8;font-size:14px}
.meta{margin-top:10px;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.prog{margin-top:12px;font-size:13px;display:grid;gap:4px}
.prog .row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed #2c3820;padding-bottom:2px}
.prog .row b{font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;margin-top:2px}
.dots i{width:14px;height:6px;background:#2c3820;display:block}
.dots i.on{background:var(--good)}
.play{display:inline-block;margin-top:12px;background:var(--accent);color:#14160f;font:400 15px var(--disp);padding:8px 16px}
footer{margin-top:40px;font-size:13px;color:#7a7d6a}
@media (max-width:480px){.game{grid-template-columns:1fr}.game img{width:100%;max-width:220px}}
</style>
</head>
<body>
<main>
  <header><img src="icon-192.png" alt=""><h1>REJAR BOX</h1></header>
  <p class="tag">Старые Java-игры с кнопочных телефонов, пересобранные заново: своя графика, своя музыка, играется прямо в браузере телефона. Бесплатно.</p>

  <div class="bar">
    <button class="btn" id="install" hidden>Установить Rejar Box</button>
    <span class="note" id="hint" hidden>Установка: меню Chrome ⋮ → «Добавить на главный экран»</span>
    <span class="status" id="net"></span>
  </div>

  <section class="games" id="games"></section>

  <footer>Rejar Box · все спрайты и музыка сделаны для этого проекта · рекорды хранятся на этом устройстве</footer>
</main>
<script>
// Каталог игр. Новая игра — новая запись: папка, обложка, описание и как читать её прогресс.
const GAMES=[
  {id:'steel-hornet',title:'Стальной Шершень',cover:'steel-hornet/cover.png',
   desc:'Вертолёт против станции в городе, бронепоезда и корабля-базы, а пешком — штурм штаба и порта. Пять миссий, три сложности, звания и рекорды.',
   meta:'Шутер · 5 миссий · телефон и ПК',
   progress(get){
     const N=5,D=['Легко','Норма','Тяжело'];let done=0;const best=[0,0,0];
     for(let m=0;m<N;m++){let any=false;for(let d=0;d<3;d++){const v=+get('hornet_hi_d'+d+'_m'+m)||0;if(v>0)any=true;best[d]+=v;}if(any)done++;}
     const unlocked=Math.min(N,(+get('hornet_unlock')||0)+1);
     const rows=[];D.forEach((n,d)=>{if(best[d])rows.push(['Сумма рекордов · '+n,best[d].toLocaleString('ru-RU')]);});
     return {done,total:N,open:unlocked,rows};}}
];
const get=k=>{try{const v=localStorage.getItem(k);return v==null?null:JSON.parse(v);}catch(e){return null;}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const box=document.getElementById('games');box.innerHTML='';
  for(const g of GAMES){
    let P=null;try{P=g.progress(get);}catch(e){}
    const a=document.createElement('a');a.className='game';a.href=g.id+'/';
    let prog='';
    if(P){const dots=Array.from({length:P.total},(_,i)=>'<i class="'+(i<P.done?'on':'')+'"></i>').join('');
      prog='<div class="prog"><div class="row"><span>Пройдено миссий</span><b>'+P.done+' / '+P.total+'</b></div><div class="dots" aria-hidden="true">'+dots+'</div>'+
        P.rows.map(r=>'<div class="row"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>').join('')+'</div>';}
    const started=P&&(P.done>0||P.open>1);
    a.innerHTML='<img src="'+esc(g.cover)+'" alt="'+esc(g.title)+'"><div><h2>'+esc(g.title)+'</h2><p>'+esc(g.desc)+'</p><div class="meta">'+esc(g.meta)+'</div>'+prog+
      '<span class="play">'+(started?'Продолжить':'Играть')+'</span></div>';
    box.appendChild(a);}
}
render();
addEventListener('pageshow',render);addEventListener('storage',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
// установка и офлайн
const inst=document.getElementById('install'),hint=document.getElementById('hint'),net=document.getElementById('net');
const standalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
let ev=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;inst.hidden=false;hint.hidden=true;});
inst.addEventListener('click',async()=>{if(!ev)return;ev.prompt();try{await ev.userChoice;}catch(e){}ev=null;inst.hidden=true;});
addEventListener('appinstalled',()=>{inst.hidden=true;hint.hidden=true;});
if(!standalone())setTimeout(()=>{if(!ev)hint.hidden=false;},2500);
function netState(){net.textContent=navigator.onLine?'':'Нет сети — игры работают из кэша';net.className='status'+(navigator.onLine?'':' off');}
addEventListener('online',netState);addEventListener('offline',netState);netState();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>{if(navigator.serviceWorker.controller&&!net.textContent)net.textContent='Доступно без интернета';}).catch(()=>{});
</script>
</body>
</html>
