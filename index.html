<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12150F">
  <title>Rejar Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=PT+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12150F;
      --card: #1A1F17;
      --line: #3A4A28;
      --text: #D4CDB6;
      --green: #8FBF5A;
      --dim: #6E7A5E;
      --yellow: #E8B33A;
      --yellow-ink: #1A1A10;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: inherit; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "PT Mono", "Courier New", monospace;
      font-size: 15px;
      line-height: 1.6;
    }

    .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 32px; }

    h1 {
      margin: 0;
      font-family: "Russo One", "Arial Black", sans-serif;
      font-weight: 400;
      font-size: clamp(40px, 9vw, 60px);
      line-height: 1;
      text-transform: uppercase;
      color: var(--yellow);
    }
    .lead { max-width: 36em; margin: 18px 0 36px; color: var(--green); }

    .games { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }

    .card {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 20px;
      align-items: center;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--line);
    }
    .card:focus-within { border-color: var(--yellow); }

    .cover { width: 140px; height: 96px; display: grid; place-items: center; }
    .cover img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
    .cover .letter { font-family: "Russo One", sans-serif; font-size: 44px; color: var(--line); }

    .card h2 {
      margin: 0 0 6px;
      font-family: "Russo One", "Arial Black", sans-serif;
      font-weight: 400;
      font-size: 22px;
      line-height: 1.2;
      color: #EFE9D6;
    }
    .card p { margin: 0 0 10px; font-size: 14px; }
    .tags { margin: 0 0 14px; font-size: 12px; color: var(--green); text-transform: uppercase; letter-spacing: 0.5px; }

    .play {
      display: inline-block;
      padding: 7px 16px;
      background: var(--yellow);
      color: var(--yellow-ink);
      font-family: "Russo One", sans-serif;
      font-size: 15px;
      text-decoration: none;
    }
    .play:hover { background: #F5C653; }
    .play:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

    .empty { color: var(--dim); }
    .empty code { color: var(--text); }

    footer { margin-top: 48px; font-size: 13px; color: var(--dim); }

    @media (max-width: 520px) {
      .wrap { padding-top: 28px; }
      .card { grid-template-columns: 1fr; gap: 12px; }
      .cover { width: 100%; height: 110px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Rejar Box</h1>
    <p class="lead">Старые Java-игры с кнопочных телефонов, пересобранные заново: своя графика, своя музыка, играется прямо в браузере телефона. Бесплатно.</p>

    <ul class="games" id="games"></ul>

    <footer>Rejar Box · все спрайты и музыка сделаны для этого проекта</footer>
  </div>

  <script src="games/list.js"></script>
  <script>
    (function () {
      const games = (window.REJAR_GAMES || []).filter((g) => !g.hidden);
      const list = document.getElementById('games');

      if (!games.length) {
        list.outerHTML = '<p class="empty">Игр пока нет. Скопируй папку <code>games/template</code> и добавь строку в <code>games/list.js</code>.</p>';
        return;
      }

      const links = games.map((g) => {
        const li = document.createElement('li');
        li.className = 'card';

        const cover = document.createElement('div');
        cover.className = 'cover';
        const src = g.cover || g.icon;
        if (src) {
          const img = document.createElement('img');
          img.src = src;
          img.alt = '';
          cover.appendChild(img);
        } else {
          const l = document.createElement('span');
          l.className = 'letter';
          l.textContent = (g.title || '?').trim()[0].toUpperCase();
          cover.appendChild(l);
        }

        const body = document.createElement('div');
        const h = document.createElement('h2');
        h.textContent = g.title;
        body.appendChild(h);

        const text = g.note || g.desc;
        if (text) {
          const p = document.createElement('p');
          p.textContent = text;
          body.appendChild(p);
        }
        if (g.tags && g.tags.length) {
          const t = document.createElement('div');
          t.className = 'tags';
          t.textContent = g.tags.join(' · ');
          body.appendChild(t);
        }

        const a = document.createElement('a');
        a.className = 'play';
        a.href = g.path || ('games/' + g.id + '/');
        a.textContent = 'Играть';
        body.appendChild(a);

        li.append(cover, body);
        list.appendChild(li);
        return a;
      });

      // Стрелки переключают игры, цифры 1–9 запускают сразу
      document.addEventListener('keydown', (e) => {
        const i = links.indexOf(document.activeElement);
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const step = e.key === 'ArrowDown' ? 1 : -1;
          const next = i < 0 ? 0 : (i + step + links.length) % links.length;
          links[next].focus();
        } else if (/^[1-9]$/.test(e.key) && links[+e.key - 1]) {
          location.href = links[+e.key - 1].href;
        }
      });
    })();
  </script>
</body>
</html>
