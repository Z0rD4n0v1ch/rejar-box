<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172014">
  <title>Rejar Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #A9A48F;
      --bezel: #3B4248;
      --bezel-edge: #59626A;
      --screen: #172014;
      --ink: #CDBE8E;
      --ink-dim: #8D8763;
      --sel: #CDBE8E;
      --sel-ink: #172014;
      --rust: #9C4A26;
      --olive: #4F5B32;
      color-scheme: light dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --page: #1E2326; --bezel: #2F353A; --bezel-edge: #4A535A; }
    }
    :root[data-theme="dark"] { --page: #1E2326; --bezel: #2F353A; --bezel-edge: #4A535A; }

    *, *::before, *::after { box-sizing: inherit; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--page);
      font-family: "Pixelify Sans", "Courier New", monospace;
      display: grid;
      place-items: center;
      padding: 24px 12px;
    }

    .phone {
      width: min(100%, 360px);
      background: var(--bezel);
      border-radius: 30px;
      padding: 20px 14px 28px;
      box-shadow: inset 0 0 0 2px var(--bezel-edge);
    }
    .speaker {
      width: 56px; height: 5px; margin: 0 auto 14px;
      border-radius: 3px; background: var(--bezel-edge);
    }

    .screen {
      background: var(--screen);
      color: var(--ink);
      border: 3px solid #0E140C;
      border-radius: 6px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .status {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 6px 10px 4px; font-size: 14px; color: var(--ink-dim);
    }
    .bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
    .bars i { width: 3px; background: var(--ink-dim); display: block; }
    .bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 6px; }
    .bars i:nth-child(3) { height: 9px; } .bars i:nth-child(4) { height: 12px; }

    .brand {
      margin: 18px 12px 16px;
      font-size: 40px; font-weight: 600; line-height: 1;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0 var(--rust);
    }
    .brand small {
      display: block; margin-top: 10px;
      font-size: 14px; font-weight: 400; letter-spacing: 0;
      color: var(--ink-dim); text-shadow: none;
    }

    .list { list-style: none; margin: 0; padding: 0; flex: 1; overflow-y: auto; }
    .item {
      display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center;
      padding: 7px 12px; color: inherit; text-decoration: none; font-size: 18px;
    }
    .item:hover, .item:focus, .item.sel { background: var(--sel); color: var(--sel-ink); outline: none; }
    .item:focus-visible { box-shadow: inset 0 0 0 2px var(--rust); }
    .num { font-size: 14px; opacity: 0.7; }
    .icon {
      width: 34px; height: 34px; display: grid; place-items: center;
      background: var(--olive); color: var(--ink); font-size: 20px; font-weight: 600;
      image-rendering: pixelated;
    }
    img.icon { background: none; object-fit: contain; }

    .desc {
      min-height: 3.2em; padding: 8px 12px; font-size: 15px; line-height: 1.35;
      color: var(--ink-dim); border-top: 2px solid var(--olive);
    }
    .empty { padding: 12px; font-size: 15px; line-height: 1.4; color: var(--ink-dim); }
    .empty code { color: var(--ink); }

    .softkeys { display: flex; justify-content: space-between; border-top: 2px solid var(--olive); }
    .softkeys button {
      background: none; border: 0; color: var(--ink); font: inherit; font-size: 17px;
      padding: 10px 12px; cursor: pointer;
    }
    .softkeys button:focus-visible { outline: 2px solid var(--rust); outline-offset: -2px; }

    @media (max-width: 480px) {
      body { padding: 0; place-items: stretch; background: var(--screen); }
      .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; background: var(--screen); }
      .speaker { display: none; }
      .screen { height: 100%; min-height: 0; border: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="speaker"></div>
    <main class="screen">
      <div class="status">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span id="clock"></span>
      </div>

      <h1 class="brand">Rejar Box<small>Старые Java-игры, собранные заново</small></h1>

      <ul class="list" id="list"></ul>
      <p class="desc" id="desc" aria-live="polite"></p>

      <nav class="softkeys">
        <button id="play">Играть</button>
        <button id="mute"></button>
      </nav>
    </main>
  </div>

  <script src="games/list.js"></script>
  <script>
    (function () {
      const games = window.REJAR_GAMES || [];
      const list = document.getElementById('list');
      const desc = document.getElementById('desc');
      const playBtn = document.getElementById('play');
      const muteBtn = document.getElementById('mute');
      let sel = 0;

      // Звук: тот же ключ, что читает shared/engine.js
      function isMuted() { try { return JSON.parse(localStorage.getItem('rejar:muted')) === true; } catch (e) { return false; } }
      function setMuted(v) { try { localStorage.setItem('rejar:muted', JSON.stringify(v)); } catch (e) {} }
      function renderMute() { muteBtn.textContent = isMuted() ? 'Звук выкл' : 'Звук вкл'; }
      muteBtn.addEventListener('click', () => { setMuted(!isMuted()); renderMute(); });
      renderMute();

      function tick() {
        const d = new Date();
        document.getElementById('clock').textContent =
          String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }
      tick();
      setInterval(tick, 20000);

      if (!games.length) {
        list.outerHTML = '<p class="empty">Игр пока нет. Скопируй папку <code>games/template</code> и добавь строку в <code>games/list.js</code>.</p>';
        playBtn.disabled = true;
        return;
      }

      const items = games.map((g, i) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'item';
        a.href = g.path || ('games/' + g.id + '/');

        let icon;
        if (g.icon) {
          icon = document.createElement('img');
          icon.src = g.icon;
          icon.alt = '';
        } else {
          icon = document.createElement('span');
          icon.textContent = (g.title || '?').trim()[0].toUpperCase();
        }
        icon.className = 'icon';

        const title = document.createElement('span');
        title.textContent = g.title;

        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = i < 9 ? String(i + 1) : '';

        a.append(icon, title, num);
        a.addEventListener('focus', () => select(i, false));
        a.addEventListener('mouseenter', () => select(i, false));
        li.appendChild(a);
        list.appendChild(li);
        return a;
      });

      function select(i, focus) {
        sel = (i + items.length) % items.length;
        items.forEach((el, k) => el.classList.toggle('sel', k === sel));
        desc.textContent = games[sel].note || '';
        if (focus) items[sel].focus();
      }

      function launch(i) { location.href = items[i].href; }

      playBtn.addEventListener('click', () => launch(sel));

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); select(sel + 1, true); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); select(sel - 1, true); }
        else if (/^[1-9]$/.test(e.key) && items[+e.key - 1]) launch(+e.key - 1);
      });

      select(0, false);
    })();
  </script>
</body>
</html>
